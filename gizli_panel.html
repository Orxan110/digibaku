<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DigiBaku — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#050505;color:#fff;min-height:100vh}
.container{width:92%;max-width:850px;margin:auto}
header{background:#090909;border-bottom:1px solid #222}
.nav{height:70px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:24px;font-weight:900;color:#3b82f6}.logo span{color:#fff}
.back{color:#aaa;text-decoration:none}
main{padding:25px 0}
#loading{text-align:center;color:#888;padding:60px}
#adminPanel{display:none}

.section{background:#101010;border:1px solid #292929;border-radius:15px;margin-bottom:12px;overflow:hidden}
.section-head{width:100%;padding:19px;background:#101010;border:0;color:#fff;display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:16px;font-weight:bold}
.section-head:hover{background:#151515}
.arrow{color:#60a5fa;font-size:18px}
.section-body{display:none;padding:20px;border-top:1px solid #242424}
.section.open .section-body{display:block}
.section.open .arrow{transform:rotate(180deg)}

label{display:block;color:#aaa;font-size:13px;font-weight:bold;margin:0 0 7px}
input,select,textarea{width:100%;padding:13px;margin-bottom:15px;border-radius:9px;border:1px solid #333;background:#080808;color:#fff;outline:none}
textarea{min-height:110px;resize:vertical}
button{cursor:pointer}
.main-btn,.save{width:100%;padding:13px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:bold}
.save{background:#16a34a;margin-top:5px}
.delete{background:#991b1b;color:#fff;border:0;border-radius:8px;padding:10px;width:100%;margin-top:12px}
.message{display:none;padding:12px;border-radius:9px;margin-top:12px;background:#0b2b1d;color:#86efac}
.message.error{background:#2b0b0b;color:#fca5a5}

.customer-info{display:none;background:#080808;border:1px solid #222;border-radius:9px;padding:11px;margin-bottom:15px;color:#60a5fa;font-size:13px}

.price-product,.product,.order-card{background:#080808;border:1px solid #292929;border-radius:11px;padding:15px;margin-bottom:12px}
.price-product h3,.product strong{color:#60a5fa;margin-bottom:12px;display:block}
.price-month{border:1px solid #222;border-radius:9px;padding:12px;margin-bottom:10px}
.price-title{font-weight:bold;margin-bottom:10px}
.price-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;gap:8px;align-items:center;color:#aaa;font-size:13px;margin-bottom:8px}
.switch input{width:auto;margin:0}
.sale{color:#86efac;font-size:13px;font-weight:bold}

.product strong{font-size:16px}
.product div{font-size:13px;color:#aaa;line-height:1.7}
.product .active{color:#86efac}
.product .expired{color:#f87171}

.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.summary-box{padding:14px;background:#080808;border:1px solid #292929;border-radius:10px}
.summary-box small{display:block;color:#888}.summary-box b{font-size:22px;color:#60a5fa}
.notification{border-color:#ca8a04;color:#facc15;cursor:pointer}

.chat-layout{display:grid;grid-template-columns:250px 1fr;gap:12px}
.chat-list,.chat-box{background:#080808;border:1px solid #292929;border-radius:10px;overflow:hidden}
.chat-list{max-height:450px;overflow-y:auto}
.chat-user{padding:13px;border-bottom:1px solid #222;cursor:pointer}
.chat-user.active{background:#172554;border-left:3px solid #3b82f6}
.chat-user b{display:block;font-size:13px;word-break:break-all}
.chat-user small{color:#888}
.chat-box{display:flex;flex-direction:column}
.chat-header{padding:13px;border-bottom:1px solid #222;color:#60a5fa;font-weight:bold}
.chat-status{padding:10px;border-bottom:1px solid #222;font-size:13px}
.chat-status b{color:#60a5fa}
.chat-messages{height:300px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:9px 12px;border-radius:10px;font-size:13px}
.msg.customer{background:#1b1b1b;align-self:flex-start}
.msg.admin{background:#2563eb;align-self:flex-end}
.chat-send{padding:10px;border-top:1px solid #222}
.chat-send textarea{min-height:65px;margin-bottom:7px}

.order-card{position:relative}
.order-card.new{border-color:#ca8a04}
.order-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.order-title{color:#60a5fa;font-weight:bold}
.order-info{font-size:13px;color:#aaa;line-height:1.7}
.status{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:bold;margin:7px 0}
.pending{background:#ca8a04}.confirmed{background:#16a34a}.processing{background:#2563eb}.completed{background:#4b5563}.cancelled{background:#991b1b}
.order-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.order-actions select,.order-actions button{margin:0}

.empty{text-align:center;color:#777;padding:20px}
.hidden{display:none!important}

@media(max-width:600px){
.price-row,.chat-layout,.order-actions,.summary{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="container nav">
<div class="logo">DigiBaku<span>.com</span></div>
<a href="index.html" class="back">← Sayta qayıt</a>
</div>
</header>

<main>
<div class="container">

<div id="loading">Admin yoxlanılır...</div>

<div id="adminPanel">

<!-- QİYMƏTLƏR -->
<div class="section">
<button class="section-head" onclick="toggleSection(this)">
<span>💰 Qiymət və Endirimlər</span><span class="arrow">▼</span>
</button>
<div class="section-body">
<div id="pricesList"><div class="empty">Yüklənir...</div></div>
<div id="priceMsg" class="message"></div>
</div>
</div>

<!-- MƏHSUL VER -->
<div class="section">
<button class="section-head" onclick="toggleSection(this)">
<span>🎁 Müştəriyə Məhsul Ver</span><span class="arrow">▼</span>
</button>
<div class="section-body">

<p style="color:#888;margin-bottom:18px">
Ödənişdən sonra məhsulu müştəriyə əlavə et
</p>

<label>Müştəri</label>
<select id="customerSelect">
<option value="">Müştəri seçin...</option>
</select>

<div id="selectedCustomer" class="customer-info"></div>

<label>Məhsul</label>
<select id="productSelect" onchange="showProductPrices()">
<option value="">Məhsul seçin...</option>
<option value="Netflix Premium">Netflix Premium</option>
<option value="YouTube Premium">YouTube Premium</option>
<option value="ChatGPT Plus">ChatGPT Plus</option>
<option value="Google Gemini Premium">Google Gemini Premium</option>
<option value="Spotify Premium">Spotify Premium</option>
<option value="Canva Premium">Canva Premium</option>
</select>

<div id="productPrices" class="hidden"></div>

<label>Müştəriyə veriləcək hesab məlumatı</label>
<textarea id="accountInfo" placeholder="Email, şifrə və ya hesab məlumatı"></textarea>

<button class="main-btn" id="addButton" onclick="addProduct()">
Məhsulu müştəriyə əlavə et
</button>

<div id="message" class="message"></div>
</div>
</div>

<!-- VERİLMİŞ MƏHSULLAR -->
<div class="section">
<button class="section-head" onclick="toggleSection(this)">
<span>📦 Verilmiş Məhsullar</span><span class="arrow">▼</span>
</button>
<div class="section-body">
<p style="color:#888;margin-bottom:15px">
Müştərilərə verilmiş məhsullara bax
</p>
<div id="productsList"><div class="empty">Yüklənir...</div></div>
</div>
</div>

<!-- CHAT -->
<div class="section">
<button class="section-head" onclick="toggleSection(this)">
<span>💬 Müştəri Çatı</span><span class="arrow">▼</span>
</button>
<div class="section-body">

<div class="chat-layout">
<div class="chat-list" id="chatCustomers">
<div class="empty">Yüklənir...</div>
</div>

<div class="chat-box">
<div id="chatHeader" class="chat-header">Müştəri seçin</div>
<div id="chatStatus" class="chat-status hidden"></div>

<div id="chatMessages" class="chat-messages">
<div class="empty">Mesajları görmək üçün müştəri seçin.</div>
</div>

<div class="chat-send">
<textarea id="chatInput" placeholder="Müştəriyə mesaj yaz..."></textarea>
<button class="main-btn" onclick="sendMessage()">Mesaj göndər</button>
</div>
</div>
</div>

</div>
</div>

<!-- SİFARİŞLƏR -->
<div class="section" id="ordersSection">
<button class="section-head" onclick="toggleSection(this)">
<span>📦 Sifarişlər</span><span class="arrow">▼</span>
</button>
<div class="section-body">

<div class="summary">
<div class="summary-box">
<small>Aktiv sifarişlər</small>
<b id="activeCount">0</b>
</div>

<div id="newOrderBox" class="summary-box notification hidden" onclick="openOrders()">
<small>✉️ Yeni sifariş</small>
<b id="newCount">0</b>
</div>
</div>

<div id="ordersList">
<div class="empty">Sifarişlər yüklənir...</div>
</div>

</div>
</div>

</div>
</div>
</main>

<script>
const SUPABASE_URL="https://zeknhnkaicqkfzgnvycq.supabase.co";
const SUPABASE_KEY="sb_publishable_jHvCp9fXBA_BwFqrXYpwlw_VC6C1OQk";
const ADMIN_EMAIL="zahidovorxan989@gmail.com";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let selectedUser=null;
let selectedOrder=null;
let prices=[];
let realtime=null;

const statusText={
pending:"Cavab gözlənilir",
confirmed:"Təsdiqləndi",
processing:"Hazırlanır",
completed:"Hazırdır",
cancelled:"Ləğv edildi"
};

function esc(v){
return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function toggleSection(btn){
const section=btn.parentElement;
document.querySelectorAll(".section").forEach(s=>{
if(s!==section)s.classList.remove("open");
});
section.classList.toggle("open");
}

function openOrders(){
const s=document.getElementById("ordersSection");
document.querySelectorAll(".section").forEach(x=>x.classList.remove("open"));
s.classList.add("open");
s.scrollIntoView({behavior:"smooth"});
}

function duration(product){
return product.toLowerCase().includes("canva")?12:1;
}

function expiry(date,months){
const d=new Date(date);
const day=d.getDate();
d.setDate(1);
d.setMonth(d.getMonth()+months);
d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));
return d;
}

function salePercent(a,b){
if(!a||b>=a)return "";
return "−"+Math.round((a-b)/a*100)+"%";
}

/* ADMIN */
async function start(){
const {data:{session}}=await db.auth.getSession();

if(!session){
location.href="login.html";
return;
}

if((session.user.email||"").toLowerCase()!==ADMIN_EMAIL.toLowerCase()){
alert("Bu səhifəyə giriş icazəniz yoxdur.");
await db.auth.signOut();
location.href="login.html";
return;
}

loading.style.display="none";
adminPanel.style.display="block";

await Promise.all([
loadCustomers(),
loadPrices(),
loadProducts(),
loadOrders(),
loadChat()
]);

setupRealtime();
}

/* CUSTOMERS */
async function loadCustomers(){
const {data,error}=await db.from("profiles").select("id,email,full_name").not("email","is",null).order("email");

if(error)return console.error(error);

customerSelect.innerHTML='<option value="">Müştəri seçin...</option>';

(data||[]).forEach(c=>{
const o=document.createElement("option");
o.value=c.id;
o.textContent=c.full_name?c.full_name+" — "+c.email:c.email;
customerSelect.appendChild(o);
});
}

customerSelect.onchange=()=>{
const o=customerSelect.options[customerSelect.selectedIndex];
if(!customerSelect.value){
selectedCustomer.style.display="none";
return;
}
selectedCustomer.innerHTML="Müştəri: <strong>"+esc(o.textContent)+"</strong>";
selectedCustomer.style.display="block";
};

/* PRICES */
async function loadPrices(){
const {data,error}=await db.from("product_prices").select("*").order("id");

if(error){
pricesList.innerHTML='<div class="empty">Qiymətlər yüklənmədi.</div>';
return;
}

prices=data||[];

pricesList.innerHTML=prices.map(p=>{
if(p.product_key==="canva"){
return priceBox(p,12,"12 ay");
}
return priceBox(p,1,"1 ay")+priceBox(p,2,"2 ay")+priceBox(p,3,"3 ay");
}).join("");
}

function priceBox(p,m,title){
const price=Number(p["price_"+m+"_month"]||0);
const sale=Number(p["sale_"+m+"_price"]??price);

return `
<div class="price-month">
<div class="price-title">${esc(p.product_name)} — ${title}</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div>Normal<br><b>${price.toFixed(2)} AZN</b></div>
<div>Endirimli<br><b>${sale.toFixed(2)} AZN</b></div>
</div>
<div class="sale">${salePercent(price,sale)}</div>
</div>`;
}

function showProductPrices(){
const product=productSelect.value;
if(!product){
productPrices.classList.add("hidden");
return;
}

const p=prices.find(x=>{
const n=(x.product_name||"").toLowerCase();
return n.includes(product.replace(" Premium","").toLowerCase()) ||
(x.product_key||"").toLowerCase()===product.toLowerCase().replace(" premium","");
});

if(!p){
productPrices.innerHTML="";
productPrices.classList.add("hidden");
return;
}

const m=product.toLowerCase().includes("canva")?12:1;
const normal=Number(p["price_"+m+"_month"]||0);
const sale=Number(p["sale_"+m+"_price"]??normal);

productPrices.innerHTML=`
<div style="background:#080808;border:1px solid #292929;border-radius:9px;padding:12px;margin-bottom:15px">
<div style="color:#60a5fa;font-weight:bold">${m} aylıq paket</div>
<div style="margin-top:7px">
Normal: ${normal.toFixed(2)} AZN
&nbsp;&nbsp; 
Endirimli: ${sale.toFixed(2)} AZN
</div>
</div>`;

productPrices.classList.remove("hidden");
}

/* GIVE PRODUCT */
async function addProduct(){
const user=customerSelect.value;
const product=productSelect.value;
const account=accountInfo.value.trim();

if(!user)return msg("Müştəri seçin.",true);
if(!product)return msg("Məhsul seçin.",true);
if(!account)return msg("Hesab məlumatını yazın.",true);

addButton.disabled=true;

const {data,error}=await db.from("customer_products").insert({
user_id:user,
product_name:product,
account_info:account,
status:"active"
}).select("*").single();

if(error){
addButton.disabled=false;
return msg("Məhsul əlavə edilmədi: "+error.message,true);
}

const {data:orders}=await db.from("orders")
.select("id")
.eq("user_id",user)
.in("status",["pending","confirmed","processing"])
.order("created_at",{ascending:false})
.limit(1);

if(orders&&orders[0]){
await db.from("orders").update({
status:"completed",
updated_at:new Date().toISOString()
}).eq("id",orders[0].id);
}

accountInfo.value="";
productSelect.value="";
productPrices.classList.add("hidden");
addButton.disabled=false;

msg("Məhsul müştəriyə əlavə edildi. Sifariş statusu: Hazırdır.");

await loadProducts();
await loadOrders();
await loadChat();
}

/* PRODUCTS */
async function loadProducts(){
const {data,error}=await db.from("customer_products").select("*").order("created_at",{ascending:false});

if(error){
productsList.innerHTML='<div class="empty">Məhsullar yüklənmədi: '+esc(error.message)+'</div>';
return;
}

if(!data?.length){
productsList.innerHTML='<div class="empty">Hələ verilmiş məhsul yoxdur.</div>';
return;
}

const ids=[...new Set(data.map(x=>x.user_id).filter(Boolean))];
let profiles={};

if(ids.length){
const {data:p}=await db.from("profiles").select("id,email,full_name").in("id",ids);
(p||[]).forEach(x=>profiles[x.id]=x);
}

productsList.innerHTML=data.map(x=>{
const p=profiles[x.user_id]||{};
const email=p.email||"Email yoxdur";
const date=new Date(x.created_at);
const end=expiry(date,duration(x.product_name||""));
const active=x.status==="active"&&end>new Date();

return `
<div class="product">
<strong>${esc(x.product_name)}</strong>
<div>Müştəri: ${esc(p.full_name||email)}</div>
<div>Email: ${esc(email)}</div>
<div>Verilmə tarixi: ${esc(date.toLocaleString("az-AZ"))}</div>
<div>Müddət: ${duration(x.product_name||"")} ay</div>
<div>Aktivlik bitir: ${esc(end.toLocaleString("az-AZ"))}</div>
<div class="${active?"active":"expired"}">${active?"Aktiv":"Müddəti bitib"}</div>
<div>Hesab məlumatı: ${esc(x.account_info)}</div>
<button class="delete" onclick="deleteProduct('${esc(x.id)}')">Sil</button>
</div>`;
}).join("");
}

async function deleteProduct(id){
if(!confirm("Bu məhsulu silmək istəyirsiniz?"))return;
const {error}=await db.from("customer_products").delete().eq("id",id);
if(error)return alert(error.message);
loadProducts();
}

/* CHAT */
async function loadChat(){
const {data:messages,error}=await db.from("messages")
.select("user_id,message,sender_role,is_read,created_at")
.order("created_at",{ascending:false});

if(error)return;

const ids=[...new Set((messages||[]).map(x=>x.user_id).filter(Boolean))];

if(!ids.length){
chatCustomers.innerHTML='<div class="empty">Hələ heç kim mesaj yazmayıb.</div>';
return;
}

const {data:profiles}=await db.from("profiles").select("id,email,full_name").in("id",ids);
const map={};
(profiles||[]).forEach(x=>map[x.id]=x);

const users={};
(messages||[]).forEach(x=>{
if(!users[x.user_id])users[x.user_id]=x;
});

chatCustomers.innerHTML=Object.keys(users).map(id=>{
const p=map[id]||{};
const m=users[id];
return `
<div class="chat-user ${selectedUser===id?"active":""}" onclick="selectChat('${id}','${esc(p.email||"")}')">
<b>${esc(p.full_name||p.email||"Müştəri")}</b>
<small>${esc(m.message||"")}</small>
</div>`;
}).join("");
}

async function selectChat(id,email){
selectedUser=id;
chatHeader.textContent="💬 "+email;
chatStatus.classList.add("hidden");

await loadChatMessages(id);
await loadChat();

const {data}=await db.from("orders")
.select("id,status")
.eq("user_id",id)
.order("created_at",{ascending:false})
.limit(1);

if(data?.[0]){
selectedOrder=data[0].id;
chatStatus.innerHTML="📦 Sifariş statusu: <b>"+esc(statusText[data[0].status]||data[0].status)+"</b>";
chatStatus.classList.remove("hidden");
}
}

async function loadChatMessages(id){
const {data}=await db.from("messages")
.select("message,sender_role,created_at")
.eq("user_id",id)
.order("created_at");

if(!data?.length){
chatMessages.innerHTML='<div class="empty">Hələ mesaj yoxdur.</div>';
return;
}

chatMessages.innerHTML=data.map(m=>`
<div class="msg ${m.sender_role==="admin"?"admin":"customer"}">
${esc(m.message)}
</div>`).join("");

chatMessages.scrollTop=chatMessages.scrollHeight;

await db.from("messages").update({is_read:true})
.eq("user_id",id).eq("sender_role","customer").eq("is_read",false);
}

async function sendMessage(){
if(!selectedUser)return alert("Əvvəlcə müştəri seçin.");
const text=chatInput.value.trim();
if(!text)return;

const {error}=await db.from("messages").insert({
user_id:selectedUser,
sender_role:"admin",
message:text,
is_read:false
});

if(error)return alert(error.message);

chatInput.value="";
await loadChatMessages(selectedUser);
}

/* ORDERS */
async function loadOrders(){
const {data:orders,error}=await db.from("orders")
.select("id,user_id,total,status,created_at")
.order("created_at",{ascending:false});

if(error){
ordersList.innerHTML='<div class="empty">'+esc(error.message)+'</div>';
return;
}

const active=(orders||[]).filter(x=>["pending","confirmed","processing"].includes(x.status)).length;
const news=(orders||[]).filter(x=>x.status==="pending").length;

activeCount.textContent=active;
newCount.textContent=news;

if(news)newOrderBox.classList.remove("hidden");
else newOrderBox.classList.add("hidden");

if(!orders?.length){
ordersList.innerHTML='<div class="empty">Hələ sifariş yoxdur.</div>';
return;
}

const ids=[...new Set(orders.map(x=>x.user_id).filter(Boolean))];
let profiles={};

if(ids.length){
const {data:p}=await db.from("profiles").select("id,email,full_name").in("id",ids);
(p||[]).forEach(x=>profiles[x.id]=x);
}

ordersList.innerHTML=orders.map(o=>{
const p=profiles[o.user_id]||{};
const email=p.email||"Email yoxdur";
const st=o.status||"pending";

return `
<div class="order-card ${st==="pending"?"new":""}">
<div class="order-top">
<div class="order-title">📦 Sifariş #${esc(o.id)}</div>
<strong>${Number(o.total||0).toFixed(2)} AZN</strong>
</div>

${st==="pending"?'<div style="color:#facc15;font-size:12px">✉️ Yeni sifariş</div>':""}

<span class="status ${esc(st)}">${esc(statusText[st]||st)}</span>

<div class="order-info">
Müştəri: ${esc(p.full_name||email)}<br>
Email: ${esc(email)}<br>
Tarix: ${esc(new Date(o.created_at).toLocaleString("az-AZ"))}
</div>

<div class="order-actions">
<select onchange="updateOrder('${esc(o.id)}',this.value)">
<option value="pending" ${st==="pending"?"selected":""}>Cavab gözlənilir</option>
<option value="confirmed" ${st==="confirmed"?"selected":""}>Təsdiqləndi</option>
<option value="processing" ${st==="processing"?"selected":""}>Hazırlanır</option>
<option value="completed" ${st==="completed"?"selected":""}>Hazırdır</option>
<option value="cancelled" ${st==="cancelled"?"selected":""}>Ləğv edildi</option>
</select>
<button class="main-btn" onclick="selectChat('${esc(o.user_id)}','${esc(email)}')">💬 Çata keç</button>
</div>
</div>`;
}).join("");
}

async function updateOrder(id,status){
const {error}=await db.from("orders").update({
status,
updated_at:new Date().toISOString()
}).eq("id",id);

if(error)return alert(error.message);

await loadOrders();
await loadChat();
}

/* MESSAGE */
function msg(text,error=false){
message.textContent=text;
message.className="message"+(error?" error":"");
message.style.display="block";
setTimeout(()=>message.style.display="none",4000);
}

/* REALTIME */
function setupRealtime(){
if(realtime)return;

realtime=db.channel("admin")
.on("postgres_changes",{event:"*",schema:"public",table:"orders"},async()=>{
await loadOrders();
await loadChat();
})
.on("postgres_changes",{event:"*",schema:"public",table:"messages"},async()=>{
await loadChat();
if(selectedUser)await loadChatMessages(selectedUser);
})
.on("postgres_changes",{event:"*",schema:"public",table:"customer_products"},async()=>{
await loadProducts();
})
.subscribe();
}

start();
</script>
