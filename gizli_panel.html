<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DigiBaku Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080b12;
    color:#fff;
}

header{
    background:#0d111b;
    padding:20px;
    border-bottom:1px solid #202838;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    color:#4da3ff;
    font-size:22px;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 15px;
    cursor:pointer;
    font-weight:bold;
}

.logout{
    background:#ff4444;
    color:#fff;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.section{
    background:#0d111b;
    border:1px solid #202838;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
}

.section h2{
    color:#4da3ff;
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:15px;
}

.card{
    background:#121826;
    border:1px solid #263149;
    border-radius:12px;
    padding:15px;
}

.card h3{
    margin-bottom:10px;
    color:#fff;
}

input,
select,
textarea{
    width:100%;
    background:#080d16;
    color:#fff;
    border:1px solid #303b52;
    border-radius:8px;
    padding:10px;
    margin-top:7px;
    outline:none;
}

textarea{
    resize:vertical;
    min-height:80px;
}

label{
    display:block;
    margin-top:10px;
    color:#aeb9cc;
    font-size:13px;
}

.save{
    background:#1683ff;
    color:#fff;
    margin-top:12px;
}

.delete{
    background:#e53935;
    color:#fff;
    margin-top:10px;
}

.small{
    color:#8995aa;
    font-size:12px;
}

.customer{
    cursor:pointer;
    transition:.2s;
}

.customer:hover{
    border-color:#1683ff;
}

.customer.active{
    border-color:#1683ff;
    background:#101d31;
}

.unread{
    background:#ff3b30;
    color:#fff;
    border-radius:20px;
    padding:4px 8px;
    font-size:11px;
    float:right;
}

.chat-layout{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:15px;
}

.customer-list{
    max-height:600px;
    overflow-y:auto;
}

.chat-box{
    background:#080d16;
    border:1px solid #263149;
    border-radius:12px;
    display:flex;
    flex-direction:column;
    min-height:600px;
}

.chat-header{
    padding:15px;
    border-bottom:1px solid #263149;
    color:#4da3ff;
    font-weight:bold;
}

.messages{
    flex:1;
    padding:15px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.message{
    max-width:75%;
    padding:10px 13px;
    border-radius:12px;
    line-height:1.4;
}

.message.customer-msg{
    align-self:flex-start;
    background:#202a3d;
}

.message.admin-msg{
    align-self:flex-end;
    background:#1264c7;
}

.message-time{
    display:block;
    font-size:10px;
    opacity:.6;
    margin-top:4px;
}

.chat-input{
    padding:12px;
    border-top:1px solid #263149;
    display:flex;
    gap:8px;
}

.chat-input textarea{
    margin:0;
    min-height:45px;
    height:45px;
}

.chat-input button{
    background:#1683ff;
    color:#fff;
    min-width:90px;
}

.order{
    margin-bottom:12px;
}

.order-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
}

.status{
    padding:5px 8px;
    border-radius:7px;
    font-size:12px;
}

.status.pending{
    background:#765d00;
}

.status.processing{
    background:#075a99;
}

.status.completed{
    background:#126b3b;
}

.status.cancelled{
    background:#751e1e;
}

.empty{
    color:#758197;
    text-align:center;
    padding:30px;
}

.price-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.price-info{
    margin-top:10px;
    padding:10px;
    background:#080d16;
    border-radius:8px;
    font-size:13px;
}

.sale-active{
    color:#39e58c;
}

.sale-inactive{
    color:#ff7070;
}

@media(max-width:700px){
    .chat-layout{
        grid-template-columns:1fr;
    }

    .customer-list{
        max-height:300px;
    }

    .message{
        max-width:90%;
    }
}
</style>
</head>

<body>

<header>
    <h1>💎 DigiBaku Admin Panel</h1>
    <button class="logout" onclick="logout()">Çıxış</button>
</header>

<div class="container">

    <!-- ================= MÜŞTƏRİ CHAT ================= -->

    <div class="section">
        <h2>💬 Müştəri Chatı</h2>

        <div class="chat-layout">

            <div>
                <div class="small" style="margin-bottom:10px;">
                    Müştərilər
                </div>

                <div id="customerList" class="customer-list">
                    <div class="empty">Yüklənir...</div>
                </div>
            </div>

            <div class="chat-box">

                <div id="chatHeader" class="chat-header">
                    Müştəri seçin
                </div>

                <div id="messages" class="messages">
                    <div class="empty">
                        Söhbəti görmək üçün müştəri seçin.
                    </div>
                </div>

                <div class="chat-input">

                    <textarea
                        id="messageInput"
                        placeholder="Mesaj yazın..."
                        onkeydown="handleMessageKey(event)"
                    ></textarea>

                    <button onclick="sendMessage()">
                        Göndər
                    </button>

                </div>

            </div>

        </div>
    </div>


    <!-- ================= SİFARİŞLƏR ================= -->

    <div class="section">

        <h2>🛒 Sifarişlər</h2>

        <div id="ordersList">
            <div class="empty">Sifarişlər yüklənir...</div>
        </div>

    </div>


    <!-- ================= MÜŞTƏRİ MƏHSULLARI ================= -->

    <div class="section">

        <h2>📦 Müştəri Məhsulları</h2>

        <div class="card">

            <label>Müştəri ID</label>
            <input
                id="productUserId"
                placeholder="Müştərinin UUID-si"
            >

            <label>Məhsul</label>

            <select id="productName">
                <option>Netflix Premium</option>
                <option>YouTube Premium</option>
                <option>ChatGPT Plus</option>
                <option>Google Gemini Premium</option>
                <option>Spotify Premium</option>
                <option>Canva Premium</option>
            </select>

            <label>Hesab məlumatı</label>

            <textarea
                id="accountInfo"
                placeholder="Email / şifrə və ya hesab məlumatı"
            ></textarea>

            <button class="save" onclick="addProduct()">
                Məhsulu əlavə et
            </button>

        </div>

        <br>

        <div id="productsList" class="grid">
            <div class="empty">Yüklənir...</div>
        </div>

    </div>


    <!-- ================= QİYMƏTLƏR ================= -->

    <div class="section">

        <h2>💰 Məhsul Qiymətləri</h2>

        <div id="pricesList" class="grid">
            <div class="empty">Qiymətlər yüklənir...</div>
        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
"https://zeknhnkaicqkfzgnvycq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_jHvCp9fXBA_BwFqrXYpwlw_VC6C1OQk";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const ADMIN_EMAIL =
"zahidovorxan989@gmail.com";


let selectedCustomerId = null;
let selectedCustomerEmail = "";
let realtimeChannel = null;


/* =====================================================
   LOGIN / ADMIN
===================================================== */

async function checkAdmin(){

    const {
        data:{
            session
        }
    } = await supabaseClient.auth.getSession();

    if(!session){
        window.location.href = "login.html";
        return;
    }

    const email =
        session.user.email;

    if(
        !email ||
        email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ){

        alert("Admin icazəsi yoxdur.");

        await supabaseClient.auth.signOut();

        window.location.href =
            "login.html";

        return;
    }

    await loadCustomers();
    await loadOrders();
    await loadProducts();
    await loadPrices();

    setupRealtime();
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    window.location.href =
        "login.html";
}


/* =====================================================
   CUSTOMERS
===================================================== */

async function loadCustomers(){

    const list =
        document.getElementById(
            "customerList"
        );

    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("id,email,full_name,phone,created_at")
        .order("created_at",{
            ascending:false
        });

    if(error){

        console.error(error);

        list.innerHTML = `
            <div class="empty">
                Müştərilər yüklənmədi.
                <br><br>
                ${error.message}
            </div>
        `;

        return;
    }

    if(!data || data.length === 0){

        list.innerHTML =
            `<div class="empty">
                Müştəri yoxdur.
            </div>`;

        return;
    }

    list.innerHTML = "";

    for(const customer of data){

        const {
            count
        } = await supabaseClient
            .from("messages")
            .select("*",{
                count:"exact",
                head:true
            })
            .eq("user_id",customer.id)
            .eq("sender_role","customer")
            .eq("is_read",false);

        const div =
            document.createElement("div");

        div.className =
            "card customer";

        div.dataset.id =
            customer.id;

        div.onclick = () =>
            selectCustomer(
                customer.id,
                customer.email || "Müştəri"
            );

        div.innerHTML = `

            <div>
                <strong>
                    ${
                        customer.full_name ||
                        customer.email ||
                        "Müştəri"
                    }
                </strong>

                ${
                    count > 0
                    ? `<span class="unread">${count}</span>`
                    : ""
                }
            </div>

            <div class="small" style="margin-top:6px;">
                ${customer.email || "Email yoxdur"}
            </div>

            ${
                customer.phone
                ? `
                <div class="small">
                    ${customer.phone}
                </div>
                `
                : ""
            }

        `;

        list.appendChild(div);
    }
}


/* =====================================================
   SELECT CUSTOMER
===================================================== */

async function selectCustomer(
    id,
    email
){

    selectedCustomerId =
        id;

    selectedCustomerEmail =
        email;

    document
        .querySelectorAll(".customer")
        .forEach(el => {

            el.classList.toggle(
                "active",
                el.dataset.id === id
            );

        });

    document.getElementById(
        "chatHeader"
    ).textContent =
        "💬 " + email;

    await loadChat(id);

    await markMessagesRead(id);

    await loadCustomers();
}


/* =====================================================
   LOAD CHAT
===================================================== */

async function loadChat(
    userId
){

    const box =
        document.getElementById(
            "messages"
        );

    const {
        data,
        error
    } = await supabaseClient
        .from("messages")
        .select("*")
        .eq("user_id",userId)
        .order("created_at",{
            ascending:true
        });

    if(error){

        console.error(error);

        box.innerHTML = `
            <div class="empty">
                Chat yüklənmədi.
                <br>
                ${error.message}
            </div>
        `;

        return;
    }

    if(!data || data.length === 0){

        box.innerHTML =
            `<div class="empty">
                Hələ mesaj yoxdur.
            </div>`;

        return;
    }

    box.innerHTML = "";

    data.forEach(msg => {

        const div =
            document.createElement("div");

        div.className =
            "message " +
            (
                msg.sender_role === "admin"
                ? "admin-msg"
                : "customer-msg"
            );

        const date =
            new Date(
                msg.created_at
            ).toLocaleString(
                "az-AZ"
            );

        div.innerHTML = `

            ${escapeHtml(msg.message)}

            <span class="message-time">
                ${date}
            </span>

        `;

        box.appendChild(div);

    });

    box.scrollTop =
        box.scrollHeight;
}


/* =====================================================
   MARK READ
===================================================== */

async function markMessagesRead(
    userId
){

    const {
        error
    } = await supabaseClient
        .from("messages")
        .update({
            is_read:true
        })
        .eq("user_id",userId)
        .eq("sender_role","customer")
        .eq("is_read",false);

    if(error){
        console.error(error);
    }
}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    if(!selectedCustomerId){

        alert(
            "Əvvəlcə müştəri seçin."
        );

        return;
    }

    const input =
        document.getElementById(
            "messageInput"
        );

    const message =
        input.value.trim();

    if(!message)
        return;

    const {
        error
    } = await supabaseClient
        .from("messages")
        .insert({

            user_id:
                selectedCustomerId,

            sender_role:
                "admin",

            message:
                message,

            is_read:false

        });

    if(error){

        alert(
            "Mesaj göndərilmədi: " +
            error.message
        );

        console.error(error);

        return;
    }

    input.value = "";

    await loadChat(
        selectedCustomerId
    );
}


/* =====================================================
   ENTER SEND
===================================================== */

function handleMessageKey(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }
}


/* =====================================================
   ORDERS
===================================================== */

async function loadOrders(){

    const list =
        document.getElementById(
            "ordersList"
        );

    const {
        data,
        error
    } = await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at",{
            ascending:false
        });

    if(error){

        console.error(error);

        list.innerHTML = `
            <div class="empty">
                Sifarişlər yüklənmədi.
                <br><br>
                ${error.message}
            </div>
        `;

        return;
    }

    if(!data || data.length === 0){

        list.innerHTML =
            `<div class="empty">
                Hələ sifariş yoxdur.
            </div>`;

        return;
    }

    list.innerHTML = "";

    for(const order of data){

        let customerEmail =
            "Müştəri";

        if(order.user_id){

            const {
                data:profile
            } = await supabaseClient
                .from("profiles")
                .select("email,full_name")
                .eq("id",order.user_id)
                .maybeSingle();

            if(profile){

                customerEmail =
                    profile.email ||
                    profile.full_name ||
                    "Müştəri";

            }
        }

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "card order";

        div.innerHTML = `

            <div class="order-top">

                <div>

                    <strong>
                        ${escapeHtml(
                            order.product_name ||
                            "Məhsul"
                        )}
                    </strong>

                    <div class="small">
                        👤 ${escapeHtml(
                            customerEmail
                        )}
                    </div>

                </div>

                <div>
                    <strong>
                        ${
                            order.price != null
                            ? Number(order.price).toFixed(2)
                            : "0.00"
                        }
                        AZN
                    </strong>
                </div>

            </div>

            <div class="small"
                 style="margin-top:10px;">

                Müddət:
                ${
                    order.duration ||
                    "-"
                }

                <br>

                Tarix:
                ${
                    order.created_at
                    ? new Date(
                        order.created_at
                    ).toLocaleString(
                        "az-AZ"
                    )
                    : "-"
                }

            </div>

            ${
                order.customer_note
                ? `
                <div class="price-info">
                    📝 ${escapeHtml(
                        order.customer_note
                    )}
                </div>
                `
                : ""
            }

            <label>
                Sifariş statusu
            </label>

            <select
                onchange="
                    updateOrderStatus(
                        '${order.id}',
                        this.value
                    )
                "
            >

                <option
                    value="pending"
                    ${
                        order.status === "pending"
                        ? "selected"
                        : ""
                    }
                >
                    Gözləyir
                </option>

                <option
                    value="processing"
                    ${
                        order.status === "processing"
                        ? "selected"
                        : ""
                    }
                >
                    Hazırlanır
                </option>

                <option
                    value="completed"
                    ${
                        order.status === "completed"
                        ? "selected"
                        : ""
                    }
                >
                    Tamamlandı
                </option>

                <option
                    value="cancelled"
                    ${
                        order.status === "cancelled"
                        ? "selected"
                        : ""
                    }
                >
                    Ləğv edildi
                </option>

            </select>

            <button
                class="save"
                onclick="
                    openOrderChat(
                        '${order.user_id || ""}'
                    )
                "
            >
                💬 Müştəri ilə danış
            </button>

        `;

        list.appendChild(div);
    }
}


/* =====================================================
   UPDATE ORDER STATUS
===================================================== */

async function updateOrderStatus(
    orderId,
    status
){

    const {
        error
    } = await supabaseClient
        .from("orders")
        .update({
            status:status,
            updated_at:new Date().toISOString()
        })
        .eq("id",orderId);

    if(error){

        alert(
            "Status dəyişmədi: " +
            error.message
        );

        console.error(error);

        return;
    }

    await loadOrders();
}


/* =====================================================
   OPEN ORDER CHAT
===================================================== */

async function openOrderChat(
    userId
){

    if(!userId)
        return;

    const {
        data
    } = await supabaseClient
        .from("profiles")
        .select("email,full_name")
        .eq("id",userId)
        .maybeSingle();

    const email =
        data?.email ||
        data?.full_name ||
        "Müştəri";

    await selectCustomer(
        userId,
        email
    );

    document
        .querySelector(".section")
        ?.scrollIntoView({
            behavior:"smooth"
        });
}


/* =====================================================
   CUSTOMER PRODUCTS
===================================================== */

async function addProduct(){

    const userId =
        document.getElementById(
            "productUserId"
        ).value.trim();

    const productName =
        document.getElementById(
            "productName"
        ).value;

    const accountInfo =
        document.getElementById(
            "accountInfo"
        ).value.trim();

    if(!userId){

        alert(
            "Müştəri ID daxil edin."
        );

        return;
    }

    if(!accountInfo){

        alert(
            "Hesab məlumatını daxil edin."
        );

        return;
    }

    const {
        error
    } = await supabaseClient
        .from("customer_products")
        .insert({

            user_id:userId,

            product_name:
                productName,

            account_info:
                accountInfo,

            status:
                "active"

        });

    if(error){

        alert(
            "Məhsul əlavə olunmadı: " +
            error.message
        );

        console.error(error);

        return;
    }

    document.getElementById(
        "accountInfo"
    ).value = "";

    await loadProducts();

    alert(
        "Məhsul müştəriyə əlavə edildi."
    );
}


/* =====================================================
   LOAD CUSTOMER PRODUCTS
===================================================== */

async function loadProducts(){

    const list =
        document.getElementById(
            "productsList"
        );

    const {
        data,
        error
    } = await supabaseClient
        .from("customer_products")
        .select("*")
        .order("id",{
            ascending:false
        });

    if(error){

        console.error(error);

        list.innerHTML = `
            <div class="empty">
                Məhsullar yüklənmədi.
                <br>
                ${error.message}
            </div>
        `;

        return;
    }

    if(!data || data.length === 0){

        list.innerHTML =
            `<div class="empty">
                Müştəri məhsulu yoxdur.
            </div>`;

        return;
    }

    list.innerHTML = "";

    data.forEach(item => {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "card";

        div.innerHTML = `

            <h3>
                ${escapeHtml(
                    item.product_name ||
                    "Məhsul"
                )}
            </h3>

            <div class="small">
                Müştəri ID:
                ${escapeHtml(
                    item.user_id || ""
                )}
            </div>

            <div class="small">
                Tarix:
                ${
                    item.created_at
                    ? new Date(
                        item.created_at
                    ).toLocaleString(
                        "az-AZ"
                    )
                    : "-"
                }
            </div>

            <div class="price-info">

                ${escapeHtml(
                    item.account_info ||
                    ""
                )}

            </div>

            <div class="small"
                 style="margin-top:8px;">

                Status:
                ${escapeHtml(
                    item.status || ""
                )}

            </div>

            <button
                class="delete"
                onclick="
                    deleteProduct(
                        '${item.id}'
                    )
                "
            >
                Sil
            </button>

        `;

        list.appendChild(div);
    });
}


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(
    id
){

    if(
        !confirm(
            "Bu məhsulu silmək istəyirsiniz?"
        )
    )
        return;

    const {
        error
    } = await supabaseClient
        .from("customer_products")
        .delete()
        .eq("id",id);

    if(error){

        alert(
            "Silinmədi: " +
            error.message
        );

        return;
    }

    await loadProducts();
}


/* =====================================================
   PRICES
===================================================== */

async function loadPrices(){

    const list =
        document.getElementById(
            "pricesList"
        );

    const {
        data,
        error
    } = await supabaseClient
        .from("product_prices")
        .select("*")
        .order("id",{
            ascending:true
        });

    if(error){

        console.error(error);

        list.innerHTML = `
            <div class="empty">
                Qiymətlər yüklənmədi.
                <br>
                ${error.message}
            </div>
        `;

        return;
    }

    if(!data || data.length === 0){

        list.innerHTML =
            `<div class="empty">
                Qiymət məlumatı yoxdur.
            </div>`;

        return;
    }

    list.innerHTML = "";

    data.forEach(item => {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "card";

        const name =
            item.product_name ||
            item.name ||
            "Məhsul";

         * CANVA
         * 12 aylıq xüsusi qiymət sistemi
         */

            name.toLowerCase()
                .includes("canva")
        ){

            const price12 =
                Number(
                    item.price_12_month || 0
                ).toFixed(2);

            const sale12 =
                Number(
                    item.sale_12_price || 0
                ).toFixed(2);

            const active =
                !!item.sale_12_active;

            card.innerHTML = `

                <h3>

                </h3>

                <label>
                    12 aylıq əsas qiymət
                </label>

                <input
                    id="price12_${item.id}"
                    type="number"
                    step="0.01"
                    value="${price12}"

                <label>
                    12 aylıq endirimli qiymət
                </label>

                <input
                    id="sale12_${item.id}"
                    type="number"
                    step="0.01"
                    value="${sale12}"
                >

                <label>
                    Endirim aktivdir?
                </label>

                <select
                    id="active12_${item.id}"
                >

                    <option
                        value="true"
                        ${
                            active
                            ? "selected"
                            : ""
                        }
                    >

                    </option>

                    <option
                        value="false"
                        ${
                            !active
                            ? "selected"
                            : ""
                        }
                    >
                        Xeyr
                    </option>

                </select>

                <div class="price-info">

                    ${
                        active
                        ? `<span class="sale-active">
                            ● Endirim aktivdir
                           </span>`
                        : `<span class="sale-inactive">
                            ● Endirim deaktivdir
                           </span>`
                    }

                </div>

                <button
                    class="save"
                    onclick="
                        saveCanvaPrice(
                            '${item.id}'
                        )
                    "
                >
                    Yadda saxla
                </button>

            `;

        }

        /*
         * DIGƏR MƏHSULLAR
         */

        else{

            const p1 =
                Number(
                    item.price_1_month || 0
                ).toFixed(2);

            const p2 =
                Number(
                    item.price_2_month || 0
                ).toFixed(2);

            const p3 =
                Number(
                    item.price_3_month || 0
                ).toFixed(2);

            const s1 =
                Number(
                    item.sale_1_price || 0
                ).toFixed(2);

            const s2 =
                Number(
                    item.sale_2_price || 0
                ).toFixed(2);

            const s3 =
                Number(
                    item.sale_3_price || 0
                ).toFixed(2);

            card.innerHTML = `

                <h3>
                    ${escapeHtml(name)}
                </h3>

                <div class="price-row">

                    <div>

                        <label>
                            1 ay əsas
                        </label>

                        <input
                            id="p1_${item.id}"
                            type="number"
                            step="0.01"
                            value="${p1}"
                        >

                    </div>

                    <div>

                        <label>
                            1 ay endirim
                        </label>

                        <input
                            id="s1_${item.id}"
                            type="number"
                            step="0.01"
                            value="${s1}"
                        >

                    </div>

                </div>


                <div class="price-row">

                    <div>

                        <label>
                            2 ay əsas
                        </label>

                        <input
                            id="p2_${item.id}"
                            type="number"
                            step="0.01"
                            value="${p2}"
                        >

                    </div>

                    <div>

                        <label>
                            2 ay endirim
                        </label>

                        <input
                            id="s2_${item.id}"
                            type="number"
                            step="0.01"
                            value="${s2}"
                        >

                    </div>

                </div>


                <div class="price-row">

                    <div>

                        <label>
                            3 ay əsas
                        </label>

                        <input
                            id="p3_${item.id}"
                            type="number"
                            step="0.01"
                            value="${p3}"
                        >

                    </div>

                    <div>

                        <label>
                            3 ay endirim
                        </label>

                        <input
                            id="s3_${item.id}"
                            type="number"
                            step="0.01"
                            value="${s3}"
                        >

                    </div>

                </div>


                <button
                    class="save"
                    onclick="
                        savePrice(
                            '${item.id}'
                        )
                    "
                >
                    Yadda saxla
                </button>

            `;

        }

        list.appendChild(card);

    });
}


/* =====================================================
   SAVE CANVA
===================================================== */

async function saveCanvaPrice(
    id
){

    const price =
        Number(
            document.getElementById(
                "price12_" + id
            ).value
        );

    const sale =
        Number(
            document.getElementById(
                "sale12_" + id
            ).value
        );

    const active =
        document.getElementById(
            "active12_" + id
        ).value === "true";

    const {
        error
    } = await supabaseClient
        .from("product_prices")
        .update({

            price_12_month:
                price,

            sale_12_price:
                sale,

            sale_12_active:
                active

        })
        .eq("id",id);

    if(error){

        alert(
            "Qiymət yadda saxlanmadı: " +
            error.message
        );

        console.error(error);

        return;
    }

    alert(
        "Canva qiyməti yadda saxlanıldı."
    );

    await loadPrices();
}

/* =====================================================
   REALTIME
===================================================== */

function setupRealtime(){

    if(realtimeChannel)
        return;

    realtimeChannel =
        supabaseClient
        .channel("admin-panel-realtime")

        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"messages"
            },
            async () => {

                await loadCustomers();

                if(selectedCustomerId){

                    await loadChat(
                        selectedCustomerId
                    );

                }

            }
        )

        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"orders"
            },
            async () => {

                await loadOrders();

            }
        )

        .subscribe();
}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(
    value
){

    if(value === null ||
       value === undefined)
        return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
