/* =========================
ADMIN YOXLAMA
========================= */

async function checkAdmin(){

const {
data,
error
} =
await supabaseClient.auth.getSession();

if(error || !data.session){

window.location.href="login.html";
return;

}

const email =
(data.session.user.email || "")
.toLowerCase()
.trim();

if(email !== ADMIN_EMAIL.toLowerCase()){

document.getElementById("loading").textContent =
"Bu səhifəyə giriş icazəniz yoxdur.";

return;

}

document.getElementById("loading").style.display="none";

document.getElementById("adminPanel").style.display="block";

await loadCustomers();

await loadProducts();

await loadPrices();

}


/* =========================
MÜŞTƏRİLƏR
========================= */

async function loadCustomers(){

const select =
document.getElementById("customerSelect");

const {
data,
error
} =
await supabaseClient
.from("profiles")
.select("id,email")
.not("email","is",null)
.order("email");

if(error){

console.error(error);

select.innerHTML =
'<option>Müştərilər yüklənmədi</option>';

return;

}

select.innerHTML =
'<option value="">Müştəri seçin...</option>';

data.forEach(customer => {

const option =
document.createElement("option");

option.value =
customer.id;

option.textContent =
customer.email;

select.appendChild(option);

});

}


/* =========================
MÜŞTƏRİ SEÇİLƏNDƏ
========================= */

document.getElementById("customerSelect")
.addEventListener("change",function(){

const option =
this.options[this.selectedIndex];

const box =
document.getElementById("selectedCustomer");

if(!this.value){

box.style.display="none";
box.textContent="";
return;

}

box.style.display="block";

box.textContent =
"Seçilmiş müştəri: " +
option.textContent;

});


/* =========================
MƏHSUL ƏLAVƏ ET
========================= */

async function addProduct(){

const customerId =
document.getElementById("customerSelect").value;

const product =
document.getElementById("productSelect").value;

const accountInfo =
document.getElementById("accountInfo").value.trim();

const button =
document.getElementById("addButton");

if(!customerId){

showMessage(
"Müştəri seç.",
true
);

return;

}

if(!product){

showMessage(
"Məhsul seç.",
true
);

return;

}

if(!accountInfo){

showMessage(
"Hesab məlumatını yaz.",
true
);

return;

}

button.disabled=true;

button.textContent="Əlavə edilir...";

const {
error
} =
await supabaseClient
.from("customer_products")
.insert({

user_id:customerId,

product_name:product,

account_info:accountInfo,

status:"active"

});

if(error){

console.error(error);

showMessage(
"Məhsul əlavə olunmadı: " +
error.message,
true
);

button.disabled=false;

button.textContent =
"Məhsulu müştəriyə əlavə et";

return;

}

showMessage(
"✅ Məhsul müştərinin profilinə əlavə edildi.",
false
);

document.getElementById("customerSelect").value="";

document.getElementById("productSelect").value="";

document.getElementById("accountInfo").value="";

document.getElementById("selectedCustomer").style.display="none";

await loadProducts();

button.disabled=false;

button.textContent =
"Məhsulu müştəriyə əlavə et";

}

async function loadProducts(){

document.getElementById("productsList");

data,
error
} =
await supabaseClient
.from("customer_products")
.select("*")
.order("created_at",{ascending:false});

if(error){

console.error(error);

list.innerHTML =
'<div class="empty">Məhsullar yüklənmədi.</div>';

return;

}

if(!data || data.length===0){

list.innerHTML =
'<div class="empty">Hələ məhsul verilməyib.</div>';

return;

}

list.innerHTML="";

data.forEach(item => {

const div =
document.createElement("div");

div.className="product";

const date =
item.created_at
?
new Date(item.created_at)
.toLocaleString("az-AZ")
:
"-";

div.innerHTML=`

<strong>
${escapeHtml(item.product_name)}
</strong>

<small>
Müştəri ID:
${escapeHtml(item.user_id)}
</small>

<br><br>

<small>
Tarix:
${escapeHtml(date)}
</small>

<button
class="delete"
onclick="deleteProduct('${item.id}')">

Məhsulu sil

</button>

`;

list.appendChild(div);

});

}

async function deleteProduct(id){

"Bu məhsulu müştərinin profilindən silmək istəyirsən?"
)){

return;

}

const {
error
} =
await supabaseClient
.from("customer_products")
.delete()
.eq("id",id);

if(error){

alert(
"Silinmədi: " +
error.message
);

return;

}

await loadProducts();

}

/* =========================
QİYMƏT PREVIEW
========================= */

function updatePricePreview(id,month){

const regular =
Number(
document.getElementById(
"price" + month + "-" + id
).value
) || 0;

const sale =
Number(
document.getElementById(
"sale" + month + "-" + id
).value
) || 0;

const active =
document.getElementById(
"active" + month + "-" + id
).checked;

const percentBox =
document.getElementById(
"percent" + month + "-" + id
);

const statusBox =
document.getElementById(
"status" + month + "-" + id
);

let percent = 0;

if(
active &&
regular > 0 &&
sale < regular
){

percent =
Math.round(
((regular - sale) / regular) * 100
);

}

percentBox.textContent =
percent > 0
?
"🔥 " + percent + "% ENDİRİM"
:
"Endirim yoxdur";

statusBox.textContent =
active
?
"AKTİV"
:
"DEAKTİV";

}


/* =========================
QİYMƏTİ YADDA SAXLA
========================= */

async function savePrice(id,productKey){

const price1 =
Number(
document.getElementById(
"price1-" + id
).value
);

const price2 =
Number(
document.getElementById(
"price2-" + id
).value
);

const price3 =
Number(
document.getElementById(
"price3-" + id
).value
);


const sale1 =
Number(
document.getElementById(
"sale1-" + id
).value
);

const sale2 =
Number(
document.getElementById(
"sale2-" + id
).value
);

const sale3 =
Number(
document.getElementById(
"sale3-" + id
).value
);


const active1 =
document.getElementById(
"active1-" + id
).checked;

const active2 =
document.getElementById(
"active2-" + id
).checked;

const active3 =
document.getElementById(
"active3-" + id
).checked;


if(
!Number.isFinite(price1) ||
price1 < 0 ||
!Number.isFinite(price2) ||
price2 < 0 ||
!Number.isFinite(price3) ||
price3 < 0
){

showPriceMessage(
"Normal qiymətlər düzgün deyil.",
true
);

return;

}


if(
!Number.isFinite(sale1) ||
sale1 < 0 ||
!Number.isFinite(sale2) ||
sale2 < 0 ||
!Number.isFinite(sale3) ||
sale3 < 0
){

showPriceMessage(
"Endirimli qiymətlər düzgün deyil.",
true
);

return;

}


if(active1 && sale1 >= price1){

showPriceMessage(
"1 aylıq endirimli qiymət normal qiymətdən aşağı olmalıdır.",
true
);

return;

}


if(active2 && sale2 >= price2){

showPriceMessage(
"2 aylıq endirimli qiymət normal qiymətdən aşağı olmalıdır.",
true
);

return;

}


if(active3 && sale3 >= price3){

showPriceMessage(
"3 aylıq endirimli qiymət normal qiymətdən aşağı olmalıdır.",
true
);

return;

}


const {
error
} =
await supabaseClient
.from("product_prices")
.update({

price_1_month:price1,
price_2_month:price2,
price_3_month:price3,

sale_1_price:sale1,
sale_2_price:sale2,
sale_3_price:sale3,

sale_1_active:active1,
sale_2_active:active2,
sale_3_active:active3,

updated_at:new Date().toISOString()

})
.eq("id",id)
.eq("product_key",productKey);


if(error){

console.error(error);

showPriceMessage(
"Qiymət yadda saxlanmadı: " +
error.message,
true
);

return;

}


showPriceMessage(
"✅ " +
productKey.toUpperCase() +
" qiymətləri uğurla yadda saxlanıldı.",
false
);


await loadPrices();

}


/* =========================
QİYMƏT MESAJI
========================= */

function showPriceMessage(text,isError){

const box =
document.getElementById(
"priceMessage"
);

box.textContent=text;

box.style.display="block";

if(isError){

box.classList.add("error");

}else{

box.classList.remove("error");

}

setTimeout(() => {

box.style.display="none";

},4000);

}


/* =========================
MESAJ
========================= */

function showMessage(text,isError){

const box =
document.getElementById("message");

box.textContent=text;

box.style.display="block";

if(isError){

box.classList.add("error");

}else{

box.classList.remove("error");

}

}


/* =========================
TƏHLÜKƏSİZ MƏTN
========================= */

function escapeHtml(text){
