<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DigiBaku — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#050505;
color:#fff;
min-height:100vh;
}

.container{
width:92%;
max-width:850px;
margin:auto;
}

header{
background:#090909;
border-bottom:1px solid #222;
}

.nav{
min-height:70px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:24px;
font-weight:900;
color:#3b82f6;
}

.logo span{color:#fff}

.back{
color:#aaa;
text-decoration:none;
}

main{padding:35px 0}

.card{
background:#101010;
border:1px solid #262626;
border-radius:18px;
padding:25px;
margin-bottom:20px;
}

h1{margin-bottom:8px}
h2{margin-bottom:18px}

.subtitle{
color:#888;
margin-bottom:25px;
}

label{
display:block;
color:#aaa;
font-size:14px;
font-weight:bold;
margin-bottom:7px;
}

input,select,textarea{
width:100%;
padding:14px;
margin-bottom:17px;
border-radius:10px;
border:1px solid #333;
background:#080808;
color:#fff;
font-size:14px;
outline:none;
}

textarea{
min-height:130px;
resize:vertical;
}

button{
width:100%;
padding:14px;
border:0;
border-radius:10px;
background:#2563eb;
color:#fff;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

button:disabled{
opacity:.6;
}

.message{
display:none;
padding:13px;
border-radius:10px;
margin-top:15px;
line-height:1.5;
background:#0b2b1d;
border:1px solid #166534;
color:#86efac;
}

.message.error{
background:#2b0b0b;
border-color:#7f1d1d;
color:#fca5a5;
}

.loading{
text-align:center;
padding:70px 20px;
color:#888;
}

#adminPanel{
display:none;
}

.customer-info{
background:#080808;
border:1px solid #222;
padding:12px;
border-radius:10px;
margin-bottom:15px;
color:#60a5fa;
font-size:14px;
}

.product{
background:#080808;
border:1px solid #252525;
border-radius:12px;
padding:17px;
margin-bottom:10px;
}

.product strong{
display:block;
color:#60a5fa;
font-size:17px;
margin-bottom:7px;
}

.product small{
color:#888;
}

.delete{
margin-top:12px;
background:#991b1b;
}

.empty{
color:#777;
padding:15px 0;
}


/* =========================
   QİYMƏT VƏ ENDİRİM PANELİ
========================= */

.price-product{
background:#080808;
border:1px solid #252525;
border-radius:12px;
padding:18px;
margin-bottom:14px;
}

.price-product h3{
color:#60a5fa;
font-size:17px;
margin-bottom:15px;
}

.price-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.price-row input{
margin-bottom:12px;
}

.sale-info{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-top:2px;
margin-bottom:12px;
}

.sale-percent{
color:#86efac;
font-size:14px;
font-weight:bold;
}

.sale-status{
font-size:13px;
color:#888;
}

.switch-row{
display:flex;
align-items:center;
gap:10px;
margin:5px 0 14px;
}

.switch-row input{
width:auto;
margin:0;
accent-color:#2563eb;
}

.save-price{
background:#16a34a;
margin-top:5px;
}

.save-price:hover{
background:#15803d;
}

.price-message{
display:none;
padding:13px;
border-radius:10px;
margin-top:15px;
background:#0b2b1d;
border:1px solid #166534;
color:#86efac;
line-height:1.5;
}

.price-message.error{
background:#2b0b0b;
border-color:#7f1d1d;
color:#fca5a5;
}

@media(max-width:600px){

.price-row{
grid-template-columns:1fr;
gap:0;
}

}
</style>
</head>

<body>

<header>
<div class="container nav">

<div class="logo">
DigiBaku<span>.com</span>
</div>

<a href="index.html" class="back">
← Sayta qayıt
</a>

</div>
</header>


<main>

<div class="container">

<div id="loading" class="loading">
Admin yoxlanılır...
</div>


<div id="adminPanel">


<!-- =========================
     QİYMƏT VƏ ENDİRİMLƏR
========================= -->

<div class="card">

<h2>Qiymət və Endirimlər</h2>

<p class="subtitle">
Məhsulların qiymətini və endirimlərini buradan idarə et
</p>

<div id="pricesList">

<div class="empty">
Qiymətlər yüklənir...
</div>

</div>

<div id="priceMessage" class="price-message"></div>

</div>


<!-- =========================
     MÜŞTƏRİYƏ MƏHSUL VER
========================= -->

<div class="card">

<h1>Admin Panel</h1>

<p class="subtitle">
Müştəriyə ödənişdən sonra məhsul ver
</p>


<label>
Müştəri
</label>

<select id="customerSelect">

<option value="">
Müştəri seçin...
</option>

</select>


<div id="selectedCustomer"
class="customer-info"
style="display:none">
</div>


<label>
Məhsul
</label>

<select id="productSelect">

<option value="">
Məhsul seçin...
</option>

<option value="Netflix Premium">
Netflix Premium — 6.99 AZN
</option>

<option value="YouTube Premium">
YouTube Premium — 7.99 AZN
</option>

<option value="ChatGPT Plus">
ChatGPT Plus — 11.99 AZN
</option>

<option value="Spotify Premium">
Spotify Premium — 7.99 AZN
</option>

</select>


<label>
Müştəriyə veriləcək hesab məlumatı
</label>

<textarea
id="accountInfo"
placeholder="Məsələn:

Email: example@gmail.com
Şifrə: ********

və ya digər hesab məlumatı..."
></textarea>


<button
id="addButton"
onclick="addProduct()">

Məhsulu müştəriyə əlavə et

</button>


<div id="message"
class="message">
</div>

</div>


<div class="card">

<h2>Verilmiş məhsullar</h2>

<div id="productsList">
Yüklənir...
</div>

</div>


</div>

</div>

</main>


<script>

const SUPABASE_URL =
"https://zeknhnkaicqkfzgnvycq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_jHvCp9fXBA_BwFqrXYpwlw_VC6C1OQk";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const ADMIN_EMAIL =
"zahidovorxan989@gmail.com";


/* =========================
ADMIN YOXLAMA
========================= */

async function checkAdmin(){

const {
data,
error
} =
await supabaseClient.auth.getSession();


if(error || !data.session){

window.location.href="login.html";
return;

}


const email =
(data.session.user.email || "")
.toLowerCase()
.trim();


if(email !== ADMIN_EMAIL.toLowerCase()){

document.getElementById("loading").textContent =
"Bu səhifəyə giriş icazəniz yoxdur.";

return;

}


document.getElementById("loading").style.display="none";

document.getElementById("adminPanel").style.display="block";


await loadCustomers();

await loadProducts();

await loadPrices();

}


/* =========================
MÜŞTƏRİLƏR
========================= */

async function loadCustomers(){

const select =
document.getElementById("customerSelect");


const {
data,
error
} =
await supabaseClient
.from("profiles")
.select("id,email")
.not("email","is",null)
.order("email");


if(error){

console.error(error);

select.innerHTML =
'<option>Müştərilər yüklənmədi</option>';

return;

}


select.innerHTML =
'<option value="">Müştəri seçin...</option>';


data.forEach(customer => {

const option =
document.createElement("option");

option.value =
customer.id;

option.textContent =
customer.email;

select.appendChild(option);

});

}


/* =========================
MÜŞTƏRİ SEÇİLƏNDƏ
========================= */

document.getElementById("customerSelect")
.addEventListener("change",function(){

const option =
this.options[this.selectedIndex];

const box =
document.getElementById("selectedCustomer");


if(!this.value){

box.style.display="none";
box.textContent="";
return;

}


box.style.display="block";

box.textContent =
"Seçilmiş müştəri: " +
option.textContent;

});


/* =========================
MƏHSUL ƏLAVƏ ET
========================= */

async function addProduct(){

const customerId =
document.getElementById("customerSelect").value;

const product =
document.getElementById("productSelect").value;

const accountInfo =
document.getElementById("accountInfo").value.trim();

const button =
document.getElementById("addButton");


if(!customerId){

showMessage(
"Müştəri seç.",
true
);

return;

}


if(!product){

showMessage(
"Məhsul seç.",
true
);

return;

}


if(!accountInfo){

showMessage(
"Hesab məlumatını yaz.",
true
);

return;

}


button.disabled=true;

button.textContent="Əlavə edilir...";


const {
error
} =
await supabaseClient
.from("customer_products")
.insert({

user_id:customerId,

product_name:product,

account_info:accountInfo,

status:"active"

});


if(error){

console.error(error);

showMessage(
"Məhsul əlavə olunmadı: " +
error.message,
true
);

button.disabled=false;

button.textContent =
"Məhsulu müştəriyə əlavə et";

return;

}


showMessage(
"✅ Məhsul müştərinin profilinə əlavə edildi.",
false
);


document.getElementById("customerSelect").value="";

document.getElementById("productSelect").value="";

document.getElementById("accountInfo").value="";

document.getElementById("selectedCustomer").style.display="none";


await loadProducts();


button.disabled=false;

button.textContent =
"Məhsulu müştəriyə əlavə et";

}


/* =========================
MƏHSULLAR
========================= */

async function loadProducts(){

const list =
document.getElementById("productsList");


const {
data,
error
} =
await supabaseClient
.from("customer_products")
.select("*")
.order("created_at",{ascending:false});


if(error){

console.error(error);

list.innerHTML =
'<div class="empty">Məhsullar yüklənmədi.</div>';

return;

}


if(!data || data.length===0){

list.innerHTML =
'<div class="empty">Hələ məhsul verilməyib.</div>';

return;

}


list.innerHTML="";


data.forEach(item => {

const div =
document.createElement("div");

div.className="product";


const date =
item.created_at
?
new Date(item.created_at)
.toLocaleString("az-AZ")
:
"-";


div.innerHTML=`

<strong>
${escapeHtml(item.product_name)}
</strong>

<small>
Müştəri ID:
${escapeHtml(item.user_id)}
</small>

<br><br>

<small>
Tarix:
${escapeHtml(date)}
</small>

<button
class="delete"
onclick="deleteProduct('${item.id}')">

Məhsulu sil

</button>

`;


list.appendChild(div);

});

}


/* =========================
SİL
========================= */

async function deleteProduct(id){

if(!confirm(
"Bu məhsulu müştərinin profilindən silmək istəyirsən?"
)){

return;

}


const {
error
} =
await supabaseClient
.from("customer_products")
.delete()
.eq("id",id);


if(error){

alert(
"Silinmədi: " +
error.message
);

return;

}


await loadProducts();

}


/* =========================
QİYMƏTLƏRİ YÜKLƏ
========================= */

async function loadPrices(){

const list =
document.getElementById("pricesList");


const {
data,
error
} =
await supabaseClient
.from("product_prices")
.select("*")
.order("id");


if(error){

console.error(error);

list.innerHTML =
'<div class="empty">Qiymətlər yüklənmədi. Supabase cədvəlini yoxla.</div>';

return;

}


if(!data || data.length===0){

list.innerHTML =
'<div class="empty">Heç bir məhsul tapılmadı.</div>';

return;

}


list.innerHTML="";


data.forEach(item => {

const div =
document.createElement("div");

div.className="price-product";

const regularPrice =
Number(item.regular_price || 0);

const salePrice =
item.sale_price === null
?
regularPrice
:
Number(item.sale_price);

let percent = 0;

if(
item.sale_active &&
regularPrice > 0 &&
salePrice < regularPrice
){

percent =
Math.round(
((regularPrice - salePrice) /
regularPrice) * 100
);

}


div.innerHTML = `

<h3>
${escapeHtml(item.product_name)}
</h3>

<div class="price-row">

<div>

<label>
Normal qiymət (AZN)
</label>

<input
type="number"
step="0.01"
min="0"
id="regular-${item.id}"
value="${regularPrice.toFixed(2)}"
>

</div>

<div>

<label>
Endirimli qiymət (AZN)
</label>

<input
type="number"
step="0.01"
min="0"
id="sale-${item.id}"
value="${salePrice.toFixed(2)}"
>

</div>

</div>


<div class="switch-row">

<input
type="checkbox"
id="active-${item.id}"
${item.sale_active ? "checked" : ""}
>

<label
for="active-${item.id}"
style="margin:0">

Endirimi aktiv et

</label>

</div>


<div class="sale-info">

<span
class="sale-percent"
id="percent-${item.id}">

${
percent > 0
?
"🔥 " + percent + "% ENDİRİM"
:
"Endirim yoxdur"
}

</span>

<span
class="sale-status"
id="status-${item.id}">

${
item.sale_active
?
"AKTİV"
:
"DEAKTİV"
}

</span>

</div>


<button
class="save-price"
onclick="savePrice(${item.id}, '${escapeHtml(item.product_key)}')">

Yadda saxla

</button>

`;


list.appendChild(div);


const regularInput =
document.getElementById(
"regular-" + item.id
);

const saleInput =
document.getElementById(
"sale-" + item.id
);

const activeInput =
document.getElementById(
"active-" + item.id
);


regularInput.addEventListener(
"input",
() => updatePricePreview(item.id)
);

saleInput.addEventListener(
"input",
() => updatePricePreview(item.id)
);

activeInput.addEventListener(
"change",
() => updatePricePreview(item.id)
);

});

}


/* =========================
QİYMƏT PREVIEW
========================= */

function updatePricePreview(id){

const regular =
Number(
document.getElementById(
"regular-" + id
).value
) || 0;

const sale =
Number(
document.getElementById(
"sale-" + id
).value
) || 0;

const active =
document.getElementById(
"active-" + id
).checked;


const percentBox =
document.getElementById(
"percent-" + id
);

const statusBox =
document.getElementById(
"status-" + id
);


let percent = 0;

if(
active &&
regular > 0 &&
sale < regular
){

percent =
Math.round(
((regular - sale) / regular) * 100
);

}


percentBox.textContent =
percent > 0
?
"🔥 " + percent + "% ENDİRİM"
:
"Endirim yoxdur";


statusBox.textContent =
active
?
"AKTİV"
:
"DEAKTİV";

}


/* =========================
QİYMƏTİ YADDA SAXLA
========================= */

async function savePrice(id,productKey){

const regular =
Number(
document.getElementById(
"regular-" + id
).value
);

const sale =
Number(
document.getElementById(
"sale-" + id
).value
);

const active =
document.getElementById(
"active-" + id
).checked;


if(
isNaN(regular) ||
regular < 0
){

showPriceMessage(
"Normal qiymət düzgün deyil.",
true
);

return;

}


if(
isNaN(sale) ||
sale < 0
){

showPriceMessage(
"Endirimli qiymət düzgün deyil.",
true
);

return;

}


if(active && sale >= regular){

showPriceMessage(
"Endirim aktivdirsə, endirimli qiymət normal qiymətdən aşağı olmalıdır.",
true
);

return;

}


const {
error
} =
await supabaseClient
.from("product_prices")
.update({

regular_price:regular,

sale_price:sale,

sale_active:active,

updated_at:new Date().toISOString()

})
.eq("id",id)
.eq("product_key",productKey);


if(error){

console.error(error);

showPriceMessage(
"Qiymət yadda saxlanmadı: " +
error.message,
true
);

return;

}


showPriceMessage(
"✅ " +
productKey.toUpperCase() +
" qiyməti uğurla yadda saxlanıldı.",
false
);


await loadPrices();

}


/* =========================
QİYMƏT MESAJI
========================= */

function showPriceMessage(text,isError){

const box =
document.getElementById(
"priceMessage"
);

box.textContent=text;

box.style.display="block";


if(isError){

box.classList.add("error");

}else{

box.classList.remove("error");

}


setTimeout(() => {

box.style.display="none";

},4000);

}


/* =========================
MESAJ
========================= */

function showMessage(text,isError){

const box =
document.getElementById("message");

box.textContent=text;

box.style.display="block";

if(isError){

box.classList.add("error");

}else{

box.classList.remove("error");

}

}


/* =========================
TƏHLÜKƏSİZ MƏTN
========================= */

function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


checkAdmin();

</script>

</body>
</html>
