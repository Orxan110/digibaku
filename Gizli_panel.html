<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DigiBaku.com — Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top left,#172554 0,transparent 35%),
        #050505;
    color:#fff;
    min-height:100vh;
}

.container{
    width:92%;
    max-width:1000px;
    margin:auto;
}

header{
    background:rgba(5,5,5,.95);
    border-bottom:1px solid #222;
}

.nav{
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.logo{
    font-size:24px;
    font-weight:900;
    color:#3b82f6;
}

.logo span{
    color:#fff;
}

.btn{
    border:0;
    border-radius:9px;
    padding:11px 16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-primary{
    background:#2563eb;
    color:#fff;
}

.btn-dark{
    background:#151515;
    color:#fff;
    border:1px solid #333;
}

.btn-danger{
    background:#991b1b;
    color:#fff;
}

main{
    padding:40px 0;
}

.title{
    margin-bottom:25px;
}

.title h1{
    font-size:32px;
    margin-bottom:7px;
}

.title p{
    color:#888;
}

.card{
    background:#101010;
    border:1px solid #252525;
    border-radius:18px;
    padding:25px;
    margin-bottom:20px;
}

.card h2{
    margin-bottom:18px;
}

label{
    display:block;
    color:#bbb;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

select,
textarea{
    width:100%;
    background:#080808;
    color:#fff;
    border:1px solid #333;
    border-radius:9px;
    padding:13px;
    font-size:14px;
    outline:none;
    margin-bottom:17px;
}

select:focus,
textarea:focus{
    border-color:#2563eb;
}

textarea{
    min-height:130px;
    resize:vertical;
}

.message{
    display:none;
    padding:13px;
    border-radius:9px;
    margin-bottom:18px;
    font-size:14px;
}

.success{
    display:block;
    background:#052e1b;
    border:1px solid #065f46;
    color:#6ee7b7;
}

.error{
    display:block;
    background:#3b0a0a;
    border:1px solid #7f1d1d;
    color:#fca5a5;
}

.product-row{
    background:#080808;
    border:1px solid #222;
    border-radius:12px;
    padding:17px;
    margin-bottom:10px;
}

.product-row strong{
    display:block;
    margin-bottom:7px;
}

.product-row small{
    color:#999;
    line-height:1.7;
}

#adminPanel{
    display:none;
}

#loading{
    text-align:center;
    padding:100px 20px;
    color:#888;
}

.customer-info{
    background:#080808;
    border:1px solid #222;
    padding:12px;
    border-radius:9px;
    margin-bottom:15px;
    color:#aaa;
    font-size:13px;
}

@media(max-width:650px){

    .card{
        padding:20px;
    }

    .title h1{
        font-size:27px;
    }

    .nav{
        flex-wrap:wrap;
        padding:10px 0;
    }

    .nav button{
        padding:9px 11px;
        font-size:12px;
    }
}
</style>
</head>

<body>

<header>
<div class="container nav">

<div class="logo">
DigiBaku<span>.com</span>
</div>

<div>

<button
class="btn btn-dark"
onclick="goHome()">
Ana səhifə
</button>

<button
class="btn btn-danger"
onclick="logout()">
Çıxış
</button>

</div>

</div>
</header>

<div id="loading">
Admin yoxlanılır...
</div>

<main id="adminPanel">

<div class="container">

<div class="title">

<h1>Admin Panel</h1>

<p>
Müştərilərə ödənişdən sonra premium məhsul göndər.
</p>

</div>


<!-- MƏHSUL ƏLAVƏ ET -->

<div class="card">

<h2>Müştəriyə məhsul əlavə et</h2>

<div id="message" class="message"></div>

<label>
Müştəri
</label>

<select id="customerSelect">

<option value="">
Müştəri seçin...
</option>

</select>

<div id="selectedCustomer" class="customer-info">
Müştəri seçilməyib.
</div>


<label>
Məhsul
</label>

<select id="productSelect">

<option value="">
Məhsul seçin...
</option>

<option value="Netflix Premium">
Netflix Premium
</option>

<option value="YouTube Premium">
YouTube Premium
</option>

<option value="ChatGPT Plus">
ChatGPT Plus
</option>

<option value="Spotify Premium">
Spotify Premium
</option>

</select>


<label>
Hesab məlumatı
</label>

<textarea
id="accountInfo"
placeholder="Məsələn:

Email: example@gmail.com
Şifrə: ********

və ya müştəriyə veriləcək digər məlumatlar..."></textarea>


<button
id="addButton"
class="btn btn-primary"
onclick="addProduct()">

Məhsulu müştəriyə əlavə et

</button>

</div>


<!-- MƏHSULLAR -->

<div class="card">

<h2>
Əlavə edilmiş məhsullar
</h2>

<div id="productsList">
Yüklənir...
</div>

</div>

</div>

</main>


<script>

const SUPABASE_URL =
"https://zeknhnkaicqkfzgnvycq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_jHvCp9fXBA_BwFqrXYpwlw_VC6C1OQk";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ADMIN EMAIL */

const ADMIN_EMAIL =
"zahidovorxan989@gmail.com";


/* =========================
   MESAJ
========================= */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " + type;
}


function clearMessage(){

    const box =
        document.getElementById("message");

    box.textContent = "";

    box.className = "message";
}


/* =========================
   ANA SƏHİFƏ
========================= */

function goHome(){

    window.location.href =
        "index.html";
}


/* =========================
   ADMIN YOXLAMA
========================= */

async function checkAdmin(){

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();


    if(error){

        console.error(error);

        window.location.href =
            "login.html";

        return;
    }


    const session =
        data.session;


    if(!session){

        window.location.href =
            "login.html";

        return;
    }


    const email =
        (session.user.email || "").toLowerCase();


    if(
        email !==
        ADMIN_EMAIL.toLowerCase()
    ){

        alert(
            "Bu səhifəyə yalnız admin daxil ola bilər."
        );

        window.location.href =
            "index.html";

        return;
    }


    document.getElementById(
        "loading"
    ).style.display = "none";


    document.getElementById(
        "adminPanel"
    ).style.display = "block";


    await loadCustomers();

    await loadProducts();
}


/* =========================
   MÜŞTƏRİLƏR
========================= */

async function loadCustomers(){

    const select =
        document.getElementById(
            "customerSelect"
        );


    select.innerHTML =
        `<option value="">
        Müştərilər yüklənir...
        </option>`;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select("id,email")
        .order("email");


    if(error){

        console.error(error);

        select.innerHTML =
            `<option value="">
            Müştərilər yüklənmədi
            </option>`;

        return;
    }


    select.innerHTML =
        `<option value="">
        Müştəri seçin...
        </option>`;


    if(!data || data.length === 0){

        select.innerHTML =
            `<option value="">
            Heç bir müştəri tapılmadı
            </option>`;

        return;
    }


    data.forEach(user => {

        const option =
            document.createElement("option");


        option.value =
            user.id;


        option.textContent =
            user.email || user.id;


        option.dataset.email =
            user.email || "";


        select.appendChild(option);

    });
}


/* MÜŞTƏRİ SEÇİLƏNDƏ */

document
.getElementById("customerSelect")
.addEventListener(
    "change",
    function(){

        const option =
            this.options[this.selectedIndex];


        const box =
            document.getElementById(
                "selectedCustomer"
            );


        if(!this.value){

            box.textContent =
                "Müştəri seçilməyib.";

            return;
        }


        box.textContent =
            "Seçilən müştəri: " +
            (option.dataset.email || option.textContent);

    }
);


/* =========================
   MƏHSUL ƏLAVƏ ET
========================= */

async function addProduct(){

    clearMessage();


    const userId =
        document.getElementById(
            "customerSelect"
        ).value;


    const product =
        document.getElementById(
            "productSelect"
        ).value;


    const accountInfo =
        document.getElementById(
            "accountInfo"
        ).value.trim();


    if(!userId){

        showMessage(
            "Əvvəl müştəri seç.",
            "error"
        );

        return;
    }


    if(!product){

        showMessage(
            "Məhsul seç.",
            "error"
        );

        return;
    }


    if(!accountInfo){

        showMessage(
            "Hesab məlumatını yaz.",
            "error"
        );

        return;
    }


    const button =
        document.getElementById(
            "addButton"
        );


    button.disabled = true;

    button.textContent =
        "Əlavə edilir...";


    const {
        error
    } =
    await supabaseClient
        .from("customer_products")
        .insert({

            user_id: userId,

            product_name: product,

            account_info: accountInfo,

            status: "active"

        });


    button.disabled = false;

    button.textContent =
        "Məhsulu müştəriyə əlavə et";


    if(error){

        console.error(error);

        showMessage(
            "Məhsul əlavə edilmədi: " +
            error.message,
            "error"
        );

        return;
    }


    showMessage(
        "✅ Məhsul müştərinin hesabına əlavə edildi.",
        "success"
    );


    document.getElementById(
        "accountInfo"
    ).value = "";


    document.getElementById(
        "productSelect"
    ).value = "";


    document.getElementById(
        "customerSelect"
    ).value = "";


    document.getElementById(
        "selectedCustomer"
    ).textContent =
        "Müştəri seçilməyib.";


    await loadProducts();
}


/* =========================
   MƏHSULLARI GÖSTƏR
========================= */

async function loadProducts(){

    const list =
        document.getElementById(
            "productsList"
        );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("customer_products")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        list.innerHTML =
            `<div class="product-row">
            Məhsullar yüklənmədi.
            </div>`;

        return;
    }


    if(!data || data.length === 0){

        list.innerHTML =
            `<div class="product-row">
            Hələ məhsul əlavə edilməyib.
            </div>`;

        return;
    }


    list.innerHTML = "";


    data.forEach(item => {

        const row =
            document.createElement("div");


        row.className =
            "product-row";


        const date =
            item.created_at
            ?
            new Date(
                item.created_at
            ).toLocaleString(
                "az-AZ"
            )
            :
            "-";


        row.innerHTML = `

        <strong>
            ${escapeHtml(item.product_name)}
        </strong>

        <small>
            Müştəri ID:
            ${escapeHtml(item.user_id)}
        </small>

        <br>

        <small>
            Tarix:
            ${escapeHtml(date)}
        </small>

        <div style="margin-top:12px;">

            <button
                class="btn btn-danger"
                onclick="deleteProduct('${item.id}')">

                Sil

            </button>

        </div>

        `;


        list.appendChild(row);

    });
}


/* =========================
   MƏHSULU SİL
========================= */

async function deleteProduct(id){

    const ok =
        confirm(
            "Bu məhsulu silmək istəyirsən?"
        );


    if(!ok){
        return;
    }


    const {
        error
    } =
    await supabaseClient
        .from("customer_products")
        .delete()
        .eq("id",id);


    if(error){

        console.error(error);

        alert(
            "Məhsul silinmədi: " +
            error.message
        );

        return;
    }


    await loadProducts();
}


/* =========================
   HTML TƏHLÜKƏSİZLİYİ
========================= */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   ÇIXIŞ
========================= */

async function logout(){

    await supabaseClient.auth.signOut();

    window.location.href =
        "login.html";
}


/* =========================
   BAŞLAT
========================= */

checkAdmin();

</script>

</body>
</html>
