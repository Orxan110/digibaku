<script>
(function(){

const SEO_SUPABASE_URL="https://zeknhnkaicqkfzgnvycq.supabase.co";
const SEO_SUPABASE_KEY="sb_publishable_jHvCp9fXBA_BwFqrXYpwlw_VC6C1OQk";

function seoNormalize(value){
return String(value||"")
.replace(/\s+/g," ")
.trim();
}

function seoProductName(name){

let value=seoNormalize(name);

if(!value)return "";

let previous="";

do{

previous=value;

value=value
.replace(/\s+(satışı|satisi|satış|satis)\s+(azərbaycan|azerbaijan)\s*$/i,"")
.replace(/\s+(satışı|satisi|satış|satis)\s*$/i,"")
.replace(/\s+(azərbaycan|azerbaijan)\s*$/i,"")
.trim();

}while(value!==previous);

return value+" Satışı Azərbaycan";

}

function seoUniqueProducts(products){

const result=[];
const seen=new Set();

products.forEach(function(product){

const name=seoNormalize(
product.name_az ||
product.name ||
""
);

if(!name)return;

const seoName=seoProductName(name);

if(!seoName)return;

const key=seoName.toLocaleLowerCase("az-AZ");

if(!seen.has(key)){

seen.add(key);
result.push(seoName);

}

});

return result;

}

function seoSetMeta(id,content){

const el=document.getElementById(id);

if(el){
el.setAttribute("content",content);
}

}

function seoUpdate(products){

const seoProducts=
seoUniqueProducts(products);

const titles = {
    az: "DigiBaku Azərbaycan | Premium Rəqəmsal Xidmətlər",
    ru: "DigiBaku Azərbaycan | Премиальные цифровые услуги",
    en: "DigiBaku Azerbaijan | Premium Digital Services"
};

const descriptions = {
    az: "DigiBaku.com — Netflix, YouTube Premium, ChatGPT, Gemini, Spotify və digər premium rəqəmsal xidmətlər. Sərfəli qiymətlər və rahat sifariş.",
    ru: "DigiBaku.com — Netflix, YouTube Premium, ChatGPT, Gemini, Spotify и другие премиальные цифровые услуги по выгодным ценам.",
    en: "DigiBaku.com offers Netflix, YouTube Premium, ChatGPT, Gemini, Spotify and other premium digital services at affordable prices."
};

const lang = localStorage.getItem("digi_language") || "az";
const title = titles[lang] || titles.az;
const description = descriptions[lang] || descriptions.az;

const keywords=[
"DigiBaku Azərbaycan",
...seoProducts,
"premium rəqəmsal xidmətlər Azərbaycan",
"premium abunəliklər Azərbaycan"
].join(", ");

document.title=title;

const titleElement=
document.getElementById("seoTitle");

if(titleElement){
titleElement.textContent=title;
}

seoSetMeta(
"metaDescription",
description
);

seoSetMeta(
"metaKeywords",
keywords
);

seoSetMeta(
"ogTitle",
title
);

seoSetMeta(
"ogDescription",
description
);

seoSetMeta(
"twitterTitle",
title
);

seoSetMeta(
"twitterDescription",
description
);

const organization=
document.getElementById("seoOrganization");

const organization2=
document.getElementById("seoOrganization2");

const website=
document.getElementById("seoWebSite");

const website2=
document.getElementById("seoWebSite2");

const organizationData={
"@context":"https://schema.org",
"@type":"Organization",
"name":"DigiBaku.com",
"url":"https://digibaku.com/",
"description":description,
"areaServed":{
"@type":"Country",
"name":"Azerbaijan"
},
"address":{
"@type":"PostalAddress",
"addressLocality":"Baku",
"addressCountry":"AZ"
}
};

const websiteData={
"@context":"https://schema.org",
"@type":"WebSite",
"name":"DigiBaku.com",
"alternateName":"DigiBaku Azərbaycan",
"url":"https://digibaku.com/"
};

if(organization){
organization.textContent=
JSON.stringify(organizationData);
}

if(organization2){
organization2.textContent=
JSON.stringify(organizationData);
}

if(website){
website.textContent=
JSON.stringify(websiteData);
}

if(website2){
website2.textContent=
JSON.stringify(websiteData);
}

}

async function loadDynamicSEO(){

try{

const response=await fetch(
SEO_SUPABASE_URL+
"/rest/v1/site_products"+
"?select=name_az,name,name_en,name_ru,product_key,active"+
"&order=id.asc",
{
method:"GET",
headers:{
"apikey":SEO_SUPABASE_KEY,
"Authorization":"Bearer "+SEO_SUPABASE_KEY
},
cache:"no-store"
}
);

if(!response.ok)return;

const data=await response.json();

const products=(data||[]).filter(product=>!(
product.active===false ||
product.active==="false" ||
product.active===0 ||
product.active==="0"
));

seoUpdate(products);

}catch(error){

console.error(
"DigiBaku dinamik SEO xətası:",
error
);

}

}

loadDynamicSEO();

setInterval(
loadDynamicSEO,
300000
);

})();
</script>
