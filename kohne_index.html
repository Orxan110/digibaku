<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DigiBaku – Rəqəmsal xidmətlər</title>
<meta name="description" content="DigiBaku: Netflix, YouTube Premium, ChatGPT, Spotify və digər rəqəmsal xidmətlər.">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><circle cx='5' cy='5' r='4' fill='%233DF5D0'/></svg>">
<style>
  :root {
    --bg: #0B0C10; --panel: #111318; --line: #1E2026;
    --text: #E8E8EA; --muted: #8A8D96; --accent: #3DF5D0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: 72px; }
  a { color: inherit; text-decoration: none; }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--line); display: flex; align-items: center;
    justify-content: space-between; padding: 14px 20px; gap: 12px; flex-wrap: wrap; }
  .logo { font-family: Unbounded, Inter, sans-serif; font-weight: 700; letter-spacing: .5px; }
  .logo span { color: var(--accent); }
  nav.main { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  nav.main a.active, nav.main a:hover { color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px; min-height: 70vh; }
  h1 { font-family: Unbounded, Inter, sans-serif; font-size: 28px; margin: 0 0 12px; }
  h2 { font-size: 20px; margin: 0 0 8px; }
  p, li { line-height: 1.6; color: var(--muted); }
  .hero { padding: 48px 0 32px; border-bottom: 1px solid var(--line); margin-bottom: 32px; }
  .hero p { max-width: 620px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card { border: 1px solid var(--line); background: var(--panel); padding: 20px; border-radius: 4px;
    transition: border-color .25s, transform .25s; display: flex; flex-direction: column; gap: 10px; }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .tag { font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
  .price { color: var(--text); font-weight: 600; }
  .btn { display: inline-block; padding: 10px 16px; border: 1px solid var(--accent); color: var(--accent);
    border-radius: 4px; font-size: 14px; cursor: pointer; background: transparent; text-align: center; }
  .btn:hover { background: var(--accent); color: var(--bg); }
  .btn.solid { background: var(--accent); color: var(--bg); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  details { border-bottom: 1px solid var(--line); padding: 14px 0; }
  summary { cursor: pointer; color: var(--text); font-weight: 500; }
  details p { margin: 10px 0 0; }
  .stars { color: var(--accent); letter-spacing: 2px; }
  .review { border: 1px solid var(--line); padding: 16px; background: var(--panel); }
  .features { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }
  .plans { display: grid; gap: 8px; margin-top: auto; }
  .plan { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    border: 1px solid var(--line); padding: 10px 12px; font-size: 14px; }
  .notice { font-size: 13px; color: var(--muted); border-left: 2px solid var(--accent); padding-left: 12px; margin-top: 24px; }
  .wa-float { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20;
    background: var(--accent); color: var(--bg); padding: 12px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; }
  .mobile-nav { display: none; }
  footer { border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 13px; padding: 24px; }
  @media (max-width: 720px) {
    nav.main { display: none; }
    .mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around;
      background: var(--bg); border-top: 1px solid var(--line); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 15; font-size: 12px; }
    .mobile-nav a { color: var(--muted); }
    .mobile-nav a.active { color: var(--accent); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <a class="logo" href="#/">DIGI<span>BAKU</span></a>
  <nav class="main" aria-label="Əsas menyu">
    <a href="#/products" data-route="products">Məhsullar</a>
    <a href="#/prices" data-route="prices">Qiymətlər</a>
    <a href="#/faq" data-route="faq">FAQ</a>
    <a href="#/reviews" data-route="reviews">Rəylər</a>
    <a href="#/about" data-route="about">Haqqımızda</a>
    <a href="#/contact" data-route="contact">Əlaqə</a>
  </nav>
</header>

<main id="app"></main>

<footer>© DigiBaku · <a href="#/contact">Əlaqə</a></footer>

<nav class="mobile-nav" aria-label="Mobil menyu">
  <a href="#/" data-route="home">Ana</a>
  <a href="#/products" data-route="products">Məhsullar</a>
  <a href="#/prices" data-route="prices">Qiymət</a>
  <a href="#/contact" data-route="contact">Əlaqə</a>
</nav>

<a class="wa-float" href="https://wa.me/994513626349" target="_blank" rel="noopener">WhatsApp</a>

<script>
/*
  NÜMUNƏ MƏLUMAT. Qiymətlər və paketlər real deyil.
  Supabase qoşulanda bu massiv bazadan oxunacaq.
  price: null olarsa "Qiymət yoxlanılır" göstərilir.
*/
const PRODUCTS = [
  { slug: "netflix", name: "Netflix Premium", category: "Film və seriallar",
    desc: "Yüksək keyfiyyətli film və serial kataloqu.",
    features: ["4K dəstəyi", "Bir neçə cihaz", "Reklamsız izləmə"],
    plans: [{ name: "1 aylıq", months: 1, price: 0 }] },
  { slug: "youtube-premium", name: "YouTube Premium", category: "Video və əyləncə",
    desc: "Reklamsız video və arxa planda oxutma.",
    features: ["Reklamsız baxış", "Arxa planda oxutma", "Offline yükləmə"],
    plans: [{ name: "1 aylıq", months: 1, price: 0 }] },
  { slug: "chatgpt-business", name: "ChatGPT Business", category: "Süni intellekt",
    desc: "Komanda üçün süni intellekt aləti.",
    features: ["Daha çox sorğu limiti", "Komanda idarəetməsi", "Məlumat təhlükəsizliyi"],
    plans: [{ name: "1 aylıq", months: 1, price: 0 }] },
  { slug: "gemini-advanced", name: "Gemini Advanced Pro", category: "Süni intellekt",
    desc: "Google-un təkmil süni intellekt modeli.",
    features: ["Təkmil modellər", "Google məhsulları ilə inteqrasiya"],
    plans: [{ name: "1 aylıq", months: 1, price: 0 }] },
  { slug: "grammarly-premium", name: "Grammarly Premium", category: "Təhsil",
    desc: "İngilis dili üçün yazı və qrammatika yoxlaması.",
    features: ["Təkmil qrammatika", "Üslub təklifləri"],
    plans: [{ name: "1 aylıq", months: 1, price: 0 }] },
  { slug: "spotify-premium", name: "Spotify Premium", category: "Musiqi",
    desc: "Reklamsız musiqi dinləmə.",
    features: ["Reklamsız musiqi", "Offline dinləmə"],
    plans: [{ name: "1 aylıq", months: 1, price: 0 }] },
  { slug: "canva-pro", name: "Canva Pro", category: "Dizayn və yaradıcılıq",
    desc: "Premium şablonlar və dizayn alətləri.",
    features: ["Premium şablonlar", "Brend dəstəyi"],
    plans: [{ name: "1 aylıq", months: 1, price: 0 }] },
  { slug: "deezer-premium", name: "Deezer Premium", category: "Musiqi",
    desc: "Reklamsız və yüksək keyfiyyətli musiqi.",
    features: ["Yüksək keyfiyyət", "Reklamsız dinləmə"],
    plans: [{ name: "1 aylıq", months: 1, price: 0 }] },
  { slug: "avast-secureline-vpn", name: "Avast SecureLine VPN", category: "Təhlükəsizlik və VPN",
    desc: "Təhlükəsiz və şəxsi internet bağlantısı.",
    features: ["Şifrələnmiş bağlantı", "Bir neçə cihaz"],
    plans: [{ name: "1 illik", months: 12, price: 0 }] },
  { slug: "hbo-max-tv", name: "HBO MAX TV", category: "Film və seriallar",
    desc: "HBO və BluTV kontenti.",
    features: ["Serial və film kataloqu"],
    plans: [{ name: "1 aylıq", months: 1, price: 0 }] },
  { slug: "amazon-prime-video", name: "Amazon Prime Video", category: "Film və seriallar",
    desc: "Amazon video kataloqu.",
    features: ["Film və serial kataloqu"],
    plans: [{ name: "1 aylıq", months: 1, price: 0 }] },
  { slug: "duolingo-super", name: "Duolingo Super", category: "Təhsil",
    desc: "Reklamsız dil öyrənmə.",
    features: ["Reklamsız öyrənmə", "Sınaq imkanları"],
    plans: [{ name: "1 aylıq", months: 1, price: 0 }] }
];

const FAQS = [
  { q: "Sifarişi necə verirəm?", a: "Məhsulu seçin, paketi və qiyməti yoxlayın, sonra «Sifariş ver» düyməsi ilə WhatsApp üzərindən göndərin." },
  { q: "Ödəniş necə olur?", a: "Ödəniş şərtləri sifarişin təsdiqi zamanı WhatsApp üzərindən bildirilir." },
  { q: "Sifariş nə qədər vaxt aparır?", a: "Sifariş təsdiqləndikdən sonra hazırlanma müddəti WhatsApp-da bildirilir." }
];

const REVIEWS = [
  { name: "Nümunə müştəri", product: "Netflix Premium", rating: 5, body: "Nümunə mətn. Real rəylər admin təsdiqindən sonra burada görünəcək." }
];

const WA = "https://wa.me/994513626349";

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function fmtPrice(p) {
  return p === null || p === undefined ? "Qiymət yoxlanılır" : `${esc(p)} AZN`;
}
function waOrderLink(productName, planName) {
  const text = encodeURIComponent(`Salam, ${productName} (${planName}) sifariş etmək istəyirəm.`);
  return `${WA}?text=${text}`;
}
function stars(n) {
  return `<span class="stars" aria-label="${n} ulduz">${"★".repeat(n)}${"☆".repeat(5 - n)}</span>`;
}

const pages = {
  home() {
    const featured = PRODUCTS.slice(0, 6).map(productCard).join("");
    return `
      <section class="hero">
        <p class="tag">Rəqəmsal xidmətlər</p>
        <h1>Ən populyar rəqəmsal xidmətlər, bir yerdə</h1>
        <p>Film, musiqi, süni intellekt və təhsil xidmətlərini sadə və şəffaf qiymətlərlə əldə edin.</p>
        <p style="margin-top:20px"><a class="btn solid" href="#/products">Məhsullara bax</a></p>
      </section>
      <h2>Seçilmiş məhsullar</h2>
      <div class="grid">${featured}</div>`;
  },
  products() {
    return `<h1>Məhsullar</h1>
      <div class="grid">${PRODUCTS.map(productCard).join("")}</div>`;
  },
  product(slug) {
    const p = PRODUCTS.find(x => x.slug === slug);
    if (!p) return pages.notFound();
    return `
      <p class="tag">${esc(p.category)}</p>
      <h1>${esc(p.name)}</h1>
      <p>${esc(p.desc)}</p>
      <ul class="features">${p.features.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
      <h2 style="margin-top:28px">Paketlər</h2>
      <div class="plans">
        ${p.plans.map(pl => `
          <div class="plan">
            <span>${esc(pl.name)} · ${esc(pl.months)} ay</span>
            <span class="price">${fmtPrice(pl.price)}</span>
            <a class="btn" href="${waOrderLink(p.name, pl.name)}" target="_blank" rel="noopener">Sifariş ver</a>
          </div>`).join("")}
      </div>
      <h2 style="margin-top:32px">Rəylər</h2>
      ${REVIEWS.filter(r => r.product === p.name).map(reviewCard).join("") || "<p>Hələ rəy yoxdur.</p>"}`;
  },
  prices() {
    const rows = PRODUCTS.flatMap(p => p.plans.map(pl => `
      <tr><td>${esc(p.name)}</td><td>${esc(pl.name)}</td><td>${esc(pl.months)} ay</td><td class="price">${fmtPrice(pl.price)}</td></tr>`)).join("");
    return `<h1>Qiymətlər</h1>
      <table><thead><tr><th>Məhsul</th><th>Paket</th><th>Müddət</th><th>Qiymət</th></tr></thead><tbody>${rows}</tbody></table>`;
  },
  faq() {
    return `<h1>Tez-tez verilən suallar</h1>
      ${FAQS.map(f => `<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("")}`;
  },
  reviews() {
    return `<h1>Müştəri rəyləri</h1>
      <div class="grid">${REVIEWS.map(reviewCard).join("") || "<p>Hələ rəy yoxdur.</p>"}</div>`;
  },
  about() {
    return `<h1>Haqqımızda</h1>
      <p>DigiBaku rəqəmsal xidmətləri şəffaf qiymətlərlə və sadə sifariş prosesi ilə təqdim edir.</p>`;
  },
  contact() {
    return `<h1>Əlaqə</h1>
      <p>WhatsApp: <a href="${WA}" target="_blank" rel="noopener" style="color:var(--accent)">+994 51 362 63 49</a></p>
      <p class="notice">Canlı çat və hesab sistemi Supabase qoşulduqdan sonra əlavə olunacaq.</p>`;
  },
  notFound() {
    return `<h1>Səhifə tapılmadı</h1><p><a href="#/" style="color:var(--accent)">Ana səhifəyə qayıt</a></p>`;
  }
};

function productCard(p) {
  return `
    <article class="card">
      <span class="tag">${esc(p.category)}</span>
      <h2>${esc(p.name)}</h2>
      <p>${esc(p.desc)}</p>
      <div class="plans">
        <span class="price">${fmtPrice(p.plans[0]?.price)}</span>
        <a class="btn" href="#/p/${esc(p.slug)}">Ətraflı</a>
      </div>
    </article>`;
}
function reviewCard(r) {
  return `<div class="review"><div>${stars(r.rating)}</div><p>${esc(r.body)}</p><p><strong style="color:var(--text)">${esc(r.name)}</strong> · ${esc(r.product)}</p></div>`;
}

function route() {
  const hash = location.hash.replace(/^#\/?/, "");
  const [head, arg] = hash.split("/");
  let html;
  let key = head || "home";
  if (head === "p") { html = pages.product(arg); key = "products"; }
  else if (pages[key] && typeof pages[key] === "function") html = pages[key]();
  else { html = pages.notFound(); key = ""; }
  document.getElementById("app").innerHTML = html;
  document.title = (key === "home" ? "DigiBaku" : "DigiBaku – " + (head === "p" ? "Məhsul" : key));
  document.querySelectorAll("[data-route]").forEach(a => {
    a.classList.toggle("active", a.dataset.route === key);
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
