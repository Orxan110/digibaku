<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://zeknhnkaicqkfzgnvycq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_jHvCp9fXBA_BwFqrXYpwlw_VC6C1OQk";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   CART
========================= */

let cart =
JSON.parse(
  localStorage.getItem("digibaku_cart") || "[]"
);


function saveCart(){

  localStorage.setItem(
    "digibaku_cart",
    JSON.stringify(cart)
  );

}


function updateCart(){

  document.getElementById("cartCount")
  .textContent = cart.length;

  renderCart();

}


/* =========================
   ADD TO CART
========================= */

function addProduct(
  id,
  name,
  price,
  category
){

  const exists =
  cart.some(
    item => String(item.id) === String(id)
  );

  if(exists){

    alert(
      "Bu məhsul artıq səbətdədir."
    );

    return;
  }


  cart.push({

    id:id,
    name:name,
    price:Number(price),
    category:category,
    seller:"DigiBaku"

  });


  saveCart();

  updateCart();

  alert(
    "Məhsul səbətə əlavə edildi."
  );

}


/* =========================
   REMOVE PRODUCT
========================= */

function removeProduct(index){

  cart.splice(index,1);

  saveCart();

  updateCart();

}


/* =========================
   CLEAR CART
========================= */

function clearCart(){

  if(cart.length === 0){

    return;

  }


  if(
    confirm(
      "Səbəti təmizləmək istəyirsən?"
    )
  ){

    cart = [];

    saveCart();

    updateCart();

  }

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

  const box =
  document.getElementById(
    "cartItems"
  );

  if(!box){

    return;

  }


  if(cart.length === 0){

    box.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🛒
        </div>

        <h3>
          Səbətin boşdur
        </h3>

        <p>
          Məhsul əlavə etdikdə burada görünəcək.
        </p>

        <br>

        <button
          class="btn primary"
          onclick="showSection('home')">

          Məhsullara bax

        </button>

      </div>

    `;


    document.getElementById(
      "cartTotal"
    ).textContent = "0.00 AZN";


    document.getElementById(
      "cartTotalCount"
    ).textContent = "0";

    return;

  }


  let total = 0;


  box.innerHTML =
  cart.map(
    (item,index) => {

      total +=
      Number(item.price);


      return `

        <div class="cart-item">

          <div class="cart-icon">
            🎮
          </div>

          <div class="cart-info">

            <h3>
              ${escapeHTML(item.name)}
            </h3>

            <p>
              ${escapeHTML(item.category)}
              ·
              ${Number(item.price).toFixed(2)} AZN
            </p>

          </div>

          <button
            class="btn danger"
            onclick="removeProduct(${index})">

            Sil

          </button>

        </div>

      `;

    }
  ).join("");


  document.getElementById(
    "cartTotal"
  ).textContent =
  total.toFixed(2) + " AZN";


  document.getElementById(
    "cartTotalCount"
  ).textContent =
  cart.length;

}


/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  const productGrid =
  document.getElementById(
    "productGrid"
  );


  if(!productGrid){

    return;

  }


  productGrid.innerHTML = `

    <div class="empty"
         style="grid-column:1/-1">

      <div class="empty-icon">
        ⏳
      </div>

      <h3>
        Məhsullar yüklənir...
      </h3>

    </div>

  `;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("products")
    .select("*")
    .order("id",{ascending:false});


  if(error){

    console.error(
      "Supabase products error:",
      error
    );


    productGrid.innerHTML = `

      <div class="empty"
           style="grid-column:1/-1">

        <div class="empty-icon">
          ⚠️
        </div>

        <h3>
          Məhsullar yüklənmədi
        </h3>

        <p>
          Supabase bağlantısını və RLS qaydalarını yoxla.
        </p>

      </div>

    `;

    return;

  }


  if(!data || data.length === 0){

    productGrid.innerHTML = `

      <div class="empty"
           style="grid-column:1/-1">

        <div class="empty-icon">
          📦
        </div>

        <h3>
          Hələ məhsul yoxdur
        </h3>

        <p>
          İlk məhsulu əlavə et.
        </p>

      </div>

    `;

    return;

  }


  productGrid.innerHTML =
  data.map(
    product => {

      const id =
      product.id;

      const name =
      product.name || "Adsız məhsul";

      const description =
      product.description ||
      "Rəqəmsal məhsul";

      const price =
      Number(product.price || 0);

      const category =
      product.category ||
      "Digər";


      let icon = "📦";


      if(category === "Oyun"){
        icon = "🎮";
      }

      if(category === "Hesab"){
        icon = "👤";
      }

      if(category === "Proqram"){
        icon = "💻";
      }


      const image =
      product.image || "";


      const imageHTML =
      image
      ? `
        <img
          src="${escapeHTML(image)}"
          alt="${escapeHTML(name)}"
          style="
            width:100%;
            height:100%;
            object-fit:cover;
          "
        >
      `
      : icon;


      return `

        <div
          class="product"
          data-category="${escapeHTML(category)}"
          data-name="${escapeHTML(name)}">

          <div class="product-img">

            ${imageHTML}

          </div>


          <div class="product-body">

            <div class="category-label">

              ${escapeHTML(
                category.toUpperCase()
              )}

            </div>


            <h3>

              ${escapeHTML(name)}

            </h3>


            <p>

              ${escapeHTML(description)}

            </p>


            <div class="product-bottom">

              <div class="price">

                ${price.toFixed(2)} AZN

              </div>


              <button
                class="btn primary"
                onclick="addProduct(
                  '${String(id).replace(/'/g,"\\'")}',
                  '${String(name).replace(/'/g,"\\'")}',
                  ${price},
                  '${String(category).replace(/'/g,"\\'")}'
                )">

                Səbətə əlavə et

              </button>

            </div>

          </div>

        </div>

      `;

    }
  ).join("");

}


/* =========================
   NAVIGATION
========================= */

function showSection(id){

  document
    .querySelectorAll(".section")
    .forEach(
      section =>
      section.classList.remove("active")
    );


  const target =
  document.getElementById(id);


  if(target){

    target.classList.add("active");

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


/* =========================
   CATEGORY FILTER
========================= */

function filterCategory(category){

  showSection("home");


  const products =
  document.querySelectorAll(
    ".product"
  );


  products.forEach(
    product => {

      if(
        category === "all" ||
        product.dataset.category === category
      ){

        product.style.display =
        "block";

      }else{

        product.style.display =
        "none";

      }

    }
  );


  setTimeout(
    () => {

      document
        .getElementById("products")
        .scrollIntoView({
          behavior:"smooth"
        });

    },
    100
  );

}


/* =========================
   SEARCH
========================= */

function searchProducts(){

  const search =
  document
    .getElementById(
      "searchInput"
    )
    .value
    .toLowerCase()
    .trim();


  const products =
  document.querySelectorAll(
    ".product"
  );


  products.forEach(
    product => {

      const name =
      (
        product.dataset.name || ""
      ).toLowerCase();


      const category =
      (
        product.dataset.category || ""
      ).toLowerCase();


      if(
        name.includes(search) ||
        category.includes(search)
      ){

        product.style.display =
        "block";

      }else{

        product.style.display =
        "none";

      }

    }
  );

}


/* =========================
   SCROLL PRODUCTS
========================= */

function scrollProducts(){

  setTimeout(
    () => {

      document
        .getElementById("products")
        .scrollIntoView({
          behavior:"smooth"
        });

    },
    100
  );

}


/* =========================
   ADD SELLER PRODUCT
========================= */

async function addSellerProduct(event){

  event.preventDefault();


  const name =
  document
    .getElementById(
      "sellerProductName"
    )
    .value
    .trim();


  const category =
  document
    .getElementById(
      "sellerCategory"
    )
    .value;


  const price =
  Number(
    document
      .getElementById(
        "sellerPrice"
      )
      .value
  );


  const description =
  document
    .getElementById(
      "sellerDescription"
    )
    .value
    .trim();


  if(!name){

    alert(
      "Məhsul adını yaz."
    );

    return;

  }


  if(!price || price <= 0){

    alert(
      "Düzgün qiymət yaz."
    );

    return;

  }


  const {
    data: {
      user
    } = {},
    error:
    userError
  } =
  await supabaseClient
    .auth
    .getUser();


  if(userError || !user){

    alert(
      "Məhsul əlavə etmək üçün əvvəlcə giriş etməlisən."
    );

    window.location.href =
    "login.html";

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("products")
    .insert({

      name:name,

      description:
      description,

      price:price,

      category:category,

      image:null,

      seller_id:user.id

    });


  if(error){

    console.error(
      "Product insert error:",
      error
    );


    alert(
      "Məhsul əlavə olunmadı.\n\n" +
      error.message
    );

    return;

  }


  alert(
    "Məhsul uğurla əlavə edildi!"
  );


  event.target.reset();


  await loadProducts();

  showSection("home");


  setTimeout(
    () => {

      document
        .getElementById("products")
        .scrollIntoView({
          behavior:"smooth"
        });

    },
    150
  );

}


/* =========================
   SUPPORT
========================= */

function sendSupport(event){

  event.preventDefault();


  alert(
    "Mesajınız qəbul edildi. " +
    "Dəstək komandası sizinlə əlaqə saxlayacaq."
  );


  event.target.reset();

}


/* =========================
   CHECKOUT
========================= */

function checkout(){

  if(cart.length === 0){

    alert(
      "Səbətin boşdur."
    );

    return;

  }


  window.location.href =
  "login.html";

}


/* =========================
   START
========================= */

updateCart();

loadProducts();

</script>
