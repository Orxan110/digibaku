/* SEÇİLƏN MƏHSUL */

const params = new URLSearchParams(window.location.search);

let productKey = params.get("product") || "netflix";

if(!products[productKey]){
    productKey = "netflix";
}

const product = products[productKey];

let selectedPackage = 0;


/* MƏLUMATLAR */

document.title = "DigiBaku.com — " + product.name;

document.getElementById("productName").textContent =
product.name;

document.getElementById("breadcrumbName").textContent =
product.name;

document.getElementById("productImage").src =
product.image;

document.getElementById("productImage").alt =
product.name;

document.getElementById("shortDescription").textContent =
product.short;

document.getElementById("aboutTitle").textContent =
product.name + " haqqında";

document.getElementById("productContent").innerHTML =
product.content;


/* PAKETLƏR */

const packagesContainer =
document.getElementById("packages");

function renderPackages(){

    packagesContainer.innerHTML = "";

    product.packages.forEach((pkg,index)=>{

        const div = document.createElement("div");

        div.className =
        "package" + (index === selectedPackage ? " selected" : "");

        div.onclick = function(){

            selectedPackage = index;

            renderPackages();

            updatePrice();

        };

        div.innerHTML = `

            ${
                pkg.discount
                ?
                `<span class="discount">${pkg.discount}</span>`
                :
                ""
            }

            <strong>${pkg.name}</strong>

            <span class="package-price">
                ${pkg.price.toFixed(2)} AZN
            </span>

            <small>Premium paket</small>

        `;

        packagesContainer.appendChild(div);

    });

}


function updatePrice(){

    const pkg =
    product.packages[selectedPackage];

    document.getElementById("selectedPrice").textContent =
    pkg.price.toFixed(2) + " AZN";

    document.getElementById("selectedPeriod").textContent =
    pkg.name;

}


renderPackages();

updatePrice();


/* WHATSAPP */

function buyNow(){

    const pkg =
    product.packages[selectedPackage];

    const phone = "994702883484";

    const message =
    "Salam DigiBaku.com, mən sifariş vermək istəyirəm.%0A%0A" +
    "Məhsul: " + product.name +
    "%0A" +
    "Müddət: " + pkg.name +
    "%0A" +
    "Qiymət: " + pkg.price.toFixed(2) + " AZN";

    window.location.href =
    "https://wa.me/" + phone + "?text=" + message;

}


/* SƏBƏT */

function addToCart(){

    const pkg =
    product.packages[selectedPackage];

    const cartItem = {

        product:productKey,

        name:product.name,

        period:pkg.name,

        price:pkg.price

    };

    localStorage.setItem(
        "digibaku_cart",
        JSON.stringify(cartItem)
    );

    showToast();

}


function showToast(){

    const toast =
    document.getElementById("toast");

    toast.classList.add("show");

    setTimeout(()=>{

        toast.classList.remove("show");

    },2500);

}
