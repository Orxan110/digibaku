<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>DigiBaku — Məhsul İdarəetmə Paneli</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#05070b;
    color:#fff;
    min-height:100vh;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:94%;
    max-width:1400px;
    margin:auto;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(5,7,11,.96);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #20252f;
}

.header-inner{
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    color:#3b82f6;
    font-size:25px;
    font-weight:900;
}

.logo span{
    color:#fff;
}

.header-actions{
    display:flex;
    gap:8px;
}

.btn{
    border:0;
    border-radius:9px;
    padding:11px 16px;
    font-size:14px;
    font-weight:700;
    transition:.2s;
}

.btn-primary{
    background:#2563eb;
    color:#fff;
}

.btn-primary:hover{
    background:#1d4ed8;
}

.btn-dark{
    background:#12161d;
    color:#fff;
    border:1px solid #2a303a;
}

.btn-dark:hover{
    background:#1b2028;
}

.btn-danger{
    background:#3a1115;
    color:#ff7d86;
    border:1px solid #63242a;
}

.btn-danger:hover{
    background:#52151b;
}

/* MAIN */

main{
    padding:30px 0 70px;
}

.page-title{
    margin-bottom:25px;
}

.page-title h1{
    font-size:30px;
    margin-bottom:7px;
}

.page-title p{
    color:#8f98a8;
}

/* TOP ACTIONS */

.top-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:25px;
}

/* PRODUCT GRID */

.products-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.product-card{
    background:#0d1118;
    border:1px solid #242b36;
    border-radius:15px;
    overflow:hidden;
    transition:.2s;
}

.product-card:hover{
    border-color:#2563eb;
    transform:translateY(-2px);
}

.product-image{
    width:100%;
    height:180px;
    object-fit:cover;
    background:#080b10;
    display:block;
}

.product-body{
    padding:18px;
}

.product-body h3{
    font-size:20px;
    margin-bottom:8px;
}

.product-slug{
    color:#60a5fa;
    font-size:12px;
    margin-bottom:10px;
}

.product-desc{
    color:#9ca5b4;
    font-size:14px;
    line-height:1.55;
    min-height:45px;
}

.status{
    display:inline-flex;
    margin-top:14px;
    padding:5px 9px;
    border-radius:7px;
    font-size:11px;
    font-weight:700;
}

.status.active{
    background:#0c3020;
    color:#4ade80;
}

.status.passive{
    background:#32151a;
    color:#fb7185;
}

.card-actions{
    display:flex;
    gap:8px;
    margin-top:16px;
}

.card-actions button{
    flex:1;
}

/* EDITOR */

.editor{
    display:none;
    background:#0b0f15;
    border:1px solid #27303c;
    border-radius:16px;
    padding:24px;
    margin-bottom:25px;
}

.editor.show{
    display:block;
}

.editor-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.editor-head h2{
    font-size:23px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-size:13px;
    color:#aeb7c5;
    font-weight:700;
}

.field input,
.field textarea,
.field select{
    width:100%;
    background:#070a0f;
    border:1px solid #29313d;
    color:#fff;
    border-radius:9px;
    padding:12px;
    outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#2563eb;
}

.field textarea{
    min-height:120px;
    resize:vertical;
}

textarea.large{
    min-height:220px;
}

/* PRICE */

.price-section{
    margin-top:25px;
    border-top:1px solid #252c36;
    padding-top:22px;
}

.price-section h3{
    margin-bottom:15px;
}

.price-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.price-box{
    background:#080b10;
    border:1px solid #252c36;
    border-radius:10px;
    padding:14px;
}

.price-box h4{
    color:#60a5fa;
    margin-bottom:10px;
}

.price-box input{
    width:100%;
    margin-bottom:8px;
    background:#10151d;
    color:#fff;
    border:1px solid #29313d;
    border-radius:7px;
    padding:10px;
}

/* LISTS */

.dynamic-section{
    margin-top:25px;
    border-top:1px solid #252c36;
    padding-top:22px;
}

.dynamic-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.dynamic-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.dynamic-item{
    background:#080b10;
    border:1px solid #252c36;
    border-radius:10px;
    padding:14px;
}

.dynamic-item-grid{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:10px;
    align-items:start;
}

.dynamic-item textarea{
    min-height:90px;
}

.dynamic-item input,
.dynamic-item textarea{
    width:100%;
    background:#10151d;
    border:1px solid #29313d;
    color:#fff;
    border-radius:7px;
    padding:10px;
}

.remove-item{
    background:#351116;
    border:1px solid #64252d;
    color:#ff8b95;
    border-radius:7px;
    padding:9px 11px;
}

/* SAVE */

.editor-footer{
    margin-top:25px;
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

/* MESSAGE */

.message{
    display:none;
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:9999;
    padding:14px 18px;
    border-radius:10px;
    background:#101820;
    border:1px solid #293746;
    color:#fff;
    box-shadow:0 10px 40px rgba(0,0,0,.4);
}

.message.show{
    display:block;
}

.message.success{
    border-color:#166534;
}

.message.error{
    border-color:#7f1d1d;
}

/* EMPTY */

.empty{
    background:#0d1118;
    border:1px dashed #303846;
    border-radius:14px;
    padding:45px;
    text-align:center;
    color:#8f98a8;
}

/* RESPONSIVE */

@media(max-width:1050px){
    .products-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .price-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:700px){
    .container{
        width:92%;
    }

    .header-inner{
        min-height:62px;
    }

    .logo{
        font-size:21px;
    }

    .header-actions .btn{
        padding:9px 10px;
        font-size:12px;
    }

    .products-grid{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .price-grid{
        grid-template-columns:1fr;
    }

    .dynamic-item-grid{
        grid-template-columns:1fr;
    }

    .editor-head{
        align-items:flex-start;
        flex-direction:column;
    }

    .card-actions{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header>
<div class="container header-inner">

<div class="logo">
    DigiBaku<span>.com</span>
</div>

<div class="header-actions">
    <a href="index.html" class="btn btn-dark">Sayta bax</a>
    <button class="btn btn-primary" onclick="openNewProduct()">＋ Yeni məhsul</button>
    <button class="btn btn-dark" onclick="loadProducts()">↻ Yenilə</button>
</div>

</div>
</header>

<main>
<div class="container">

<div class="page-title">
    <h1>Sayt Məhsulları</h1>
    <p>
        Məhsulların saytda görünən bütün məlumatlarını bir yerdən idarə et.
    </p>
</div>

<div id="editor" class="editor">

<div class="editor-head">
    <h2 id="editorTitle">Yeni məhsul</h2>
    <button class="btn btn-dark" onclick="closeEditor()">✕ Bağla</button>
</div>

<input type="hidden" id="productId">

<div class="form-grid">

<div class="field">
<label>Məhsul adı</label>
<input id="name" placeholder="Məsələn: Netflix 4K Premium Azərbaycan Abunəliyi">
</div>

<div class="field">
<label>Slug / açar</label>
<input id="slug" placeholder="netflix">
</div>

<div class="field">
<label>Şəkil</label>
<input id="image" placeholder="netflix.webp">
</div>

<div class="field">
<label>Aktivlik</label>
<select id="active">
<option value="true">Aktiv</option>
<option value="false">Passiv</option>
</select>
</div>

<div class="field full">
<label>Saytda qısa açıqlama</label>
<textarea id="shortDescription"></textarea>
</div>

<div class="field full">
<label>Məhsul səhifəsinin tam açıqlaması</label>
<textarea id="fullDescription" class="large"></textarea>
</div>

<div class="field full">
<label>Məhsul səhifəsinin əsas başlığı</label>
<input id="pageTitle">
</div>

<div class="field full">
<label>Üstünlüklər / xüsusiyyətlər — hər sətir bir xüsusiyyət</label>
<textarea id="featuresText" class="large"></textarea>
</div>

</div>

<div class="price-section">

<h3>Qiymətlər</h3>

<div class="price-grid">

<div class="price-box">
<h4>1 AY</h4>
<input id="price1" type="number" step="0.01" placeholder="Normal qiymət">
<input id="sale1" type="number" step="0.01" placeholder="Endirim qiyməti">
</div>

<div class="price-box">
<h4>2 AY</h4>
<input id="price2" type="number" step="0.01" placeholder="Normal qiymət">
<input id="sale2" type="number" step="0.01" placeholder="Endirim qiyməti">
</div>

<div class="price-box">
<h4>3 AY</h4>
<input id="price3" type="number" step="0.01" placeholder="Normal qiymət">
<input id="sale3" type="number" step="0.01" placeholder="Endirim qiyməti">
</div>

<div class="price-box">
<h4>12 AY</h4>
<input id="price12" type="number" step="0.01" placeholder="Normal qiymət">
<input id="sale12" type="number" step="0.01" placeholder="Endirim qiyməti">
</div>

</div>
</div>

<div class="dynamic-section">

<div class="dynamic-head">
<h3>Məhsula aid FAQ</h3>
<button class="btn btn-dark" onclick="addFaq()">＋ FAQ əlavə et</button>
</div>

<div id="faqList" class="dynamic-list"></div>

</div>

<div class="dynamic-section">

<div class="dynamic-head">
<h3>Məhsul səhifəsində əlavə bölmələr</h3>
<button class="btn btn-dark" onclick="addSection()">＋ Bölmə əlavə et</button>
</div>

<div id="sectionList" class="dynamic-list"></div>

</div>

<div class="dynamic-section">

<div class="dynamic-head">
<h3>SEO</h3>
</div>

<div class="form-grid">

<div class="field full">
<label>SEO Title</label>
<input id="seoTitle">
</div>

<div class="field full">
<label>SEO Description</label>
<textarea id="seoDescription"></textarea>
</div>

</div>

</div>

<div class="editor-footer">

<button class="btn btn-dark" onclick="closeEditor()">
Ləğv et
</button>

<button class="btn btn-primary" onclick="saveProduct()">
💾 Yadda saxla
</button>

</div>

</div>

<div id="productsGrid" class="products-grid"></div>

</div>
</main>

<div id="message" class="message"></div>

<script>

const SUPABASE_URL =
"https://zeknhnkaicqkfzgnvycq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_jHvCp9fXBA_BwFqrXYpwlw_VC6C1OQk";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const ADMIN_EMAIL =
"zahidovorxan989@gmail.com";

let products = [];
let editingProduct = null;

/* =========================
   AUTH
========================= */

async function checkAdmin(){

    const {
        data:{session}
    } = await supabaseClient.auth.getSession();

    if(!session){

        window.location.href =
        "login.html";

        return false;
    }

    const email =
    (session.user.email || "").toLowerCase();

    if(email !== ADMIN_EMAIL.toLowerCase()){

        document.body.innerHTML = `
        <div style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        background:#05070b;
        color:white;
        font-family:Arial;
        text-align:center;
        padding:30px;
        ">
        <div>
        <h2>Giriş icazəsi yoxdur</h2>
        <p style="color:#999;margin-top:10px">
        Bu panel yalnız administrator üçündür.
        </p>
        </div>
        </div>
        `;

        return false;
    }

    return true;
}

/* =========================
   MESSAGE
========================= */

function showMessage(text,type="success"){

    const el =
    document.getElementById("message");

    el.textContent = text;

    el.className =
    "message show " + type;

    setTimeout(()=>{
        el.className = "message";
    },3000);
}

/* =========================
   HELPERS
========================= */

function esc(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function safeJson(value){

    if(!value || typeof value !== "object")
        return {};

    return value;
}

/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

    const grid =
    document.getElementById("productsGrid");

    grid.innerHTML = `
        <div class="empty">
            Məhsullar yüklənir...
        </div>
    `;

    const {
        data,
        error
    } =
    await supabaseClient
    .from("site_products")
    .select("*")
    .order("sort_order",{ascending:true})
    .order("created_at",{ascending:true});

    if(error){

        console.error(error);

        grid.innerHTML = `
        <div class="empty">
            Məhsullar yüklənmədi.<br><br>
            ${esc(error.message)}
        </div>
        `;

        return;
    }

    products = data || [];

    renderProducts();
}

/* =========================
   RENDER
========================= */

function renderProducts(){

    const grid =
    document.getElementById("productsGrid");

    if(!products.length){

        grid.innerHTML = `
        <div class="empty">
            Hələ məhsul yoxdur.<br><br>
            "＋ Yeni məhsul" düyməsi ilə məhsul əlavə edə bilərsən.
        </div>
        `;

        return;
    }

    grid.innerHTML =
    products.map(product => {

        const content =
        safeJson(product.content);

        const shortDescription =
        content.shortDescription ||
        product.description ||
        "";

        return `
        <div class="product-card">

            <img
                class="product-image"
                src="${esc(product.image || "")}"
                onerror="this.style.display='none'"
                alt="${esc(product.name || "")}"
            >

            <div class="product-body">

                <h3>
                    ${esc(product.name || "Adsız məhsul")}
                </h3>

                <div class="product-slug">
                    ${esc(product.slug || "")}
                </div>

                <div class="product-desc">
                    ${esc(shortDescription)}
                </div>

                <div class="status ${
                    product.active === false
                    ? "passive"
                    : "active"
                }">
                    ${
                        product.active === false
                        ? "PASSİV"
                        : "AKTİV"
                    }
                </div>

                <div class="card-actions">

                    <button
                        class="btn btn-primary"
                        onclick="editProduct('${product.id}')"
                    >
                        Redaktə
                    </button>

                    <button
                        class="btn btn-danger"
                        onclick="deleteProduct('${product.id}')"
                    >
                        Sil
                    </button>

                </div>

            </div>

        </div>
        `;

    }).join("");
}

/* =========================
   NEW
========================= */

function openNewProduct(){

    editingProduct = null;

    document.getElementById("editorTitle")
    .textContent = "Yeni məhsul";

    document.getElementById("productId")
    .value = "";

    clearEditor();

    document.getElementById("editor")
    .classList.add("show");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function clearEditor(){

    [
        "name",
        "slug",
        "image",
        "shortDescription",
        "fullDescription",
        "pageTitle",
        "featuresText",
        "seoTitle",
        "seoDescription",
        "price1",
        "sale1",
        "price2",
        "sale2",
        "price3",
        "sale3",
        "price12",
        "sale12"
    ].forEach(id=>{
        const el =
        document.getElementById(id);

        if(el) el.value = "";
    });

    document.getElementById("active")
    .value = "true";

    document.getElementById("faqList")
    .innerHTML = "";

    document.getElementById("sectionList")
    .innerHTML = "";
}

/* =========================
   EDIT
========================= */

function editProduct(id){

    const product =
    products.find(p => String(p.id) === String(id));

    if(!product)
        return;

    editingProduct = product;

    const content =
    safeJson(product.content);

    document.getElementById("editorTitle")
    .textContent =
    "Redaktə: " + (product.name || "");

    document.getElementById("productId")
    .value = product.id || "";

    document.getElementById("name")
    .value = product.name || "";

    document.getElementById("slug")
    .value = product.slug || "";

    document.getElementById("image")
    .value = product.image || "";

    document.getElementById("active")
    .value =
    product.active === false
    ? "false"
    : "true";

    document.getElementById("shortDescription")
    .value =
    content.shortDescription ||
    product.description ||
    "";

    document.getElementById("fullDescription")
    .value =
    content.fullDescription || "";

    document.getElementById("pageTitle")
    .value =
    content.pageTitle || "";

    document.getElementById("featuresText")
    .value =
    Array.isArray(content.features)
    ? content.features.join("\n")
    : "";

    document.getElementById("price1")
    .value =
    content.prices?.["1"]?.normal ?? "";

    document.getElementById("sale1")
    .value =
    content.prices?.["1"]?.sale ?? "";

    document.getElementById("price2")
    .value =
    content.prices?.["2"]?.normal ?? "";

    document.getElementById("sale2")
    .value =
    content.prices?.["2"]?.sale ?? "";

    document.getElementById("price3")
    .value =
    content.prices?.["3"]?.normal ?? "";

    document.getElementById("sale3")
    .value =
    content.prices?.["3"]?.sale ?? "";

    document.getElementById("price12")
    .value =
    content.prices?.["12"]?.normal ?? "";

    document.getElementById("sale12")
    .value =
    content.prices?.["12"]?.sale ?? "";

    document.getElementById("seoTitle")
    .value =
    content.seo?.title || "";

    document.getElementById("seoDescription")
    .value =
    content.seo?.description || "";

    document.getElementById("faqList")
    .innerHTML = "";

    const faqs =
    Array.isArray(content.faq)
    ? content.faq
    : [];

    faqs.forEach(item=>{
        addFaq(
            item.question || "",
            item.answer || ""
        );
    });

    document.getElementById("sectionList")
    .innerHTML = "";

    const sections =
    Array.isArray(content.sections)
    ? content.sections
    : [];

    sections.forEach(item=>{
        addSection(
            item.title || "",
            item.text || ""
        );
    });

    document.getElementById("editor")
    .classList.add("show");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

/* =========================
   FAQ
========================= */

function addFaq(question="",answer=""){

    const list =
    document.getElementById("faqList");

    const div =
    document.createElement("div");

    div.className = "dynamic-item";

    div.innerHTML = `
        <div class="dynamic-item-grid">

            <input
                class="faq-question-input"
                placeholder="Sual"
                value="${esc(question)}"
            >

            <textarea
                class="faq-answer-input"
                placeholder="Cavab"
            >${esc(answer)}</textarea>

            <button
                class="remove-item"
                onclick="this.closest('.dynamic-item').remove()"
            >
                Sil
            </button>

        </div>
    `;

    list.appendChild(div);
}

/* =========================
   SECTIONS
========================= */

function addSection(title="",text=""){

    const list =
    document.getElementById("sectionList");

    const div =
    document.createElement("div");

    div.className = "dynamic-item";

    div.innerHTML = `
        <div class="dynamic-item-grid">

            <input
                class="section-title-input"
                placeholder="Bölmənin adı"
                value="${esc(title)}"
            >

            <textarea
                class="section-text-input"
                placeholder="Bölmə mətni"
            >${esc(text)}</textarea>

            <button
                class="remove-item"
                onclick="this.closest('.dynamic-item').remove()"
            >
                Sil
            </button>

        </div>
    `;

    list.appendChild(div);
}

/* =========================
   COLLECT FAQ
========================= */

function collectFaq(){

    return [...document.querySelectorAll("#faqList .dynamic-item")]
    .map(item=>({

        question:
        item.querySelector(".faq-question-input")?.value.trim() || "",

        answer:
        item.querySelector(".faq-answer-input")?.value.trim() || ""

    }))
    .filter(item =>
        item.question ||
        item.answer
    );
}

/* =========================
   COLLECT SECTIONS
========================= */

function collectSections(){

    return [...document.querySelectorAll("#sectionList .dynamic-item")]
    .map(item=>({

        title:
        item.querySelector(".section-title-input")?.value.trim() || "",

        text:
        item.querySelector(".section-text-input")?.value.trim() || ""

    }))
    .filter(item =>
        item.title ||
        item.text
    );
}

/* =========================
   SAVE
========================= */

async function saveProduct(){

    const name =
    document.getElementById("name")
    .value.trim();

    const slug =
    document.getElementById("slug")
    .value.trim();

    if(!name){

        showMessage(
            "Məhsul adı yazılmalıdır.",
            "error"
        );

        return;
    }

    if(!slug){

        showMessage(
            "Slug yazılmalıdır.",
            "error"
        );

        return;
    }

    const features =
    document.getElementById("featuresText")
    .value
    .split("\n")
    .map(x=>x.trim())
    .filter(Boolean);

    const content = {

        shortDescription:
        document.getElementById("shortDescription")
        .value.trim(),

        fullDescription:
        document.getElementById("fullDescription")
        .value.trim(),

        pageTitle:
        document.getElementById("pageTitle")
        .value.trim(),

        features,

        prices:{

            "1":{
                normal:
                numberOrNull("price1"),
                sale:
                numberOrNull("sale1")
            },

            "2":{
                normal:
                numberOrNull("price2"),
                sale:
                numberOrNull("sale2")
            },

            "3":{
                normal:
                numberOrNull("price3"),
                sale:
                numberOrNull("sale3")
            },

            "12":{
                normal:
                numberOrNull("price12"),
                sale:
                numberOrNull("sale12")
            }

        },

        faq:
        collectFaq(),

        sections:
        collectSections(),

        seo:{
            title:
            document.getElementById("seoTitle")
            .value.trim(),

            description:
            document.getElementById("seoDescription")
            .value.trim()
        }

    };

    const payload = {

        name,

        slug,

        image:
        document.getElementById("image")
        .value.trim(),

        description:
        content.shortDescription,

        content,

        active:
        document.getElementById("active")
        .value === "true"

    };

    const id =
    document.getElementById("productId")
    .value;

    let result;

    if(id){

        result =
        await supabaseClient
        .from("site_products")
        .update(payload)
        .eq("id",id);

    }else{

        const maxSort =
        products.length
        ? Math.max(
            ...products.map(p =>
                Number(p.sort_order || 0)
            )
        ) + 1
        : 1;

        payload.sort_order = maxSort;

        result =
        await supabaseClient
        .from("site_products")
        .insert(payload);
    }

    if(result.error){

        console.error(result.error);

        showMessage(
            result.error.message,
            "error"
        );

        return;
    }

    showMessage(
        "Məhsul yadda saxlanıldı."
    );

    closeEditor();

    await loadProducts();
}

/* =========================
   NUMBER
========================= */

function numberOrNull(id){

    const value =
    document.getElementById(id)
    .value.trim();

    if(value === "")
        return null;

    const n =
    Number(value);

    return Number.isFinite(n)
    ? n
    : null;
}

/* =========================
   DELETE
========================= */

async function deleteProduct(id){

    const product =
    products.find(p =>
        String(p.id) === String(id)
    );

    if(!product)
        return;

    const ok =
    confirm(
        `"${product.name}" məhsulunu tam silmək istəyirsən?`
    );

    if(!ok)
        return;

    const {
        error
    } =
    await supabaseClient
    .from("site_products")
    .delete()
    .eq("id",id);

    if(error){

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

        return;
    }

    showMessage(
        "Məhsul silindi."
    );

    await loadProducts();
}

/* =========================
   CLOSE
========================= */

function closeEditor(){

    document.getElementById("editor")
    .classList.remove("show");

    editingProduct = null;
}

/* =========================
   LOGOUT
========================= */

async function logout(){

    await supabaseClient.auth.signOut();

    window.location.href =
    "login.html";
}

/* =========================
   START
========================= */

document.addEventListener(
"DOMContentLoaded",
async ()=>{

    const ok =
    await checkAdmin();

    if(!ok)
        return;

    await loadProducts();

});
</script>
