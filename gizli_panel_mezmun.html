<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DigiBaku — Gizli Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#07111f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    background:#0b1728;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.header-inner{
    max-width:1250px;
    margin:auto;
    padding:14px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:21px;
    font-weight:800;
    color:#25a7ff;
}

.logo span{
    color:#fff;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.admin-email{
    color:#94a9bf;
    font-size:13px;
}

.logout{
    border:0;
    background:#e53935;
    color:#fff;
    padding:9px 14px;
    border-radius:9px;
    font-weight:700;
}

.container{
    width:min(1250px,calc(100% - 30px));
    margin:28px auto 70px;
}

.page-title{
    font-size:29px;
    margin-bottom:7px;
}

.page-subtitle{
    color:#91a5bb;
    margin-bottom:25px;
    line-height:1.6;
}

.message{
    display:none;
    padding:13px 15px;
    border-radius:10px;
    margin-bottom:18px;
    font-weight:700;
}

.message.success{
    display:block;
    background:rgba(0,210,130,.10);
    border:1px solid rgba(0,210,130,.35);
    color:#54e3a0;
}

.message.error{
    display:block;
    background:rgba(255,70,70,.10);
    border:1px solid rgba(255,70,70,.35);
    color:#ff8585;
}

.products{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
}

.product-card{
    background:#0d1b2d;
    border:1px solid rgba(255,255,255,.08);
    border-radius:17px;
    overflow:hidden;
}

.product-top{
    padding:17px 18px;
    background:#0b1829;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;

    border-bottom:1px solid rgba(255,255,255,.07);
}

.product-title{
    font-size:19px;
    font-weight:800;
}

.product-key{
    color:#6d849e;
    font-size:12px;
    margin-top:4px;
}

.status{
    border:0;
    border-radius:20px;
    padding:7px 12px;
    font-size:12px;
    font-weight:800;
    white-space:nowrap;
}

.status.active{
    background:rgba(0,210,130,.12);
    color:#54e3a0;
}

.status.off{
    background:rgba(255,70,70,.12);
    color:#ff8585;
}

.body{
    padding:18px;
}

.section{
    margin-bottom:22px;
}

.section:last-child{
    margin-bottom:0;
}

.section-title{
    color:#25a7ff;
    font-size:13px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:10px;
}

label{
    display:block;
    color:#9db0c4;
    font-size:12px;
    margin-bottom:6px;
}

input,
textarea{
    width:100%;
    background:#081522;
    color:#fff;
    border:1px solid #24394f;
    border-radius:9px;
    outline:none;
    padding:11px 12px;
}

input:focus,
textarea:focus{
    border-color:#1597ed;
}

textarea{
    min-height:85px;
    resize:vertical;
}

.grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.grid-3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.price-box{
    background:#081522;
    border:1px solid #1d3045;
    border-radius:12px;
    padding:13px;
}

.price-title{
    font-size:14px;
    font-weight:800;
    margin-bottom:10px;
}

.price-box input{
    margin-bottom:8px;
}

.switch-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:8px;
}

.switch{
    position:relative;
    display:block;
    width:43px;
    height:23px;
    margin:0;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;
    border-radius:20px;
    background:#263a50;
    transition:.2s;
}

.slider:before{
    content:"";
    position:absolute;
    width:17px;
    height:17px;
    left:3px;
    top:3px;
    border-radius:50%;
    background:#fff;
    transition:.2s;
}

.switch input:checked + .slider{
    background:#1597ed;
}

.switch input:checked + .slider:before{
    transform:translateX(20px);
}

.actions{
    padding:15px 18px;
    background:#0a1625;
    border-top:1px solid rgba(255,255,255,.07);

    display:flex;
    gap:10px;
}

.save{
    flex:1;
    border:0;
    border-radius:10px;
    padding:12px;
    background:#1597ed;
    color:#fff;
    font-weight:800;
}

.save:hover{
    background:#087fce;
}

.reload{
    border:1px solid #30465e;
    background:transparent;
    color:#b7c6d7;
    border-radius:10px;
    padding:12px 15px;
}

.loading{
    grid-column:1/-1;
    text-align:center;
    padding:50px;
    color:#8fa3ba;
}

@media(max-width:850px){

    .products{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    .header-inner{
        padding:12px;
        align-items:flex-start;
        flex-direction:column;
    }

    .header-right{
        width:100%;
        justify-content:space-between;
    }

    .admin-email{
        max-width:70%;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
    }

    .container{
        width:calc(100% - 20px);
        margin-top:18px;
    }

    .page-title{
        font-size:25px;
    }

    .grid-2,
    .grid-3{
        grid-template-columns:1fr;
    }

    .product-top{
        align-items:flex-start;
    }

    .product-title{
        font-size:17px;
    }

}
</style>
</head>

function showMessage(text,type="success"){

    messageEl.textContent = text;

    messageEl.className =
        "message " + type;

    setTimeout(()=>{

        messageEl.className =
            "message";

    },4000);
}


function esc(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function num(value){

    const n =
        Number(value);

    return Number.isFinite(n)
        ? n
        : 0;
}


function money(value){

    return num(value).toFixed(2);
}


function getPrice(productKey){

    const found =
        pricesData.find(
            item =>
                item.product_key === productKey
        );

    if(found){
        return found;
    }

    return {

        product_key:productKey,

        price_1_month:0,
        price_2_month:0,
        price_3_month:0,

        sale_1_active:false,
        sale_2_active:false,
        sale_3_active:false,

        sale_1_price:0,
        sale_2_price:0,
        sale_3_price:0,

        price_12_month:0,
        sale_12_price:0,
        sale_12_active:false
    };
}

        <div class="switch-row">

                Endirim aktivdir
            </span>

            <label class="switch">

                <input
                    type="checkbox"

        </div>

        <div style="margin-top:10px">

function renderProducts(){

    if(!productsData.length){

        productsEl.innerHTML = `
            <div class="loading">
                Məhsul tapılmadı.
            </div>
        `;

        return;
    }

    productsData.sort(
        (a,b)=>
            num(a.sort_order) -
            num(b.sort_order)
    );

    productsEl.innerHTML =
        productsData
        .map(createProductCard)
        .join("");
}


async function loadProducts(){

    productsEl.innerHTML = `
        <div class="loading">
            Məhsullar yüklənir...
        </div>
    `;


    const productsResult =
        await supabaseClient
        .from("products")
        .select("*")
        .order(
            "sort_order",
            {
                ascending:true
            }
        );


    if(productsResult.error){

        console.error(
            productsResult.error
        );

        productsEl.innerHTML = `
            <div class="loading">

                <b>products cədvəlində xəta:</b>

                <br><br>

                ${esc(
                    productsResult.error.message
                )}

            </div>
        `;

        return;
    }


    const pricesResult =
        await supabaseClient
        .from("product_prices")
        .select("*");


    if(pricesResult.error){

        console.error(
            pricesResult.error
        );

        showMessage(
            "Qiymətlər oxunmadı: " +
            pricesResult.error.message,
            "error"
        );

    }


    productsData =
        productsResult.data || [];

    pricesData =
        pricesResult.data || [];


    renderProducts();
}


function getCard(productKey){

    return document.querySelector(
        `.product-card[data-key="${CSS.escape(productKey)}"]`
    );
}


function collectProduct(card){

    const data = {};

    card
    .querySelectorAll("[data-field]")
    .forEach(el=>{

        const field =
            el.dataset.field;

        if(
            field === "sort_order"
        ){

            data[field] =
                parseInt(
                    el.value || "0",
                    10
                );

        }else{

            data[field] =
                el.value;

        }

    });

    return data;
}


function collectPrices(card){

    const data = {};

    card
    .querySelectorAll("[data-price]")
    .forEach(el=>{

        data[
            el.dataset.price
        ] =
            parseFloat(
                el.value || "0"
            );

    });


    card
    .querySelectorAll(
        "[data-price-toggle]"
    )
    .forEach(el=>{

        data[
            el.dataset.priceToggle
        ] =
            el.checked;

    });


    return data;
}


async function saveProduct(productKey){

    const card =
        getCard(productKey);

    if(!card){
        return;
    }


    const productFields =
        collectProduct(card);

    const priceFields =
        collectPrices(card);


    const productResult =
        await supabaseClient
        .from("products")
        .update({

            ...productFields,

            updated_at:
                new Date().toISOString()

        })
        .eq(
            "product_key",
            productKey
        );


    if(productResult.error){

        console.error(
            productResult.error
        );

        showMessage(
            "Məhsul yadda saxlanmadı: " +
            productResult.error.message,
            "error"
        );

        return;
    }


    const exists =
        pricesData.some(
            x =>
                x.product_key ===
                productKey
        );


    let priceResult;


    if(exists){

        priceResult =
            await supabaseClient
            .from("product_prices")
            .update(
                priceFields
            )
            .eq(
                "product_key",
                productKey
            );

    }else{

        priceResult =
            await supabaseClient
            .from("product_prices")
            .insert({

                product_key:
                    productKey,

                product_name:
                    productFields.name_az,

                ...priceFields

            });

    }


    if(priceResult.error){

        console.error(
            priceResult.error
        );

        showMessage(
            "Məhsul yadda saxlandı, amma qiymətlər yadda saxlanmadı: " +
            priceResult.error.message,
            "error"
        );

        return;
    }


    showMessage(
        productFields.name_az +
        " uğurla yadda saxlanıldı."
    );


    await loadProducts();
}


async function toggleActive(productKey){

    const product =
        productsData.find(
            x =>
                x.product_key ===
                productKey
        );


    if(!product){
        return;
    }


    const result =
        await supabaseClient
        .from("products")
        .update({

            active:
                !product.active,

            updated_at:
                new Date().toISOString()

        })
        .eq(
            "product_key",
            productKey
        );


    if(result.error){

        showMessage(
            "Status dəyişmədi: " +
            result.error.message,
            "error"
        );

        return;
    }


    await loadProducts();
}


async function checkAdmin(){

    const {
        data,
        error
    } =
        await supabaseClient
        .auth
        .getSession();


    if(
        error ||
        !data.session
    ){

        window.location.href =
            "login.html";

        return false;
    }


    const email =
        data.session.user.email;


    if(
        !email ||
        email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ){

        await supabaseClient
            .auth
            .signOut();


        alert(
            "Bu panelə giriş icazəniz yoxdur."
        );


        window.location.href =
            "login.html";


        return false;
    }


    adminEmailEl.textContent =
        email;


    return true;
}


document
.getElementById("logoutBtn")
.addEventListener(
    "click",
    async()=>{

        await supabaseClient
