<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DigiBaku — Məhsul İdarəetmə</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top left,rgba(0,110,255,.14),transparent 30%),
        #05070b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.header{
    height:70px;
    padding:0 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #18202d;
    background:rgba(5,7,11,.94);
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(15px);
}

.logo{
    font-size:21px;
    font-weight:800;
    color:#fff;
}

.logo span{
    color:#1683ff;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-btn{
    border:1px solid #263246;
    background:#0d131d;
    color:#cbd5e1;
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
}

.header-btn:hover{
    border-color:#1683ff;
    color:#fff;
}

.container{
    width:min(1250px,calc(100% - 30px));
    margin:30px auto 60px;
}

.top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:25px;
}

.top h1{
    font-size:30px;
    margin-bottom:7px;
}

.top p{
    color:#8995a8;
    font-size:14px;
}

.top-actions{
    display:flex;
    gap:10px;
}

.primary-btn{
    border:0;
    background:linear-gradient(135deg,#087cff,#0054c7);
    color:#fff;
    padding:12px 18px;
    border-radius:11px;
    font-weight:700;
    box-shadow:0 8px 25px rgba(0,112,255,.22);
}

.primary-btn:hover{
    filter:brightness(1.08);
}

.secondary-btn{
    border:1px solid #273348;
    background:#0c121b;
    color:#d7dfeb;
    padding:12px 17px;
    border-radius:11px;
    font-weight:600;
}

.notice{
    display:none;
    margin-bottom:20px;
    padding:13px 15px;
    border-radius:10px;
    font-size:14px;
}

.notice.success{
    display:block;
    background:#062b19;
    border:1px solid #0b6d3e;
    color:#7df0b3;
}

.notice.error{
    display:block;
    background:#300d12;
    border:1px solid #7c1d2b;
    color:#ff9aa7;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:25px;
}

.stat{
    background:#090e16;
    border:1px solid #182333;
    border-radius:14px;
    padding:18px;
}

.stat-title{
    color:#748196;
    font-size:12px;
    margin-bottom:7px;
}

.stat-value{
    font-size:25px;
    font-weight:800;
}

.products-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:13px;
}

.products-header h2{
    font-size:20px;
}

.products-header span{
    color:#718096;
    font-size:13px;
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.product-card{
    background:linear-gradient(180deg,#0a1019,#080c13);
    border:1px solid #192536;
    border-radius:16px;
    overflow:hidden;
    transition:.2s;
}

.product-card:hover{
    border-color:#28527f;
    transform:translateY(-2px);
}

.product-image{
    height:150px;
    background:#05080d;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid #172231;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.no-image{
    color:#506078;
    font-size:13px;
}

.product-body{
    padding:16px;
}

.product-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.product-name{
    font-size:17px;
    font-weight:750;
    line-height:1.3;
}

.badge{
    flex-shrink:0;
    padding:5px 8px;
    border-radius:7px;
    font-size:10px;
    font-weight:800;
}

.badge.active{
    background:#073b25;
    color:#6ff0ad;
    border:1px solid #0d6842;
}

.badge.inactive{
    background:#32150b;
    color:#ffae7b;
    border:1px solid #753116;
}

.slug{
    color:#64748b;
    font-size:12px;
    margin-top:7px;
}

.description{
    color:#94a0b2;
    font-size:13px;
    line-height:1.5;
    margin-top:12px;
    min-height:40px;
}

.price-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:13px;
}

.price{
    padding:7px 9px;
    background:#0d1520;
    border:1px solid #1c2a3d;
    border-radius:8px;
    color:#dce6f3;
    font-size:12px;
}

.card-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:15px;
}

.edit-btn,
.delete-btn{
    padding:10px;
    border-radius:9px;
    font-weight:700;
    font-size:12px;
}

.edit-btn{
    background:#0d5fd0;
    border:1px solid #1678ff;
    color:#fff;
}

.delete-btn{
    background:#250c11;
    border:1px solid #68202b;
    color:#ff8795;
}

.empty{
    padding:50px 20px;
    text-align:center;
    border:1px dashed #253246;
    border-radius:15px;
    color:#65748a;
}

/* FORM */

.form-wrap{
    display:none;
    background:#080e17;
    border:1px solid #1a2a3e;
    border-radius:17px;
    padding:22px;
    margin-bottom:25px;
}

.form-wrap.show{
    display:block;
}

.form-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.form-title h2{
    font-size:21px;
}

.close-form{
    background:#111925;
    border:1px solid #273548;
    color:#aeb9c8;
    width:36px;
    height:36px;
    border-radius:9px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.full{
    grid-column:1/-1;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field label{
    color:#aeb9c8;
    font-size:12px;
    font-weight:700;
}

.field input,
.field textarea,
.field select{
    width:100%;
    background:#050a11;
    border:1px solid #223148;
    color:#fff;
    border-radius:9px;
    padding:11px 12px;
    outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#167cff;
    box-shadow:0 0 0 3px rgba(22,124,255,.08);
}

.field textarea{
    min-height:100px;
    resize:vertical;
}

.price-section{
    grid-column:1/-1;
    border:1px solid #1a2a3c;
    background:#060b12;
    border-radius:13px;
    padding:16px;
}

.price-section-title{
    font-size:14px;
    font-weight:800;
    margin-bottom:13px;
}

.price-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.price-box{
    background:#0a111b;
    border:1px solid #1b2a3c;
    padding:12px;
    border-radius:10px;
}

.price-box-title{
    color:#7e8ca0;
    font-size:11px;
    font-weight:700;
    margin-bottom:8px;
}

.price-box input{
    margin-bottom:7px;
}

.checkbox{
    display:flex;
    align-items:center;
    gap:9px;
    color:#b7c2d1;
    font-size:13px;
}

.checkbox input{
    width:17px;
    height:17px;
}

.form-actions{
    grid-column:1/-1;
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:5px;
}

.save-btn{
    background:linear-gradient(135deg,#087cff,#0054c7);
    border:0;
    color:#fff;
    padding:12px 22px;
    border-radius:10px;
    font-weight:800;
}

.cancel-btn{
    background:#101722;
    border:1px solid #273448;
    color:#b7c2d1;
    padding:12px 20px;
    border-radius:10px;
}

.loading{
    text-align:center;
    padding:50px;
    color:#738197;
}

@media(max-width:950px){
    .products-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .price-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:650px){
    .header{
        padding:0 15px;
    }

    .header-right .header-btn:first-child{
        display:none;
    }

    .container{
        width:min(100% - 20px,1250px);
        margin-top:20px;
    }

    .top{
        align-items:stretch;
        flex-direction:column;
    }

    .top-actions{
        width:100%;
    }

    .top-actions button{
        flex:1;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .products-grid{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .price-grid{
        grid-template-columns:1fr 1fr;
    }

    .full,
    .price-section,
    .form-actions{
        grid-column:auto;
    }

    .form-actions{
        display:grid;
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:400px){
    .price-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">DigiBaku<span>.com</span></div>

    <div class="header-right">
        <button class="header-btn" onclick="goAdmin()">← Gizli panel</button>
        <button class="header-btn" onclick="logout()">Çıxış</button>
    </div>
</header>

<main class="container">

    <div class="top">
        <div>
            <h1>Sayt Məhsulları</h1>
            <p>Bütün məhsulların mərkəzi idarəetmə sistemi.</p>
        </div>

        <div class="top-actions">
            <button class="secondary-btn" onclick="loadProducts()">↻ Yenilə</button>
            <button class="primary-btn" onclick="openNewProduct()">＋ Yeni məhsul</button>
        </div>
    </div>

    <div id="notice" class="notice"></div>

    <div class="stats">
        <div class="stat">
            <div class="stat-title">ÜMUMİ MƏHSUL</div>
            <div class="stat-value" id="totalProducts">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">AKTİV</div>
            <div class="stat-value" id="activeProducts">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">DEAKTİV</div>
            <div class="stat-value" id="inactiveProducts">0</div>
        </div>
    </div>

    <!-- FORM -->

    <section id="formWrap" class="form-wrap">

        <div class="form-title">
            <h2 id="formTitle">Yeni məhsul</h2>
            <button class="close-form" onclick="closeForm()">×</button>
        </div>

        <form id="productForm">

            <input type="hidden" id="editId">

            <div class="form-grid">

                <div class="field">
                    <label>Məhsul adı</label>
                    <input
                        id="name"
                        type="text"
                        placeholder="Netflix 4K Premium Azərbaycan Abunəliyi"
                        required
                    >
                </div>

                <div class="field">
                    <label>Slug</label>
                    <input
                        id="slug"
                        type="text"
                        placeholder="netflix"
                        required
                    >
                </div>

                <div class="field full">
                    <label>Şəkil yolu / URL</label>
                    <input
                        id="image"
                        type="text"
                        placeholder="netflix.webp"
                    >
                </div>

                <div class="field">
                    <label>Əsas müddət</label>
                    <select id="duration">
                        <option value="1 ay">1 ay</option>
                        <option value="2 ay">2 ay</option>
                        <option value="3 ay">3 ay</option>
                        <option value="12 ay">12 ay</option>
                    </select>
                </div>

                <div class="field">
                    <label>Aktivlik</label>

                    <label class="checkbox" style="margin-top:8px;">
                        <input id="active" type="checkbox" checked>
                        Məhsul saytda aktiv görünsün
                    </label>
                </div>

                <div class="field full">
                    <label>Məhsul açıqlaması</label>
                    <textarea
                        id="description"
                        placeholder="Məhsul haqqında məlumat..."
                    ></textarea>
                </div>

                <!-- QİYMƏTLƏR -->

                <div class="price-section">

                    <div class="price-section-title">
                        Məhsul qiymətləri
                    </div>

                    <div class="price-grid">

                        <div class="price-box">
                            <div class="price-box-title">1 AY</div>

                            <input
                                id="price1Normal"
                                type="number"
                                step="0.01"
                                placeholder="Normal"
                            >

                            <input
                                id="price1Sale"
                                type="number"
                                step="0.01"
                                placeholder="Endirimli"
                            >
                        </div>

                        <div class="price-box">
                            <div class="price-box-title">2 AY</div>

                            <input
                                id="price2Normal"
                                type="number"
                                step="0.01"
                                placeholder="Normal"
                            >

                            <input
                                id="price2Sale"
                                type="number"
                                step="0.01"
                                placeholder="Endirimli"
                            >
                        </div>

                        <div class="price-box">
                            <div class="price-box-title">3 AY</div>

                            <input
                                id="price3Normal"
                                type="number"
                                step="0.01"
                                placeholder="Normal"
                            >

                            <input
                                id="price3Sale"
                                type="number"
                                step="0.01"
                                placeholder="Endirimli"
                            >
                        </div>

                        <div class="price-box">
                            <div class="price-box-title">12 AY</div>

                            <input
                                id="price12Normal"
                                type="number"
                                step="0.01"
                                placeholder="Normal"
                            >

                            <input
                                id="price12Sale"
                                type="number"
                                step="0.01"
                                placeholder="Endirimli"
                            >
                        </div>

                    </div>
                </div>

                <!-- FAQ -->

                <div class="field">
                    <label>FAQ sualı</label>
                    <input
                        id="faqQuestion"
                        type="text"
                        placeholder="Netflix nədir?"
                    >
                </div>

                <div class="field">
                    <label>FAQ cavabı</label>
                    <textarea
                        id="faqAnswer"
                        placeholder="FAQ cavabı..."
                    ></textarea>
                </div>

                <!-- SEO -->

                <div class="field">
                    <label>SEO Title</label>
                    <input
                        id="seoTitle"
                        type="text"
                        placeholder="Netflix 4K Premium Azərbaycan Abunəliyi | DigiBaku"
                    >
                </div>

                <div class="field">
                    <label>SEO Description</label>
                    <textarea
                        id="seoDescription"
                        placeholder="Google üçün məhsul açıqlaması..."
                    ></textarea>
                </div>

                <div class="form-actions">
                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="closeForm()"
                    >
                        Ləğv et
                    </button>

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Yadda saxla
                    </button>
                </div>

            </div>

        </form>
    </section>

    <!-- PRODUCTS -->

    <div class="products-header">
        <h2>Məhsullar</h2>
        <span id="productCountText">0 məhsul</span>
    </div>

    <div id="productsContainer" class="products-grid">
        <div class="loading">Məhsullar yüklənir...</div>
    </div>

</main>

/* =========================================================
   AUTH
   ========================================================= */

async function checkAdmin(){

    const {
        data:{session}
    } = await supabaseClient.auth.getSession();

    if(
        !session ||
        !session.user ||
        session.user.email !== ADMIN_EMAIL
    ){

        window.location.href = "login.html";
        return false;
    }

    return true;
}


/* =========================================================
   NOTICE
   ========================================================= */

function showNotice(message,type="success"){

    const box =
        document.getElementById("notice");

    box.className =
        "notice " + type;

    box.textContent =
        message;

    setTimeout(()=>{
        box.className="notice";
    },4000);
}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHtml(value){

    if(value === null || value === undefined)
        return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   SLUG
   ========================================================= */

function makeSlug(text){

    return String(text || "")
        .toLowerCase()
        .trim()
        .replace(/ə/g,"e")
        .replace(/ı/g,"i")
        .replace(/ö/g,"o")
        .replace(/ü/g,"u")
        .replace(/ş/g,"s")
        .replace(/ç/g,"c")
        .replace(/ğ/g,"g")
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-+|-+$/g,"");
}


/* =========================================================
   İLK 6 MƏHSULU BİR DƏFƏLİK YARAT
   ========================================================= */

async function initializeProducts(){

    const initialized =
        localStorage.getItem(
            "digibaku_products_initialized_v1"
        );

    if(initialized === "yes"){
        return;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("site_products")
        .select("id");

    if(error){
        console.error(error);
        return;
    }

    /*
      Əgər artıq məhsullar varsa,
      seed etmə.
    */

    if(data && data.length > 0){

        localStorage.setItem(
            "digibaku_products_initialized_v1",
            "yes"
        );

        return;
    }


    const rows =
        INITIAL_PRODUCTS.map((p,index)=>({

            name:p.name,
            slug:p.slug,
            image:p.image,
            description:p.description,

            price_1_normal:p.price1Normal,
            price_1_sale:p.price1Sale,

            price_2_normal:p.price2Normal,
            price_2_sale:p.price2Sale,

            price_3_normal:p.price3Normal,
            price_3_sale:p.price3Sale,

            price_12_normal:p.price12Normal,
            price_12_sale:p.price12Sale,

            normal_price:
                p.price1Normal ??
                p.price12Normal,

            sale_price:
                p.price1Sale ??
                p.price12Sale,

            discount_percent:0,

            duration:p.duration,

            faq_question:p.faqQuestion,
            faq_answer:p.faqAnswer,

            seo_title:p.seoTitle,
            seo_description:p.seoDescription,

            active:true,

            sort_order:index + 1,

            created_at:new Date().toISOString(),
            updated_at:new Date().toISOString()

        }));


    const {
        error:insertError
    } = await supabaseClient
        .from("site_products")
        .insert(rows);


    if(insertError){

        console.error(insertError);

        showNotice(
            "Məhsulların ilkin yaradılması zamanı xəta baş verdi: " +
            insertError.message,
            "error"
        );

        return;
    }


    localStorage.setItem(
        "digibaku_products_initialized_v1",
        "yes"
    );

}


/* =========================================================
   MƏHSULLARI YÜKLƏ
   ========================================================= */

async function loadProducts(){

    const container =
        document.getElementById(
            "productsContainer"
        );

    container.innerHTML =
        `<div class="loading">Məhsullar yüklənir...</div>`;


    const {
        data,
        error
    } = await supabaseClient
        .from("site_products")
        .select("*")
        .order("sort_order",{ascending:true})
        .order("id",{ascending:true});


    if(error){

        console.error(error);

        container.innerHTML =
            `<div class="empty">
                Məhsullar yüklənmədi.<br>
                ${escapeHtml(error.message)}
            </div>`;

        return;
    }


    products =
        data || [];


    updateStats();

    renderProducts();
}


/* =========================================================
   STATISTIKA
   ========================================================= */

function updateStats(){

    const total =
        products.length;

    const active =
        products.filter(
            p => p.active !== false
        ).length;

    const inactive =
        total - active;


    document.getElementById(
        "totalProducts"
    ).textContent = total;


    document.getElementById(
        "activeProducts"
    ).textContent = active;


    document.getElementById(
        "inactiveProducts"
    ).textContent = inactive;


    document.getElementById(
        "productCountText"
    ).textContent =
        total + " məhsul";
}


/* =========================================================
   MƏHSULLARI GÖSTƏR
   ========================================================= */

function renderProducts(){

    const container =
        document.getElementById(
            "productsContainer"
        );


    if(!products.length){

        container.innerHTML =
            `<div class="empty">
                Hazırda məhsul yoxdur.<br><br>
                “＋ Yeni məhsul” düyməsi ilə məhsul əlavə edə bilərsən.
            </div>`;

        return;
    }


    container.innerHTML =
        products.map(product => {

            const image =
                product.image
                ? `<img src="${escapeHtml(product.image)}"
                        alt="${escapeHtml(product.name)}"
                        onerror="this.style.display='none'">`
                : `<div class="no-image">Şəkil yoxdur</div>`;


            const active =
                product.active !== false;


            const prices = [];


            if(product.price_1_normal != null)
                prices.push(
                    `1 ay: ${product.price_1_sale ?? product.price_1_normal} AZN`
                );

            if(product.price_2_normal != null)
                prices.push(
                    `2 ay: ${product.price_2_sale ?? product.price_2_normal} AZN`
                );

            if(product.price_3_normal != null)
                prices.push(
                    `3 ay: ${product.price_3_sale ?? product.price_3_normal} AZN`
                );

            if(product.price_12_normal != null)
                prices.push(
                    `12 ay: ${product.price_12_sale ?? product.price_12_normal} AZN`
                );


            return `

                <article class="product-card">

                    <div class="product-image">
                        ${image}
                    </div>

                    <div class="product-body">

                        <div class="product-top">

                            <div class="product-name">
                                ${escapeHtml(product.name)}
                            </div>

                            <span class="badge ${active ? "active":"inactive"}">
                                ${active ? "AKTİV":"DEAKTİV"}
                            </span>

                        </div>

                        <div class="slug">
                            /${escapeHtml(product.slug || "")}
                        </div>

                        <div class="description">
                            ${escapeHtml(product.description || "Açıqlama əlavə edilməyib.")}
                        </div>

                        <div class="price-row">

                            ${
                                prices.length
                                ? prices.map(p =>
                                    `<div class="price">${escapeHtml(p)}</div>`
                                  ).join("")
                                : `<div class="price">Qiymət əlavə edilməyib</div>`
                            }

                        </div>

                        <div class="card-actions">

                            <button
                                class="edit-btn"
                                onclick="editProduct('${product.id}')"
                            >
                                ✎ Dəyiş
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteProduct('${product.id}')"
                            >
                                🗑 Sil
                            </button>

                        </div>

                    </div>

                </article>

            `;

        }).join("");
}

/* =========================================================
   BOŞ DƏYƏRİ NULL ET
   ========================================================= */

function numberOrNull(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){
        return null;
    }

    const n =
        Number(value);

    return Number.isFinite(n)
        ? n
        : null;
}


/* =========================================================
   MƏHSULU YADDA SAXLA
   ========================================================= */

async function saveProduct(event){

    event.preventDefault();


    const name =
        document.getElementById(
            "name"
        ).value.trim();


    let slug =
        document.getElementById(
            "slug"
        ).value.trim();


    if(!slug){
        slug = makeSlug(name);
    }


    if(!name){
        showNotice(
            "Məhsul adını yaz.",
            "error"
        );
        return;
    }


    if(!slug){
        showNotice(
            "Slug düzgün deyil.",
            "error"
        );
        return;
    }


    /*
      Eyni slug yoxlaması
    */

    const {
        data:duplicate
    } = await supabaseClient
        .from("site_products")
        .select("id,slug")
        .eq("slug",slug)
        .maybeSingle();


    if(
        duplicate &&
        String(duplicate.id) !== String(editingId)
    ){

        showNotice(
            "Bu slug artıq istifadə olunur.",
            "error"
        );

        return;
    }


    const price1Normal =
        numberOrNull(
            document.getElementById(
                "price1Normal"
            ).value
        );


    const price1Sale =
        numberOrNull(
            document.getElementById(
                "price1Sale"
            ).value
        );


    const price2Normal =
        numberOrNull(
            document.getElementById(
                "price2Normal"
            ).value
        );


    const price2Sale =
        numberOrNull(
            document.getElementById(
                "price2Sale"
            ).value
        );


    const price3Normal =
        numberOrNull(
            document.getElementById(
                "price3Normal"
            ).value
        );


    const price3Sale =
        numberOrNull(
            document.getElementById(
                "price3Sale"
            ).value
        );


    const price12Normal =
        numberOrNull(
            document.getElementById(
                "price12Normal"
            ).value
        );


    const price12Sale =
        numberOrNull(
            document.getElementById(
                "price12Sale"
            ).value
        );


    let normalPrice =
        price1Normal ??
        price2Normal ??
        price3Normal ??
        price12Normal;


    let salePrice =
        price1Sale ??
        price2Sale ??
        price3Sale ??
        price12Sale;


    if(
        document.getElementById(
            "duration"
        ).value === "12 ay"
    ){

        normalPrice =
            price12Normal ??
            normalPrice;

        salePrice =
            price12Sale ??
            salePrice;
    }


    const payload = {

        name,

        slug,

        image:
            document.getElementById(
                "image"
            ).value.trim() || null,

        description:
            document.getElementById(
                "description"
            ).value.trim() || null,


        price_1_normal:
            price1Normal,

        price_1_sale:
            price1Sale,


        price_2_normal:
            price2Normal,

        price_2_sale:
            price2Sale,


        price_3_normal:
            price3Normal,

        price_3_sale:
            price3Sale,


        price_12_normal:
            price12Normal,

        price_12_sale:
            price12Sale,


        normal_price:
            normalPrice,

        sale_price:
            salePrice,


        discount_percent:0,


        duration:
            document.getElementById(
                "duration"
            ).value,


        faq_question:
            document.getElementById(
                "faqQuestion"
            ).value.trim() || null,


        faq_answer:
            document.getElementById(
                "faqAnswer"
            ).value.trim() || null,


        seo_title:
            document.getElementById(
                "seoTitle"
            ).value.trim() || null,


        seo_description:
            document.getElementById(
                "seoDescription"
            ).value.trim() || null,


        active:
            document.getElementById(
                "active"
            ).checked,


        updated_at:
            new Date().toISOString()

    };


    /*
      YENİ MƏHSUL
    */

    if(!editingId){

        /*
          Növbəti sıra
        */

        const maxOrder =
            products.reduce(
                (max,p) =>
                    Math.max(
                        max,
                        Number(p.sort_order || 0)
                    ),
                0
            );


        payload.sort_order =
            maxOrder + 1;


        const {
            error
        } = await supabaseClient
            .from("site_products")
            .insert(payload);


        if(error){

            console.error(error);

            showNotice(
                "Məhsul əlavə edilmədi: " +
                error.message,
                "error"
            );

            return;
        }


        showNotice(
            "Yeni məhsul uğurla əlavə edildi."
        );

    }


    /*
      MÖVCUD MƏHSUL
    */

    else{

        const {
            error
        } = await supabaseClient
            .from("site_products")
            .update(payload)
            .eq("id",editingId);


        if(error){

            console.error(error);

            showNotice(
                "Məhsul dəyişdirilmədi: " +
                error.message,
                "error"
            );

            return;
        }


        showNotice(
            "Məhsul uğurla yeniləndi."
        );
    }


    closeForm();

    await loadProducts();
}


/* =========================================================
   MƏHSULU SİL
   ========================================================= */

async function deleteProduct(id){

    const product =
        products.find(
            p => String(p.id) === String(id)
        );


    if(!product){
        return;
    }


    const confirmed =
        confirm(
            `"${product.name}" məhsulunu silmək istəyirsən?\n\nBu əməliyyatdan sonra məhsul mərkəzi sistemdən silinəcək.`
        );


    if(!confirmed){
        return;
    }


    const {
        error
    } = await supabaseClient
        .from("site_products")
        .delete()
        .eq("id",id);


    if(error){

        console.error(error);

        showNotice(
            "Məhsul silinmədi: " +
            error.message,
            "error"
        );

        return;
    }


    /*
      Əgər silinən məhsul
      redaktə olunan məhsuldursa,
      formu bağla.
    */

    if(
        String(editingId) === String(id)
    ){
        closeForm();
    }


    showNotice(
        "Məhsul uğurla silindi."
    );


    await loadProducts();
}
