<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DigiBaku — Sayt Məhsulları</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top left,rgba(0,110,255,.14),transparent 30%),
        #05070b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.header{
    height:70px;
    padding:0 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #18202d;
    background:rgba(5,7,11,.94);
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(15px);
}

.logo{
    font-size:21px;
    font-weight:800;
}

.logo span{
    color:#1683ff;
}

.header-right{
    display:flex;
    gap:10px;
}

.header-btn{
    border:1px solid #263246;
    background:#0d131d;
    color:#cbd5e1;
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
}

.header-btn:hover{
    border-color:#1683ff;
    color:#fff;
}

.container{
    width:min(1250px,calc(100% - 30px));
    margin:30px auto 60px;
}

.top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:25px;
}

.top h1{
    font-size:30px;
    margin-bottom:7px;
}

.top p{
    color:#8995a8;
    font-size:14px;
}

.top-actions{
    display:flex;
    gap:10px;
}

.primary-btn{
    border:0;
    background:linear-gradient(135deg,#087cff,#0054c7);
    color:#fff;
    padding:12px 18px;
    border-radius:11px;
    font-weight:700;
}

.secondary-btn{
    border:1px solid #273348;
    background:#0c121b;
    color:#d7dfeb;
    padding:12px 17px;
    border-radius:11px;
    font-weight:600;
}

.notice{
    display:none;
    margin-bottom:20px;
    padding:13px 15px;
    border-radius:10px;
    font-size:14px;
}

.notice.success{
    display:block;
    background:#062b19;
    border:1px solid #0b6d3e;
    color:#7df0b3;
}

.notice.error{
    display:block;
    background:#300d12;
    border:1px solid #7c1d2b;
    color:#ff9aa7;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:25px;
}

.stat{
    background:#090e16;
    border:1px solid #182333;
    border-radius:14px;
    padding:18px;
}

.stat-title{
    color:#748196;
    font-size:12px;
    margin-bottom:7px;
}

.stat-value{
    font-size:25px;
    font-weight:800;
}

.products-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:13px;
}

.products-header h2{
    font-size:20px;
}

.products-header span{
    color:#718096;
    font-size:13px;
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.product-card{
    background:linear-gradient(180deg,#0a1019,#080c13);
    border:1px solid #192536;
    border-radius:16px;
    overflow:hidden;
}

.product-card:hover{
    border-color:#28527f;
}

.product-image{
    height:150px;
    background:#05080d;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid #172231;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.no-image{
    color:#506078;
    font-size:13px;
}

.product-body{
    padding:16px;
}

.product-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.product-name{
    font-size:17px;
    font-weight:750;
    line-height:1.3;
}

.badge{
    flex-shrink:0;
    padding:5px 8px;
    border-radius:7px;
    font-size:10px;
    font-weight:800;
}

.badge.active{
    background:#073b25;
    color:#6ff0ad;
    border:1px solid #0d6842;
}

.badge.inactive{
    background:#32150b;
    color:#ffae7b;
    border:1px solid #753116;
}

.slug{
    color:#64748b;
    font-size:12px;
    margin-top:7px;
}

.description{
    color:#94a0b2;
    font-size:13px;
    line-height:1.5;
    margin-top:12px;
    min-height:40px;
}

.price-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:13px;
}

.price{
    padding:7px 9px;
    background:#0d1520;
    border:1px solid #1c2a3d;
    border-radius:8px;
    color:#dce6f3;
    font-size:12px;
}

.card-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:15px;
}

.edit-btn,
.delete-btn{
    padding:10px;
    border-radius:9px;
    font-weight:700;
    font-size:12px;
}

.edit-btn{
    background:#0d5fd0;
    border:1px solid #1678ff;
    color:#fff;
}

.delete-btn{
    background:#250c11;
    border:1px solid #68202b;
    color:#ff8795;
}

.empty,
.loading{
    padding:50px 20px;
    text-align:center;
    color:#65748a;
    border:1px dashed #253246;
    border-radius:15px;
}

/* FORM */

.form-wrap{
    display:none;
    background:#080e17;
    border:1px solid #1a2a3e;
    border-radius:17px;
    padding:22px;
    margin-bottom:25px;
}

.form-wrap.show{
    display:block;
}

.form-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.form-title h2{
    font-size:21px;
}

.close-form{
    background:#111925;
    border:1px solid #273548;
    color:#aeb9c8;
    width:36px;
    height:36px;
    border-radius:9px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.full{
    grid-column:1/-1;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field label{
    color:#aeb9c8;
    font-size:12px;
    font-weight:700;
}

.field input,
.field textarea,
.field select{
    width:100%;
    background:#050a11;
    border:1px solid #223148;
    color:#fff;
    border-radius:9px;
    padding:11px 12px;
    outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#167cff;
}

.field textarea{
    min-height:100px;
    resize:vertical;
}

.price-section{
    grid-column:1/-1;
    border:1px solid #1a2a3c;
    background:#060b12;
    border-radius:13px;
    padding:16px;
}

.price-section-title{
    font-size:14px;
    font-weight:800;
    margin-bottom:13px;
}

.price-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.price-box{
    background:#0a111b;
    border:1px solid #1b2a3c;
    padding:12px;
    border-radius:10px;
}

.price-box-title{
    color:#7e8ca0;
    font-size:11px;
    font-weight:700;
    margin-bottom:8px;
}

.price-box input{
    margin-bottom:7px;
}

.checkbox{
    display:flex;
    align-items:center;
    gap:9px;
    color:#b7c2d1;
    font-size:13px;
}

.checkbox input{
    width:17px;
    height:17px;
}

.form-actions{
    grid-column:1/-1;
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

.save-btn{
    background:linear-gradient(135deg,#087cff,#0054c7);
    border:0;
    color:#fff;
    padding:12px 22px;
    border-radius:10px;
    font-weight:800;
}

.cancel-btn{
    background:#101722;
    border:1px solid #273448;
    color:#b7c2d1;
    padding:12px 20px;
    border-radius:10px;
}

@media(max-width:950px){

    .products-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .price-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:650px){

    .header{
        padding:0 15px;
    }

    .container{
        width:calc(100% - 20px);
        margin-top:20px;
    }

    .top{
        flex-direction:column;
        align-items:stretch;
    }

    .top-actions{
        width:100%;
    }

    .top-actions button{
        flex:1;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .products-grid{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .price-grid{
        grid-template-columns:1fr 1fr;
    }

    .full,
    .price-section,
    .form-actions{
        grid-column:auto;
    }

    .form-actions{
        display:grid;
        grid-template-columns:1fr 1fr;
    }
}
</style>
</head>

                            <input

                        <div class="price-box">

                                2 AY
                            </div>

                            <input
                                id="price2Normal"

                                step="0.01"
                                placeholder="Normal"
                            >

                            <input
                                id="price2Sale"
                                type="number"
                                step="0.01"
                                placeholder="Endirimli"
                            >

                        </div>


                        <div class="price-box">

                            <div class="price-box-title">
                                3 AY
                            </div>

                            <input
                                id="price3Normal"
                                type="number"
                                step="0.01"
                                placeholder="Normal"
                            >

                            <input
                                id="price3Sale"
                                type="number"
                                step="0.01"
                                placeholder="Endirimli"
                            >

                        </div>


                        <div class="price-box">

                            <div class="price-box-title">
                                12 AY
                            </div>

                            <input
                                id="price12Normal"
                                type="number"
                                step="0.01"
                                placeholder="Normal"
                            >

                            <input
                                id="price12Sale"
                                type="number"
                                step="0.01"
                                placeholder="Endirimli"
                            >

                        </div>

                    </div>

                </div>


                <!-- FAQ -->

                <div class="field">

                    <label>
                        FAQ sualı
                    </label>

                    <input
                        id="faqQuestion"
                        type="text"
                        placeholder="Netflix Premium nədir?"
                    >

                </div>


                <div class="field">

                    <label>
                        FAQ cavabı
                    </label>

                    <textarea
                        id="faqAnswer"
                        placeholder="FAQ cavabı..."

                </div>


                <!-- SEO -->

                <div class="field">

                    <label>
                        SEO Title

                    <input
                        id="seoTitle"

                        placeholder="Netflix 4K Premium Azərbaycan Abunəliyi | DigiBaku"

                <div class="field">

                    <label>

                    <textarea

                <div class="form-actions">

                    <button

                        Ləğv et

                    <button

                    >
                        Yadda saxla
                    </button>

                </div>

            </div>

        </form>

    </section>


    <!-- PRODUCTS -->

    <div class="products-header">

        <h2>

        </h2>

        <span id="productCountText">

        </span>

    </div>


    <div
        id="productsContainer"
        class="products-grid"
    >

        <div class="loading">
            Məhsullar yüklənir...
        </div>

    </div>

</main>

/* =====================================================
   AUTH
   ===================================================== */

async function checkAdmin(){

    const {
        data:{session}
    } =
    await supabaseClient.auth.getSession();

    if(
        !session ||
        !session.user ||
        session.user.email !== ADMIN_EMAIL
    ){

        window.location.href="login.html";

        return false;
    }

    return true;
}

function showNotice(message,type="success"){

    const box =
        document.getElementById("notice");

    box.className=
        "notice "+type;

    box.textContent=
        message;

    setTimeout(()=>{
        box.className="notice";
    },5000);
}


/* =====================================================
   HTML ESCAPE
   ===================================================== */

function escapeHtml(value){

    if(value===null || value===undefined)
        return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   SLUG
   ===================================================== */

function makeSlug(text){

    return String(text||"")
        .toLowerCase()
        .trim()
        .replace(/ə/g,"e")
        .replace(/ı/g,"i")
        .replace(/ö/g,"o")
        .replace(/ü/g,"u")
        .replace(/ş/g,"s")
        .replace(/ç/g,"c")
        .replace(/ğ/g,"g")
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-+|-+$/g,"");
}


/* =====================================================
   İLKİN MƏHSUL KÖÇÜRÜLMƏSİ
   ===================================================== */

async function initializeProducts(){

    const key=
        "digibaku_products_seeded_v3";


    /*
      Əgər bu brauzerdə artıq ilkin köçürmə
      edilibsə, bir daha heç nə yaratmırıq.
    */

    if(
        localStorage.getItem(key)==="yes"
    ){

        return;
    }


    /*
      Hazırda bazada olan məhsulları götür.
    */

    const {
        data:existing,
        error:existingError
    } =
    await supabaseClient
        .from("site_products")
        .select("id,slug");


    if(existingError){

        console.error(existingError);

        showNotice(
            "Mövcud məhsullar oxunmadı: "+
            existingError.message,
            "error"
        );

        return;
    }


    const existingSlugs=
        new Set(
            (existing||[])
                .map(p=>String(p.slug||"").toLowerCase())
                .filter(Boolean)
        );


    /*
      Bazada olmayan 6 məhsulu tap.
    */

    const missing=
        INITIAL_PRODUCTS.filter(
            p=>
                !existingSlugs.has(
                    p.slug.toLowerCase()
                )
        );


    if(!missing.length){

        localStorage.setItem(
            key,
            "yes"
        );

        return;
    }


    /*
      Mövcud məhsulların davamından sort order.
    */

    let order=
        (existing||[]).length+1;


    const rows=
        missing.map(p=>({

            name:p.name,

            slug:p.slug,

            image:p.image,

            description:p.description,


            price_1_normal:
                p.p1 ?? null,

            price_1_sale:
                p.p1 ?? null,


            price_2_normal:
                p.p2 ?? null,

            price_2_sale:
                p.p2 ?? null,


            price_3_normal:
                p.p3 ?? null,

            price_3_sale:
                p.p3 ?? null,


            price_12_normal:
                p.p12 ?? null,

            price_12_sale:
                p.p12 ?? null,


            normal_price:
                p.p1 ??
                p.p12 ??
                null,


            sale_price:
                p.p1 ??
                p.p12 ??
                null,


            discount_percent:0,

            duration:p.duration||"1 ay",

            faq_question:p.faqQ,

            faq_answer:p.faqA,

            seo_title:p.seoTitle,

            seo_description:p.seoDescription,

            active:true,

            sort_order:order++,

            created_at:
                new Date().toISOString(),

            updated_at:
                new Date().toISOString()

        }));


    const {
        error:insertError
    } =
    await supabaseClient
        .from("site_products")
        .insert(rows);


    if(insertError){

        console.error(insertError);

        showNotice(
            "Məhsullar əlavə olunmadı: "+
            insertError.message,
            "error"
        );

        return;
    }


    localStorage.setItem(
        key,
        "yes"
    );


    showNotice(
        missing.length+
        " məhsul mərkəzi sistemə əlavə edildi."
    );
}


/* =====================================================
   MƏHSULLARI YÜKLƏ
   ===================================================== */

async function loadProducts(){

    const container=
        document.getElementById(
            "productsContainer"
        );


    container.innerHTML=
        `<div class="loading">
            Məhsullar yüklənir...
        </div>`;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("site_products")
        .select("*")
        .order("sort_order",{ascending:true})
        .order("id",{ascending:true});


    if(error){

        console.error(error);

        container.innerHTML=
            `<div class="empty">
                Məhsullar yüklənmədi.<br><br>
                ${escapeHtml(error.message)}
            </div>`;

        return;
    }


    products=data||[];


    updateStats();

    renderProducts();
}


/* =====================================================
   STATİSTİKA
   ===================================================== */

function updateStats(){

    const total=
        products.length;


    const active=
        products.filter(
            p=>p.active!==false
        ).length;


    const inactive=
        total-active;


    document.getElementById(
        "totalProducts"
    ).textContent=total;


    document.getElementById(
        "activeProducts"
    ).textContent=active;


    document.getElementById(
        "inactiveProducts"
    ).textContent=inactive;


    document.getElementById(
        "productCountText"
    ).textContent=
        total+" məhsul";
}


/* =====================================================
   MƏHSULLARI GÖSTƏR
   ===================================================== */

function renderProducts(){

    const container=
        document.getElementById(
            "productsContainer"
        );


    if(!products.length){

        container.innerHTML=
            `<div class="empty">
                Hazırda məhsul yoxdur.<br><br>
                “＋ Yeni məhsul” düyməsi ilə əlavə et.
            </div>`;

        return;
    }


    container.innerHTML=
        products.map(product=>{

            const active=
                product.active!==false;


            let image="";

            if(product.image){

                image=
                    `<img
                        src="${escapeHtml(product.image)}"
                        alt="${escapeHtml(product.name)}"
                        onerror="this.style.display='none'"
                    >`;

            }else{

                image=
                    `<div class="no-image">
                        Şəkil yoxdur
                    </div>`;
            }


            const prices=[];


            if(product.price_1_normal!=null){

                prices.push(
                    `1 ay: ${
                        product.price_1_sale ??
                        product.price_1_normal
                    } AZN`
                );

            }


            if(product.price_2_normal!=null){

                prices.push(
                    `2 ay: ${
                        product.price_2_sale ??
                        product.price_2_normal
                    } AZN`
                );

            }


            if(product.price_3_normal!=null){

                prices.push(
                    `3 ay: ${
                        product.price_3_sale ??
                        product.price_3_normal
                    } AZN`
                );

            }


            if(product.price_12_normal!=null){

                prices.push(
                    `12 ay: ${
                        product.price_12_sale ??
                        product.price_12_normal
                    } AZN`
                );

            }


            return `

                <article class="product-card">

                    <div class="product-image">
                        ${image}
                    </div>


                    <div class="product-body">

                        <div class="product-top">

                            <div class="product-name">
                                ${escapeHtml(product.name)}
                            </div>

                            <span class="badge ${
                                active
                                ?"active"
                                :"inactive"
                            }">
                                ${
                                    active
                                    ?"AKTİV"
                                    :"DEAKTİV"
                                }
                            </span>

                        </div>


                        <div class="slug">
                            /${escapeHtml(product.slug||"")}
                        </div>


                        <div class="description">
                            ${
                                escapeHtml(
                                    product.description ||
                                    "Açıqlama əlavə edilməyib."
                                )
                            }
                        </div>


                        <div class="price-row">

                            ${
                                prices.length
                                ? prices.map(price=>
                                    `<div class="price">
                                        ${escapeHtml(price)}
                                    </div>`
                                  ).join("")
                                : `<div class="price">
                                    Qiymət yoxdur
                                  </div>`
                            }

                        </div>


                        <div class="card-actions">

                            <button
                                class="edit-btn"
                                onclick="editProduct('${product.id}')"
                            >
                                ✎ Dəyiş
                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteProduct('${product.id}')"
                            >
                                🗑 Sil
                            </button>

                        </div>

                    </div>

                </article>

            `;

        }).join("");
}

/* =====================================================
   NUMBER
   ===================================================== */

function numberOrNull(value){

    if(value==="" || value==null)
        return null;

    const number=
        Number(value);

    return Number.isFinite(number)
        ?number
        :null;
}


/* =====================================================
   YADDA SAXLA
   ===================================================== */

async function saveProduct(event){

    event.preventDefault();


    const name=
        document.getElementById(
            "name"
        ).value.trim();


    const slug=
        document.getElementById(
            "slug"
        ).value.trim() ||
        makeSlug(name);


    if(!name){

        showNotice(
            "Məhsul adını yaz.",
            "error"
        );

        return;
    }


    if(!slug){

        showNotice(
            "Slug yazılmalıdır.",
            "error"
        );

        return;
    }


    /*
      Slug təkrarlanmasın.
    */

    const {
        data:duplicate
    } =
    await supabaseClient
        .from("site_products")
        .select("id,slug")
        .eq("slug",slug)
        .maybeSingle();


    if(
        duplicate &&
        String(duplicate.id)!==
        String(editingId)
    ){

        showNotice(
            "Bu slug artıq mövcuddur.",
            "error"
        );

        return;
    }


    const p1=
        numberOrNull(
            document.getElementById(
                "price1Normal"
            ).value
        );


    const p1sale=
        numberOrNull(
            document.getElementById(
                "price1Sale"
            ).value
        );


    const p2=
        numberOrNull(
            document.getElementById(
                "price2Normal"
            ).value
        );


    const p2sale=
        numberOrNull(
            document.getElementById(
                "price2Sale"
            ).value
        );


    const p3=
        numberOrNull(
            document.getElementById(
                "price3Normal"
            ).value
        );


    const p3sale=
        numberOrNull(
            document.getElementById(
                "price3Sale"
            ).value
        );


    const p12=
        numberOrNull(
            document.getElementById(
                "price12Normal"
            ).value
        );


    const p12sale=
        numberOrNull(
            document.getElementById(
                "price12Sale"
            ).value
        );


    const duration=
        document.getElementById(
            "duration"
        ).value;


    let normalPrice=
        p1 ??
        p2 ??
        p3 ??
        p12 ??
        null;


    let salePrice=
        p1sale ??
        p2sale ??
        p3sale ??
        p12sale ??
        null;


    if(duration==="12 ay"){

        normalPrice=
            p12 ??
            normalPrice;

        salePrice=
            p12sale ??
            salePrice;
    }


    const payload={

        name:name,

        slug:slug,

        image:
            document.getElementById(
                "image"
            ).value.trim() || null,

        description:
            document.getElementById(
                "description"
            ).value.trim() || null,


        price_1_normal:p1,
        price_1_sale:p1sale,

        price_2_normal:p2,
        price_2_sale:p2sale,

        price_3_normal:p3,
        price_3_sale:p3sale,

        price_12_normal:p12,
        price_12_sale:p12sale,


        normal_price:normalPrice,

        sale_price:salePrice,

        discount_percent:0,

        duration:duration,


        faq_question:
            document.getElementById(
                "faqQuestion"
            ).value.trim() || null,


        faq_answer:
            document.getElementById(
                "faqAnswer"
            ).value.trim() || null,


        seo_title:
            document.getElementById(
                "seoTitle"
            ).value.trim() || null,


        seo_description:
            document.getElementById(
                "seoDescription"
            ).value.trim() || null,


        active:
            document.getElementById(
                "active"
            ).checked,


        updated_at:
            new Date().toISOString()

    };


    if(!editingId){

        const maxOrder=
            products.reduce(
                (max,p)=>
                    Math.max(
                        max,
                        Number(p.sort_order||0)
                    ),
                0
            );


        payload.sort_order=
            maxOrder+1;


        const {
            error
        } =
        await supabaseClient
            .from("site_products")
            .insert(payload);


        if(error){

            console.error(error);

            showNotice(
                "Məhsul əlavə edilmədi: "+
                error.message,
                "error"
            );

            return;
        }


        showNotice(
            "Yeni məhsul əlavə edildi."
        );

    }else{

        const {
            error
        } =
        await supabaseClient
            .from("site_products")
            .update(payload)
            .eq("id",editingId);


        if(error){

            console.error(error);

            showNotice(
                "Məhsul dəyişdirilmədi: "+
                error.message,
                "error"
            );

            return;
        }


        showNotice(
            "Məhsul yeniləndi."
        );
    }


    closeForm();

    await loadProducts();
}


/* =====================================================
   SİL
   ===================================================== */

async function deleteProduct(id){

    const product=
        products.find(
            p=>String(p.id)===String(id)
        );


    if(!product)
        return;


    const confirmed=
        confirm(
            `"${product.name}" məhsulunu silmək istəyirsən?\n\nMəhsul mərkəzi sistemdən silinəcək.`
        );


    if(!confirmed)
        return;


    const {
        error
    } =
    await supabaseClient
        .from("site_products")
        .delete()
        .eq("id",id);


    if(error){

        console.error(error);

        showNotice(
            "Məhsul silinmədi: "+
            error.message,
            "error"
        );

        return;
    }


    if(
        String(editingId)===
        String(id)
    ){
        closeForm();
    }


    showNotice(
        "Məhsul silindi."
    );


    await loadProducts();
}
