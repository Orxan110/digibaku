<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DigiBaku — Gizli Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#07111f;
    color:#fff;
    min-height:100vh;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.header{
    position:sticky;
    top:0;
    z-index:50;
    background:#0b1728;
    border-bottom:1px solid rgba(255,255,255,.08);
    padding:15px 20px;
}

.header-inner{
    max-width:1250px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:21px;
    font-weight:800;
    color:#25a7ff;
}

.logo span{
    color:#fff;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.admin-email{
    color:#9fb0c5;
    font-size:13px;
}

.logout{
    border:0;
    background:#e53935;
    color:#fff;
    padding:9px 14px;
    border-radius:9px;
    font-weight:700;
}

.container{
    width:min(1250px,calc(100% - 30px));
    margin:25px auto 60px;
}

.page-title{
    margin-bottom:7px;
    font-size:29px;
}

.page-subtitle{
    color:#8fa3ba;
    margin-bottom:25px;
}

.message{
    display:none;
    padding:13px 15px;
    border-radius:10px;
    margin-bottom:18px;
    font-weight:600;
}

.message.success{
    display:block;
    background:rgba(0,200,120,.12);
    border:1px solid rgba(0,200,120,.35);
    color:#55e6a2;
}

.message.error{
    display:block;
    background:rgba(255,60,60,.12);
    border:1px solid rgba(255,60,60,.35);
    color:#ff8585;
}

.products{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
}

.product-card{
    background:#0d1b2d;
    border:1px solid rgba(255,255,255,.08);
    border-radius:17px;
    overflow:hidden;
}

.product-top{
    padding:17px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.product-title{
    font-size:19px;
    font-weight:800;
}

.product-key{
    color:#6f87a2;
    font-size:12px;
    margin-top:4px;
}

.status{
    border:0;
    border-radius:20px;
    padding:7px 11px;
    font-size:12px;
    font-weight:800;
}

.status.active{
    background:rgba(0,210,130,.12);
    color:#52e5a0;
}

.status.off{
    background:rgba(255,70,70,.12);
    color:#ff7f7f;
}

.body{
    padding:18px;
}

.section{
    margin-bottom:20px;
}

.section:last-child{
    margin-bottom:0;
}

.section-title{
    color:#25a7ff;
    font-size:13px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:10px;
}

label{
    display:block;
    color:#9fb1c7;
    font-size:12px;
    margin-bottom:6px;
}

input,
textarea,
select{
    width:100%;
    background:#081522;
    color:#fff;
    border:1px solid #23364d;
    border-radius:9px;
    outline:none;
    padding:11px 12px;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#1d9bf0;
}

textarea{
    min-height:85px;
    resize:vertical;
}

.grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.grid-3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.price-box{
    background:#081522;
    border:1px solid #1e3044;
    border-radius:12px;
    padding:13px;
}

.price-title{
    font-weight:800;
    margin-bottom:10px;
    font-size:14px;
}

.discount-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:9px;
}

.switch-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:10px;
}

.switch{
    position:relative;
    width:43px;
    height:23px;
    flex:none;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;
    border-radius:20px;
    background:#26394e;
    transition:.2s;
}

.slider:before{
    content:"";
    position:absolute;
    width:17px;
    height:17px;
    left:3px;
    top:3px;
    border-radius:50%;
    background:#fff;
    transition:.2s;
}

.switch input:checked + .slider{
    background:#1597ed;
}

.switch input:checked + .slider:before{
    transform:translateX(20px);
}

.actions{
    padding:15px 18px;
    background:#0a1625;
    border-top:1px solid rgba(255,255,255,.07);
    display:flex;
    gap:10px;
}

.save{
    flex:1;
    border:0;
    border-radius:10px;
    padding:12px;
    background:#1597ed;
    color:#fff;
    font-weight:800;
}

.save:hover{
    background:#087fce;
}

.reset{
    border:1px solid #30465e;
    background:transparent;
    color:#b7c6d7;
    border-radius:10px;
    padding:12px 15px;
}

.loading{
    text-align:center;
    padding:50px;
    color:#8fa3ba;
    grid-column:1/-1;
}

@media(max-width:850px){
    .products{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){
    .container{
        width:min(100% - 20px,1250px);
        margin-top:18px;
    }

    .header{
        padding:12px 10px;
    }

    .header-inner{
        align-items:flex-start;
        flex-direction:column;
    }

    .header-right{
        width:100%;
        justify-content:space-between;
    }

    .grid-2,
    .grid-3{
        grid-template-columns:1fr;
    }

    .product-top{
        align-items:flex-start;
    }

    .admin-email{
        max-width:65%;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div class="logo">DigiBaku<span> — Admin</span></div>

        <div class="header-right">
            <div class="admin-email" id="adminEmail"></div>
            <button class="logout" id="logoutBtn">Çıxış</button>
        </div>
    </div>
</header>

<main class="container">

    <h1 class="page-title">Məhsullar</h1>

    <p class="page-subtitle">
        Məhsul məlumatlarını və qiymətləri buradan dəyiş. Saxladıqdan sonra
        mərkəzi Supabase məlumatı bütün sayt səhifələrində istifadə oluna bilər.
    </p>

    <div id="message" class="message"></div>

    <div id="products" class="products">
        <div class="loading">Məhsullar yüklənir...</div>
    </div>

</main>

<script>
const SUPABASE_URL =
    "https://zeknhnkaicqkfzgnvycq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_jHvCp9fXBA_BwFqrXYpwlw_VC6C1OQk";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const ADMIN_EMAIL =
    "zahidovorxan989@gmail.com";

let productsData = [];
let pricesData = [];

const productsEl = document.getElementById("products");
const messageEl = document.getElementById("message");
const adminEmailEl = document.getElementById("adminEmail");

function showMessage(text,type="success"){
    messageEl.textContent = text;
    messageEl.className = "message " + type;

    setTimeout(()=>{
        messageEl.className = "message";
    },3500);
}

function esc(value){
    if(value === null || value === undefined) return "";

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function numberValue(value){
    const n = Number(value);
    return Number.isFinite(n) ? n : 0;
}

function getPrice(productKey){
    return pricesData.find(
        x => x.product_key === productKey
    ) || {
        product_key:productKey,
        price_1_month:0,
        price_2_month:0,
        price_3_month:0,
        sale_1_active:false,
        sale_2_active:false,
        sale_3_active:false,
        sale_1_price:0,
        sale_2_price:0,
        sale_3_price:0,
        price_12_month:0,
        sale_12_price:0,
        sale_12_active:false
    };
}

function priceInput(value){
    return numberValue(value).toFixed(2);
}

function productCard(product){

    const p = getPrice(product.product_key);

    const active = product.active !== false;

    return `
    <article class="product-card"
        data-key="${esc(product.product_key)}">

        <div class="product-top">

            <div>
                <div class="product-title">
                    ${esc(product.name_az || product.product_key)}
                </div>

                <div class="product-key">
                    ${esc(product.product_key)}
                </div>
            </div>

            <button
                type="button"
                class="status ${active ? "active" : "off"}"
                onclick="toggleActive('${esc(product.product_key)}')">

                ${active ? "AKTİV" : "PASSİV"}

            </button>

        </div>

        <div class="body">

            <div class="section">

                <div class="section-title">
                    Məhsul məlumatları
                </div>

                <div class="grid-2">

                    <div>
                        <label>Azərbaycan adı</label>

                        <input
                            data-field="name_az"
                            value="${esc(product.name_az)}">
                    </div>

                    <div>
                        <label>English name</label>

                        <input
                            data-field="name_en"
                            value="${esc(product.name_en)}">
                    </div>

                    <div>
                        <label>Русское название</label>

                        <input
                            data-field="name_ru"
                            value="${esc(product.name_ru)}">
                    </div>

                    <div>
                        <label>Şəkil yolu</label>

                        <input
                            data-field="image"
                            value="${esc(product.image)}"
                            placeholder="netflix.webp">
                    </div>

                </div>

            </div>

            <div class="section">

                <div class="section-title">
                    Təsvir
                </div>

                <div class="grid-2">

                    <div>
                        <label>AZ təsvir</label>

                        <textarea data-field="description_az">${esc(product.description_az)}</textarea>
                    </div>

                    <div>
                        <label>EN description</label>

                        <textarea data-field="description_en">${esc(product.description_en)}</textarea>
                    </div>

                    <div>
                        <label>RU описание</label>

                        <textarea data-field="description_ru">${esc(product.description_ru)}</textarea>
                    </div>

                    <div>
                        <label>Sıralama</label>

                        <input
                            type="number"
                            data-field="sort_order"
                            value="${numberValue(product.sort_order)}">
                    </div>

                </div>

            </div>

            <div class="section">

                <div class="section-title">
                    Qiymətlər
                </div>

                <div class="grid-3">

                    ${priceBox(
                        "1 ay",
                        "1",
                        p.price_1_month,
                        p.sale_1_active,
                        p.sale_1_price
                    )}

                    ${priceBox(
                        "2 ay",
                        "2",
                        p.price_2_month,
                        p.sale_2_active,
                        p.sale_2_price
                    )}

                    ${priceBox(
                        "3 ay",
                        "3",
                        p.price_3_month,
                        p.sale_3_active,
                        p.sale_3_price
                    )}

                </div>

            </div>

            <div class="section">

                <div class="section-title">
                    12 ay
                </div>

                <div class="price-box">

                    <div class="price-title">
                        12 aylıq qiymət
                    </div>

                    <input
                        type="number"
                        step="0.01"
                        data-price="price_12_month"
                        value="${priceInput(p.price_12_month)}">

                    <div class="switch-row">

                        <span>12 ay endirimi</span>

                        <label class="switch">
                            <input
                                type="checkbox"
                                data-price-toggle="sale_12_active"
                                ${p.sale_12_active ? "checked" : ""}>
                            <span class="slider"></span>
                        </label>

                    </div>

                    <div class="discount-row">

                        <div>
                            <label>12 ay endirim qiyməti</label>

                            <input
                                type="number"
                                step="0.01"
                                data-price="sale_12_price"
                                value="${priceInput(p.sale_12_price)}">
                        </div>

                    </div>

                </div>

            </div>

            <div class="section">

                <div class="section-title">
                    SEO
                </div>

                <div class="grid-2">

                    <div>
                        <label>SEO Title AZ</label>
                        <input
                            data-field="seo_title_az"
                            value="${esc(product.seo_title_az)}">
                    </div>

                    <div>
                        <label>SEO Description AZ</label>
                        <textarea data-field="seo_description_az">${esc(product.seo_description_az)}</textarea>
                    </div>

                    <div>
                        <label>SEO Title EN</label>
                        <input
                            data-field="seo_title_en"
                            value="${esc(product.seo_title_en)}">
                    </div>

                    <div>
                        <label>SEO Title RU</label>
                        <input
                            data-field="seo_title_ru"
                            value="${esc(product.seo_title_ru)}">
                    </div>

                </div>

            </div>

        </div>

        <div class="actions">

            <button
                class="reset"
                type="button"
                onclick="reloadProducts()">
                Yenilə
            </button>

            <button
                class="save"
                type="button"
                onclick="saveProduct('${esc(product.product_key)}')">
                💾 Yadda saxla
            </button>

        </div>

    </article>
    `;
}

function priceBox(title,month,regular,discountActive,discountPrice){

    return `
    <div class="price-box">

        <div class="price-title">
            ${title}
        </div>

        <label>Normal qiymət</label>

        <input
            type="number"
            step="0.01"
            data-price="price_${month}_month"
            value="${priceInput(regular)}">

        <div class="switch-row">

            <span>Endirim aktivdir</span>

            <label class="switch">

                <input
                    type="checkbox"
                    data-price-toggle="sale_${month}_active"
                    ${discountActive ? "checked" : ""}>

                <span class="slider"></span>

            </label>

        </div>

        <div class="discount-row">

            <div style="grid-column:1/-1">

                <label>Endirim qiyməti</label>

                <input
                    type="number"
                    step="0.01"
                    data-price="sale_${month}_price"
                    value="${priceInput(discountPrice)}">

            </div>

        </div>

    </div>
    `;
}

function renderProducts(){

    if(!productsData.length){

        productsEl.innerHTML = `
            <div class="loading">
                Məhsul tapılmadı.
            </div>
        `;

        return;
    }

    productsEl.innerHTML =
        productsData
        .sort((a,b)=>
            numberValue(a.sort_order) -
            numberValue(b.sort_order)
        )
        .map(productCard)
        .join("");
}

async function loadProducts(){

    productsEl.innerHTML =
        `<div class="loading">Məhsullar yüklənir...</div>`;

    const [
        productsResult,
        pricesResult
    ] = await Promise.all([

        supabaseClient
            .from("products")
            .select("*")
            .order("sort_order",{ascending:true}),

        supabaseClient
            .from("product_prices")
            .select("*")

    ]);

    if(productsResult.error){
        console.error(productsResult.error);

        productsEl.innerHTML = `
            <div class="loading">
                products cədvəli oxunmadı.<br><br>
                ${esc(productsResult.error.message)}
            </div>
        `;

        return;
    }

    if(pricesResult.error){
        console.error(pricesResult.error);

        showMessage(
            "Qiymətlər oxunmadı: " +
            pricesResult.error.message,
            "error"
        );
    }

    productsData = productsResult.data || [];
    pricesData = pricesResult.data || [];

    renderProducts();
}

function getCard(productKey){

    return document.querySelector(
        `.product-card[data-key="${CSS.escape(productKey)}"]`
    );
}

function collectProduct(card){

    const data = {};

    card
        .querySelectorAll("[data-field]")
        .forEach(el=>{
            const field = el.dataset.field;

            if(field === "sort_order"){
                data[field] =
                    parseInt(el.value || "0",10);
            }else{
                data[field] = el.value;
            }
        });

    return data;
}

function collectPrices(card){

    const data = {};

    card
        .querySelectorAll("[data-price]")
        .forEach(el=>{

            data[el.dataset.price] =
                parseFloat(el.value || "0");

        });

    card
        .querySelectorAll("[data-price-toggle]")
        .forEach(el=>{

            data[el.dataset.priceToggle] =
                el.checked;

        });

    return data;
}

async function saveProduct(productKey){

    const card = getCard(productKey);

    if(!card) return;

    const productFields =
        collectProduct(card);

    const priceFields =
        collectPrices(card);

    const existingProduct =
        productsData.find(
            x => x.product_key === productKey
        );

    if(!existingProduct){
        showMessage(
            "Məhsul tapılmadı.",
            "error"
        );
        return;
    }

    const productUpdate = {
        ...productFields,
        updated_at:new Date().toISOString()
    };

    const productResult =
        await supabaseClient
        .from("products")
        .update(productUpdate)
        .eq("product_key",productKey);

    if(productResult.error){

        console.error(productResult.error);

        showMessage(
            "Məhsul yadda saxlanmadı: " +
            productResult.error.message,
            "error"
        );

        return;
    }

    const priceExists =
        pricesData.some(
            x => x.product_key === productKey
        );

    let priceResult;

    if(priceExists){

        priceResult =
            await supabaseClient
            .from("product_prices")
            .update(priceFields)
            .eq("product_key",productKey);

    }else{

        priceResult =
            await supabaseClient
            .from("product_prices")
            .insert({
                product_key:productKey,
                product_name:productFields.name_az,
                ...priceFields
            });

    }

    if(priceResult.error){

        console.error(priceResult.error);

        showMessage(
            "Məhsul yadda saxlandı, amma qiymətlər yadda saxlanmadı: " +
            priceResult.error.message,
            "error"
        );

        return;
    }

    showMessage(
        productFields.name_az +
        " uğurla yadda saxlanıldı."
    );

    await loadProducts();
}

async function toggleActive(productKey){

    const product =
        productsData.find(
            x => x.product_key === productKey
        );

    if(!product) return;

    const result =
        await supabaseClient
        .from("products")
        .update({
            active:!product.active,
            updated_at:new Date().toISOString()
        })
        .eq("product_key",productKey);

    if(result.error){

        showMessage(
            "Status dəyişmədi: " +
            result.error.message,
            "error"
        );

        return;
    }

    await loadProducts();
}

async function reloadProducts(){
    await loadProducts();
    showMessage("Məlumat yeniləndi.");
}

async function checkAdmin(){

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();

    if(error || !data.session){

        window.location.href =
            "login.html";

        return false;
    }

    const email =
        data.session.user.email;

    if(
        !email ||
        email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ){

        await supabaseClient.auth.signOut();

        alert("Bu panelə giriş icazəniz yoxdur.");

        window.location.href =
            "login.html";

        return false;
    }

    adminEmailEl.textContent = email;

    return true;
}

document
.getElementById("logoutBtn")
.addEventListener("click",async()=>{

    await supabaseClient.auth.signOut();

    window.location.href =
        "login.html";

});

supabaseClient.auth.onAuthStateChange(
    async(event,session)=>{

        if(
            event === "SIGNED_OUT"
        ){

            window.location.href =
                "login.html";

        }

    }
);

(async()=>{

    const allowed =
        await checkAdmin();

    if(!allowed) return;

    await loadProducts();

})();
</script>

</body>
</html>
