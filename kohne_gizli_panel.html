<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DigiBaku Admin</title>
<style>
:root{--bg:#0B0D12;--card:#141823;--line:#232A3B;--text:#EDEFF5;--muted:#8A93A8;--o:#FF6A3D;--g:linear-gradient(135deg,#FF6A3D,#5B6CFF)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh}
input,textarea,select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font:inherit;width:100%}
label{font-size:13px;color:var(--muted);display:grid;gap:5px}
.btn{background:var(--g);color:#fff;border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:#3a1d1d;color:#ff8a8a}
aside{width:220px;background:var(--card);border-right:1px solid var(--line);padding:18px;flex-shrink:0}
aside h2{font-size:18px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:18px}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:10px;border-radius:8px;font:inherit;cursor:pointer;margin-bottom:4px}
aside button.on,aside button:hover{background:var(--bg);color:var(--text)}
main{flex:1;padding:24px;overflow-x:auto;min-width:0}
h1{font-size:24px;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font-size:26px;color:var(--o);margin-top:4px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
#login{max-width:340px;margin:auto;align-self:center;width:100%;padding:24px}
@media(max-width:800px){body{flex-direction:column}aside{width:100%}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="box" style="display:none">
  <h1>Admin giriş</h1>
  <form onsubmit="event.preventDefault();if(this.p.value===PASS){sessionStorage.s='1';boot()}else alert('Şifrə yanlışdır')">
    <label>Şifrə<input type="password" name="p" required></label>
    <button class="btn" style="margin-top:12px;width:100%">Daxil ol</button>
  </form>
  <p class="muted" style="font-size:12px;margin-top:10px">Qeyd: bu yalnız prototip üçündür. Real giriş backend-də qurulacaq.</p>
</div>
<aside id="side" style="display:none">
  <h2>DigiBaku Admin</h2>
  <button data-t="dash">Dashboard</button>
  <button data-t="prod">Məhsullar</button>
  <button data-t="ord">Sifarişlər</button>
  <button data-t="faq">FAQ</button>
  <button data-t="rev">Rəylər</button>
  <button data-t="set">Ayarlar</button>
  <button onclick="sessionStorage.clear();location.reload()">Çıxış</button>
</aside>
<main id="main"></main>

<script>
const PASS='admin123';
const KEY='digibaku_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=JSON.parse(localStorage.getItem(KEY));
const save=()=>localStorage.setItem(KEY,JSON.stringify(D));
const STATUSES=['Cavab gözləyir','Təsdiqləndi','Hazırdır','Hazırlanır','Ləğv edildi'];

function boot(){
  if(!D){ $('#main').innerHTML='<div class="box">Əvvəlcə <b>index.html</b> faylını eyni brauzerdə bir dəfə açın.</div>'; $('#side').style.display='block'; return; }
  $('#login').style.display='none';
  $('#side').style.display='block';
  show('dash');
}
document.querySelectorAll('aside button[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('aside button').forEach(x=>x.classList.remove('on'));b.classList.add('on');show(b.dataset.t)});

function show(t){
  ({dash,prod,ord,faq,rev,set}[t])();
}

function dash(){
  const act=D.orders.filter(o=>o.status!=='Ləğv edildi');
  const rev=act.reduce((s,o)=>s+(Number(o.price)||0),0);
  const today=new Date().toLocaleDateString('az-AZ');
  const todayOrders=D.orders.filter(o=>o.date.startsWith(today)).length;
  const pendingOrd=D.orders.filter(o=>o.status==='Cavab gözləyir').length;
  const pendingRev=D.reviews.filter(r=>r.status==='pending').length;
  const counts={};D.orders.forEach(o=>counts[o.product]=(counts[o.product]||0)+1);
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  $('#main').innerHTML=`<h1>Dashboard</h1>
  <div class="cards">
    <div class="stat">Ümumi sifariş<b>${D.orders.length}</b></div>
    <div class="stat">Bu gün<b>${todayOrders}</b></div>
    <div class="stat">Gəlir (₼)<b>${rev.toFixed(2)}</b></div>
    <div class="stat">Gözləyən sifariş<b>${pendingOrd}</b></div>
    <div class="stat">Təsdiq gözləyən rəy<b>${pendingRev}</b></div>
  </div>
  <div class="box"><h3 style="margin-bottom:10px">Ən çox satılan məhsullar</h3>
    ${top.length?top.map(([n,c])=>`<div class="row" style="justify-content:space-between;padding:6px 0"><span>${esc(n)}</span><b>${c}</b></div>`).join(''):'<p class="muted">Hələ sifariş yoxdur.</p>'}
  </div>
  <div class="box"><h3 style="margin-bottom:10px">Son sifarişlər</h3>${D.orders.slice(0,5).map(o=>`<div class="row" style="justify-content:space-between;padding:6px 0"><span>${esc(o.product)} · ${esc(o.customer)}</span><span class="muted">${esc(o.status)}</span></div>`).join('')||'<p class="muted">Yoxdur.</p>'}</div>`;
}

function prod(editSlug){
  const p=editSlug?D.products.find(x=>x.slug===editSlug):null;
  const list=`<table><tr><th>Məhsul</th><th>Kateqoriya</th><th>Paketlər</th><th>Aktiv</th><th></th></tr>
  ${D.products.map(x=>`<tr><td>${esc(x.icon)} ${esc(x.name)}<div class="muted">/products/${esc(x.slug)}</div></td><td>${esc(x.cat)}</td><td>${x.plans.map(pl=>esc(pl.name)+' '+(pl.price==null?'—':pl.price+' ₼')).join('<br>')}</td>
  <td><input type="checkbox" ${x.active?'checked':''} onchange="toggleProd('${esc(x.slug)}',this.checked)"></td>
  <td class="row"><button class="btn ghost" onclick="prod('${esc(x.slug)}')">Redaktə</button><button class="btn danger" onclick="delProd('${esc(x.slug)}')">Sil</button></td></tr>`).join('')}
  </table>`;
  const plansTxt=p?p.plans.map(pl=>`${pl.name}|${pl.dur}|${pl.price??''}|${pl.old??''}`).join('\n'):'Standart|1 ay||';
  $('#main').innerHTML=`<h1>Məhsullar</h1>
  <div class="box">
    <h3 style="margin-bottom:12px">${p?'Məhsulu redaktə et':'Yeni məhsul'}</h3>
    <form class="grid2" onsubmit="saveProd(event,${p?`'${esc(p.slug)}'`:'null'})">
      <label>Ad<input name="name" required value="${esc(p?.name)}"></label>
      <label>Slug (URL, yalnız a-z, 0-9, -)<input name="slug" required pattern="[a-z0-9-]+" value="${esc(p?.slug)}"></label>
      <label>Kateqoriya<select name="cat">${D.categories.map(c=>`<option ${p?.cat===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
      <label>İkon (emoji)<input name="icon" value="${esc(p?.icon||'🎁')}"></label>
      <label>Rəng<input type="color" name="color" value="${p?.color||'#FF6A3D'}"></label>
      <label style="grid-column:1/-1">Təsvir<textarea name="desc" rows="3">${esc(p?.desc)}</textarea></label>
      <label style="grid-column:1/-1">Üstünlüklər (hər sətirdə bir)<textarea name="perks" rows="3">${esc(p?.perks.join('\n'))}</textarea></label>
      <label style="grid-column:1/-1">Paketlər (hər sətirdə: Ad|müddət|qiymət|köhnə qiymət)<textarea name="plans" rows="4">${esc(plansTxt)}</textarea></label>
      <label class="row"><input type="checkbox" name="active" style="width:auto" ${!p||p.active?'checked':''}> Aktiv</label>
      <div class="row" style="grid-column:1/-1"><button class="btn">Yadda saxla</button>${p?'<button type="button" class="btn ghost" onclick="prod()">Ləğv et</button>':''}</div>
    </form>
  </div>${list}`;
}
function saveProd(e,oldSlug){
  e.preventDefault(); const f=e.target;
  const plans=f.plans.value.split('\n').filter(Boolean).map(l=>{const [name,dur,price,old]=l.split('|').map(s=>s.trim());return {name,dur,price:price===''||isNaN(+price)?null:+price,old:old?+old:null}});
  const item={name:f.name.value,slug:f.slug.value,cat:f.cat.value,icon:f.icon.value,color:f.color.value,desc:f.desc.value,perks:f.perks.value.split('\n').map(s=>s.trim()).filter(Boolean),plans,active:f.active.checked};
  if(D.products.some(x=>x.slug===item.slug&&x.slug!==oldSlug)){alert('Bu slug artıq var');return}
  if(oldSlug){const i=D.products.findIndex(x=>x.slug===oldSlug);D.products[i]=item}else D.products.push(item);
  save(); prod();
}
function toggleProd(slug,v){const p=D.products.find(x=>x.slug===slug);p.active=v;save()}
function delProd(slug){if(confirm('Məhsul silinsin?')){D.products=D.products.filter(x=>x.slug!==slug);save();prod()}}

function ord(){
  $('#main').innerHTML=`<h1>Sifarişlər</h1>
  <table><tr><th>Tarix</th><th>Məhsul</th><th>Müştəri</th><th>Qiymət</th><th>Status</th></tr>
  ${D.orders.map(o=>`<tr><td>${esc(o.date)}</td><td>${esc(o.product)}<div class="muted">${esc(o.plan)}</div></td><td>${esc(o.customer)}<div class="muted">${esc(o.phone)}</div></td><td>${o.price==null?'—':Number(o.price).toFixed(2)+' ₼'}</td>
  <td><select onchange="setStatus(${o.id},this.value)">${STATUSES.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="5" class="muted">Sifariş yoxdur</td></tr>'}
  </table>`;
}
function setStatus(id,s){const o=D.orders.find(x=>x.id===id);o.status=s;save()}

function faq(){
  $('#main').innerHTML=`<h1>FAQ</h1>
  <div class="box"><form class="grid2" onsubmit="addFaq(event)">
    <label>Sual<input name="q" required></label>
    <label>Kateqoriya (boş olsa "Ümumi")<input name="cat"></label>
    <label style="grid-column:1/-1">Cavab<textarea name="a" rows="3" required></textarea></label>
    <div><button class="btn">Əlavə et</button></div>
  </form></div>
  <table><tr><th>Sual</th><th>Kateqoriya</th><th>Cavab</th><th></th></tr>
  ${D.faqs.map((f,i)=>`<tr><td>${esc(f.q)}</td><td>${esc(f.cat||'Ümumi')}</td><td>${esc(f.a)}</td><td><button class="btn danger" onclick="delFaq(${i})">Sil</button></td></tr>`).join('')}</table>`;
}
function addFaq(e){e.preventDefault();const f=e.target;D.faqs.push({q:f.q.value,a:f.a.value,cat:f.cat.value});save();faq()}
function delFaq(i){D.faqs.splice(i,1);save();faq()}

function rev(){
  $('#main').innerHTML=`<h1>Rəylər</h1>
  <table><tr><th>Məhsul</th><th>Müştəri</th><th>Ulduz</th><th>Mətn</th><th>Status</th><th></th></tr>
  ${D.reviews.map(r=>`<tr><td>${esc(r.product)}</td><td>${esc(r.name)}</td><td>${r.stars}★</td><td>${esc(r.text)}</td><td>${r.status==='approved'?'Təsdiqlənib':'Gözləyir'}</td>
  <td class="row">${r.status!=='approved'?`<button class="btn" onclick="revSet(${r.id},'approved')">Təsdiq</button>`:''}<button class="btn danger" onclick="revDel(${r.id})">Sil</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Rəy yoxdur</td></tr>'}
  </table>`;
}
function revSet(id,s){D.reviews.find(r=>r.id===id).status=s;save();rev()}
function revDel(id){D.reviews=D.reviews.filter(r=>r.id!==id);save();rev()}

function set(){
  const s=D.settings;
  $('#main').innerHTML=`<h1>Ayarlar</h1>
  <div class="box"><form class="grid2" onsubmit="saveSet(event)">
    <label>Telefon<input name="phone" value="${esc(s.phone)}"></label>
    <label>WhatsApp (ölkə kodu ilə, + olmadan)<input name="wa" value="${esc(s.wa)}"></label>
    <label>Ünvan<input name="address" value="${esc(s.address)}"></label>
    <label>Banner / elan mətni<input name="promo" value="${esc(s.promo)}"></label>
    <label style="grid-column:1/-1">Haqqımızda<textarea name="about" rows="3">${esc(s.about)}</textarea></label>
    <div><button class="btn">Yadda saxla</button></div>
  </form></div>`;
}
function saveSet(e){e.preventDefault();const f=e.target;Object.assign(D.settings,{phone:f.phone.value,wa:f.wa.value,address:f.address.value,promo:f.promo.value,about:f.about.value});save();alert('Saxlanıldı')}

if(sessionStorage.s==='1') boot(); else $('#login').style.display='block';
</script>
</body>
</html>
