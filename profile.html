<!DOCTYPE html>
<html lang="az">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profilim — DigiBaku.com</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top left,#172554 0,transparent 35%),
        radial-gradient(circle at bottom right,#312e81 0,transparent 35%),
        #050505;
    color:#fff;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:92%;
    max-width:900px;
    margin:auto;
}

/* HEADER */

header{
    border-bottom:1px solid #222;
    background:rgba(5,5,5,.94);
    backdrop-filter:blur(12px);
}

.nav{
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:25px;
    font-weight:900;
    color:#3b82f6;
}

.logo span{
    color:#fff;
}

.back{
    color:#aaa;
    font-size:14px;
}

/* PROFILE */

.profile-section{
    padding:50px 0;
}

.profile-title{
    text-align:center;
    margin-bottom:30px;
}

.profile-title h1{
    font-size:36px;
    margin-bottom:8px;
}

.profile-title p{
    color:#888;
}

/* CARD */

.user-card,
.orders{
    background:#101010;
    border:1px solid #262626;
    border-radius:20px;
    padding:30px;
    margin-bottom:20px;
}

.user-top{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:25px;
}

.avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    background:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    font-weight:bold;
}

.user-info h2{
    font-size:22px;
    margin-bottom:4px;
}

.user-info p{
    color:#888;
    font-size:14px;
    word-break:break-all;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.info-box{
    background:#080808;
    border:1px solid #222;
    border-radius:12px;
    padding:18px;
}

.info-box span{
    display:block;
    color:#777;
    font-size:12px;
    margin-bottom:6px;
}

.info-box strong{
    color:#fff;
    font-size:15px;
}

.status{
    color:#6ee7b7 !important;
}

/* PRODUCTS */

.orders h2{
    margin-bottom:8px;
}

.orders-subtitle{
    color:#777;
    font-size:14px;
    margin-bottom:20px;
}

.product{
    background:#080808;
    border:1px solid #252525;
    border-radius:14px;
    padding:20px;
    margin-bottom:12px;
}

.product-name{
    font-size:19px;
    font-weight:bold;
    color:#60a5fa;
    margin-bottom:12px;
}

.product-date{
    color:#777;
    font-size:12px;
    margin-bottom:14px;
}

.account-box{
    background:#111;
    border:1px solid #333;
    border-radius:10px;
    padding:15px;
    white-space:pre-wrap;
    word-break:break-word;
    color:#ddd;
    font-size:14px;
    line-height:1.6;
}

.empty{
    background:#080808;
    border:1px solid #222;
    border-radius:12px;
    padding:25px;
    text-align:center;
    color:#777;
}

.btn{
    border:0;
    border-radius:9px;
    padding:12px 18px;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
}

.btn-primary{
    background:#2563eb;
    color:#fff;
}

.btn-dark{
    background:#151515;
    color:#fff;
    border:1px solid #333;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

#loading{
    text-align:center;
    padding:80px 20px;
    color:#888;
}

#profileContent{
    display:none;
}

@media(max-width:600px){

    .profile-title h1{
        font-size:30px;
    }

    .user-card,
    .orders{
        padding:22px;
    }

    .user-top{
        align-items:flex-start;
    }

    .avatar{
        width:58px;
        height:58px;
        font-size:22px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .actions{
        flex-direction:column;
    }

    .actions .btn{
        width:100%;
    }

}

</style>

</head>

<body>

<header>

<div class="container nav">

<a href="index.html" class="logo">
DigiBaku<span>.com</span>
</a>

<a href="index.html" class="back">
← Ana səhifə
</a>

</div>

</header>


<div id="loading">
Profil yüklənir...
</div>


<main id="profileContent">

<section class="profile-section">

<div class="container">


<div class="profile-title">

<h1>Profilim</h1>

<p>
DigiBaku.com hesab məlumatlarınız
</p>

</div>


<!-- USER -->

<div class="user-card">

<div class="user-top">

<div class="avatar" id="avatar">
?
</div>

<div class="user-info">

<h2>Hesabım</h2>

<p id="userEmail">
Yüklənir...
</p>

</div>

</div>


<div class="info-grid">

<div class="info-box">

<span>Email</span>

<strong id="emailInfo">
-
</strong>

</div>


<div class="info-box">

<span>Hesab statusu</span>

<strong class="status">
● Aktiv
</strong>

</div>


<div class="info-box">

<span>Qeydiyyat tarixi</span>

<strong id="createdDate">
-
</strong>

</div>


<div class="info-box">

<span>İstifadəçi ID</span>

<strong
id="userId"
style="font-size:11px;word-break:break-all;">
-
</strong>

</div>

</div>

</div>


<!-- MƏHSULLAR -->

<div class="orders">

<h2>
Məhsullarım
</h2>

<p class="orders-subtitle">
Satın aldığınız premium xidmətlər burada görünür.
</p>


<div id="productsList">

Yüklənir...

</div>

</div>


<!-- ACTIONS -->

<div class="user-card">

<h2 style="margin-bottom:18px;">
Hesab əməliyyatları
</h2>

<div class="actions">

<a
href="index.html"
class="btn btn-primary">

Ana səhifə

</a>


<button
onclick="logout()"
class="btn btn-dark">

Çıxış

</button>

</div>

</div>


</div>

</section>

</main>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://zeknhnkaicqkfzgnvycq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_jHvCp9fXBA_BwFqrXYpwlw_VC6C1OQk";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   PROFİL
========================= */

async function loadProfile(){

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();


    if(error){

        console.error(error);

        window.location.href =
            "login.html";

        return;
    }


    const session =
        data.session;


    if(!session){

        window.location.href =
            "login.html";

        return;
    }


    const user =
        session.user;


    /* ADMIN YOXLAMASI */

    const ADMIN_EMAIL =
        "zahidovorxan989@gmail.com";

    if (
        (user.email || "").toLowerCase().trim()
        === ADMIN_EMAIL.toLowerCase()
    ) {
        window.location.href =
            "gizli_panel.html";

        return;
    }


    /* EMAIL */

    document.getElementById(
        "userEmail"
    ).textContent =
        user.email || "-";


    document.getElementById(
        "emailInfo"
    ).textContent =
        user.email || "-";


    /* AVATAR */

    if(user.email){

        document.getElementById(
            "avatar"
        ).textContent =
            user.email
                .charAt(0)
                .toUpperCase();

    }


    /* USER ID */

    document.getElementById(
        "userId"
    ).textContent =
        user.id;


    /* TARİX */

    if(user.created_at){

        const date =
            new Date(
                user.created_at
            );


        document.getElementById(
            "createdDate"
        ).textContent =
            date.toLocaleDateString(
                "az-AZ",
                {
                    year:"numeric",
                    month:"long",
                    day:"numeric"
                }
            );

    }


    /* MƏHSULLARI YÜKLƏ */

    await loadMyProducts(user.id);


    /* GÖSTƏR */

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "profileContent"
    ).style.display =
        "block";

}


/* =========================
   MƏHSULLARIM
========================= */

async function loadMyProducts(userId){

    const list =
        document.getElementById(
            "productsList"
        );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("customer_products")
        .select(
            "id,product_name,account_info,status,created_at"
        )
        .eq(
            "user_id",
            userId
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        list.innerHTML = `

        <div class="empty">

            Məhsullar yüklənmədi.

        </div>

        `;

        return;
    }


    if(!data || data.length === 0){

        list.innerHTML = `

        <div class="empty">

            <p>
            Hazırda sifarişiniz yoxdur.
            </p>

            <br>

            <a
            href="index.html#products"
            class="btn btn-primary">

            Məhsullara bax

            </a>

        </div>

        `;

        return;
    }


    list.innerHTML = "";


    data.forEach(item => {

        const product =
            document.createElement("div");


        product.className =
            "product";


        const date =
            item.created_at
            ?
            new Date(
                item.created_at
            ).toLocaleString(
                "az-AZ"
            )
            :
            "-";


        product.innerHTML = `

        <div class="product-name">

            ${escapeHtml(
                item.product_name
            )}

        </div>


        <div class="product-date">

            Əlavə olunub:
            ${escapeHtml(date)}

        </div>


        <div class="account-box">

            ${escapeHtml(
                item.account_info
            )}

        </div>

        `;


        list.appendChild(product);

    });

}


/* =========================
   HTML TƏHLÜKƏSİZLİYİ
========================= */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   ÇIXIŞ
========================= */

async function logout(){

    await supabaseClient.auth.signOut();

    window.location.href =
        "login.html";

}


/* =========================
   BAŞLAT
========================= */

loadProfile();

</script>

</body>
</html>
