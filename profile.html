<!DOCTYPE html>
<html lang="az">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DigiBaku.com</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top left,#172554 0,transparent 35%),
        radial-gradient(circle at bottom right,#312e81 0,transparent 35%),
        #050505;
    color:#fff;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:92%;
    max-width:900px;
    margin:auto;
}

/* HEADER */

header{
    border-bottom:1px solid #222;
    background:rgba(5,5,5,.94);
    backdrop-filter:blur(12px);
}

.nav{
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:25px;
    font-weight:900;
    color:#3b82f6;
}

.logo span{
    color:#fff;
}

.header-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.back{
    color:#aaa;
    font-size:14px;
}

/* LANGUAGE */

.language{
    display:flex;
    align-items:center;
    gap:5px;
    background:#111;
    border:1px solid #292929;
    border-radius:8px;
    padding:5px 8px;
}

.language button{
    background:none;
    border:0;
    color:#777;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
    padding:4px 5px;
}

.language button.active{
    color:#60a5fa;
}

/* =========================
   WHATSAPP FLOATING BUTTON
========================= */
.whatsapp-float{position:fixed;bottom:25px;right:25px;width:60px;height:60px;background:#25d366;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 15px rgba(37,211,102,.4);z-index:9999;transition:.3s;}
.whatsapp-float:hover{transform:scale(1.1);background:#20ba5a;}
.whatsapp-float svg{width:34px;height:34px;fill:#fff;}

/* PROFILE */

.profile-section{
    padding:50px 0;
}

.profile-title{
    text-align:center;
    margin-bottom:30px;
}

.profile-title h1{
    font-size:36px;
    margin-bottom:8px;
}

.profile-title p{
    color:#888;
}

/* CARD */

.user-card,
.orders{
    background:#101010;
    border:1px solid #262626;
    border-radius:20px;
    padding:30px;
    margin-bottom:20px;
}

.user-top{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:25px;
}

.avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    background:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    font-weight:bold;
}

.user-info h2{
    font-size:22px;
    margin-bottom:4px;
}

.user-info p{
    color:#888;
    font-size:14px;
    word-break:break-all;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.info-box{
    background:#080808;
    border:1px solid #222;
    border-radius:12px;
    padding:18px;
}

.info-box span{
    display:block;
    color:#777;
    font-size:12px;
    margin-bottom:6px;
}

.info-box strong{
    color:#fff;
    font-size:15px;
}

.status{
    color:#6ee7b7 !important;
}

/* PRODUCTS */

.orders h2{
    margin-bottom:8px;
}

.orders-subtitle{
    color:#777;
    font-size:14px;
    margin-bottom:20px;
}

.product{
    background:#080808;
    border:1px solid #252525;
    border-radius:14px;
    padding:20px;
    margin-bottom:12px;
}

.product-name{
    font-size:19px;
    font-weight:bold;
    color:#60a5fa;
    margin-bottom:12px;
}

.product-date{
    color:#777;
    font-size:12px;
    margin-bottom:14px;
}

.account-box{
    background:#111;
    border:1px solid #333;
    border-radius:10px;
    padding:15px;
    white-space:pre-wrap;
    word-break:break-word;
    color:#ddd;
    font-size:14px;
    line-height:1.6;
}

.empty{
    background:#080808;
    border:1px solid #222;
    border-radius:12px;
    padding:25px;
    text-align:center;
    color:#777;
}

.btn{
    border:0;
    border-radius:9px;
    padding:12px 18px;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
}

.btn-primary{
    background:#2563eb;
    color:#fff;
}

.btn-dark{
    background:#151515;
    color:#fff;
    border:1px solid #333;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

#loading{
    text-align:center;
    padding:80px 20px;
    color:#888;
}

#profileContent{
    display:none;
}

@media(max-width:600px){

    .nav{
        flex-wrap:wrap;
        padding:12px 0;
    }

    .header-right{
        width:100%;
        justify-content:flex-end;
    }

    .profile-title h1{
        font-size:30px;
    }

    .user-card,
    .orders{
        padding:22px;
    }

    .user-top{
        align-items:flex-start;
    }

    .avatar{
        width:58px;
        height:58px;
        font-size:22px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .actions{
        flex-direction:column;
    }

    .actions .btn{
        width:100%;
        text-align:center;
    }

}

</style>

</head>

<script>

/* ==========================================
   DİL SİSTEMİ
========================================== */

const translations = {

az: {

pageTitle:"Profilim — DigiBaku.com",

profile:"Profilim",

profileSubtitle:"DigiBaku.com hesab məlumatlarınız",

myAccount:"Hesabım",

email:"Email",

accountStatus:"Hesab statusu",

active:"● Aktiv",

registrationDate:"Qeydiyyat tarixi",

userId:"İstifadəçi ID",

myProducts:"Məhsullarım",

purchasedProducts:"Satın aldığınız premium xidmətlər burada görünür.",

loading:"Yüklənir...",

profileLoading:"Profil yüklənir...",

noProducts:"Hazırda sifarişiniz yoxdur.",

viewProducts:"Məhsullara bax",

accountActions:"Hesab əməliyyatları",

home:"Ana səhifə",

backHome:"← Ana səhifə",

logout:"Çıxış",

added:"Əlavə olunub:",

error:"Xəta baş verdi."

},


ru: {

pageTitle:"Мой профиль — DigiBaku.com",

profile:"Мой профиль",

profileSubtitle:"Информация вашего аккаунта DigiBaku.com",

myAccount:"Мой аккаунт",

email:"Email",

accountStatus:"Статус аккаунта",

active:"● Активен",

registrationDate:"Дата регистрации",

userId:"ID пользователя",

myProducts:"Мои товары",

purchasedProducts:"Здесь отображаются приобретённые вами премиум-услуги.",

loading:"Загрузка...",

profileLoading:"Загрузка профиля...",

noProducts:"У вас пока нет заказов.",

viewProducts:"Посмотреть товары",

accountActions:"Действия с аккаунтом",

home:"Главная",

backHome:"← Главная",

logout:"Выйти",

added:"Добавлено:",

error:"Произошла ошибка."

},


en: {

pageTitle:"My Profile — DigiBaku.com",

profile:"My Profile",

profileSubtitle:"Your DigiBaku.com account information",

myAccount:"My Account",

email:"Email",

accountStatus:"Account status",

active:"● Active",

registrationDate:"Registration date",

userId:"User ID",

myProducts:"My Products",

purchasedProducts:"Your purchased premium services will appear here.",

loading:"Loading...",

profileLoading:"Loading profile...",

noProducts:"You have no orders yet.",

viewProducts:"View products",

accountActions:"Account actions",

home:"Home",

backHome:"← Home",

logout:"Logout",

added:"Added:",

error:"An error occurred."

}

};


/* ==========================================
   DİL FUNKSİYALARI
========================================== */

function getLanguage(){

    return localStorage.getItem("digi_language") || "az";

}


function setLanguage(lang){

    if(!translations[lang]){

        lang="az";

    }

    localStorage.setItem(
        "digi_language",
        lang
    );

    applyLanguage();

}


function t(key){

    const lang=getLanguage();

    return translations[lang]?.[key]
        || translations.az[key]
        || key;

}


/* ==========================================
   TARİX DİLİ
========================================== */

function getDateLocale(){

    const lang=getLanguage();

    if(lang==="ru"){

        return "ru-RU";

    }

    if(lang==="en"){

        return "en-US";

    }

    return "az-AZ";

}


/* ==========================================
   DİLİ SƏHİFƏYƏ TƏTBİQ ET
========================================== */

function applyLanguage(){

    const lang=getLanguage();

    document.documentElement.lang=lang;

    document.title=t("pageTitle");


    document.getElementById(
        "profileTitle"
    ).textContent=
        t("profile");


    document.getElementById(
        "profileSubtitle"
    ).textContent=
        t("profileSubtitle");


    document.getElementById(
        "myAccount"
    ).textContent=
        t("myAccount");


    document.getElementById(
        "emailLabel"
    ).textContent=
        t("email");


    document.getElementById(
        "statusLabel"
    ).textContent=
        t("accountStatus");


    document.getElementById(
        "statusValue"
    ).textContent=
        t("active");


    document.getElementById(
        "registrationLabel"
    ).textContent=
        t("registrationDate");


    document.getElementById(
        "userIdLabel"
    ).textContent=
        t("userId");


    document.getElementById(
        "myProducts"
    ).textContent=
        t("myProducts");


    document.getElementById(
        "productsSubtitle"
    ).textContent=
        t("purchasedProducts");


    document.getElementById(
        "accountActions"
    ).textContent=
        t("accountActions");


    document.getElementById(
        "homeButton"
    ).textContent=
        t("home");


    document.getElementById(
        "logoutButton"
    ).textContent=
        t("logout");


    document.getElementById(
        "backHome"
    ).textContent=
        t("backHome");


    document.getElementById(
        "loading"
    ).textContent=
        t("profileLoading");


    /* DİL DÜYMƏLƏRİ */

    document.getElementById(
        "azBtn"
    ).classList.remove("active");


    document.getElementById(
        "ruBtn"
    ).classList.remove("active");


    document.getElementById(
        "enBtn"
    ).classList.remove("active");


    const activeButton =
        document.getElementById(
            lang + "Btn"
        );


    if(activeButton){

        activeButton.classList.add("active");

    }


    /* TARİXİ YENİ DİLƏ ÇEVİR */

    if(window.profileCreatedAt){

        const date =
            new Date(
                window.profileCreatedAt
            );


        document.getElementById(
            "createdDate"
        ).textContent=
            date.toLocaleDateString(
                getDateLocale(),
                {
                    year:"numeric",
                    month:"long",
                    day:"numeric"
                }
            );

    }


    /* MƏHSULLARI YENİ DİLLƏ YENİLƏ */

    if(window.currentProductsData){

        renderProducts(
            window.currentProductsData
        );

    }

}


/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://zeknhnkaicqkfzgnvycq.supabase.co";


const SUPABASE_KEY =
"sb_publishable_jHvCp9fXBA_BwFqrXYpwlw_VC6C1OQk";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==========================================
   PROFİL
========================================== */

async function loadProfile(){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getSession();


    if(error){

        console.error(error);

        window.location.href=
            "login.html";

        return;
    }


    const session =
        data.session;


    if(!session){

        window.location.href=
            "login.html";

        return;
    }


    const user =
        session.user;


    /* EMAIL */

    document.getElementById(
        "userEmail"
    ).textContent=
        user.email || "-";


    document.getElementById(
        "emailInfo"
    ).textContent=
        user.email || "-";


    /* AVATAR */

    if(user.email){

        document.getElementById(
            "avatar"
        ).textContent=
            user.email
                .charAt(0)
                .toUpperCase();

    }


    /* USER ID */

    document.getElementById(
        "userId"
    ).textContent=
        user.id;


    /* QEYDİYYAT TARİXİ */

    if(user.created_at){

        window.profileCreatedAt =
            user.created_at;


        const date =
            new Date(
                user.created_at
            );


        document.getElementById(
            "createdDate"
        ).textContent=
            date.toLocaleDateString(
                getDateLocale(),
                {
                    year:"numeric",
                    month:"long",
                    day:"numeric"
                }
            );

    }


    /* MƏHSULLARI YÜKLƏ */

    await loadMyProducts(
        user.id
    );


    /* GÖSTƏR */

    document.getElementById(
        "loading"
    ).style.display=
        "none";


    document.getElementById(
        "profileContent"
    ).style.display=
        "block";


    applyLanguage();

}


/* ==========================================
   MƏHSULLAR
========================================== */

async function loadMyProducts(
    userId
){

    const list =
        document.getElementById(
            "productsList"
        );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("customer_products")
        .select(
            "id,product_name,account_info,status,created_at"
        )
        .eq(
            "user_id",
            userId
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);


        list.innerHTML=`

        <div class="empty">

            ${t("error")}

        </div>

        `;

        return;
    }


    window.currentProductsData =
        data || [];


    renderProducts(
        window.currentProductsData
    );

}


/* ==========================================
   MƏHSULLARI GÖSTƏR
========================================== */

function renderProducts(
    data
){

    const list =
        document.getElementById(
            "productsList"
        );


    if(!list){

        return;

    }


    /* SİFARİŞ YOXDUR */

    if(
        !data ||
        data.length===0
    ){

        list.innerHTML=`

        <div class="empty">

            <p>
                ${t("noProducts")}
            </p>

            <br>

            <a
                href="index.html#products"
                class="btn btn-primary">

                ${t("viewProducts")}

            </a>

        </div>

        `;

        return;
    }


    list.innerHTML="";


    data.forEach(
        item=>{

            const product =
                document.createElement(
                    "div"
                );


            product.className=
                "product";


            /* TARİX */

            const date =
                item.created_at
                ?
                new Date(
                    item.created_at
                ).toLocaleString(
                    getDateLocale()
                )
                :
                "-";


            product.innerHTML=`

            <div class="product-name">

                ${escapeHtml(
                    item.product_name
                )}

            </div>


            <div class="product-date">

                ${escapeHtml(
                    t("added")
                )}

                ${escapeHtml(
                    date
                )}

            </div>


            <div class="account-box">

                ${escapeHtml(
                    item.account_info
                )}

            </div>

            `;


            list.appendChild(
                product
            );

        }
    );

}


/* ==========================================
   HTML TƏHLÜKƏSİZLİYİ
========================================== */

function escapeHtml(
    text
){

    return String(
        text ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* ==========================================
   ÇIXIŞ
========================================== */

async function logout(){

    await supabaseClient
        .auth
        .signOut();


    window.location.href=
        "login.html";

}


/* ==========================================
   BAŞLAT
========================================== */

applyLanguage();

loadProfile();

</script>
