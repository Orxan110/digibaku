<!DOCTYPE html>
<html lang="az">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>DigiBaku — Giriş</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:
    linear-gradient(135deg,#2563eb,#4f46e5);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:18px;
  padding:35px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.logo{
  text-align:center;
  color:#2563eb;
  font-size:30px;
  font-weight:900;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#64748b;
  margin-bottom:30px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  background:#f1f5f9;
  padding:5px;
  border-radius:9px;
  margin-bottom:25px;
}

.tabs button{
  border:0;
  padding:11px;
  border-radius:7px;
  background:transparent;
  font-weight:bold;
}

.tabs button.active{
  background:white;
  color:#2563eb;
}

.group{
  margin-bottom:16px;
}

.group label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

.group input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:8px;
  outline:none;
}

.group input:focus{
  border-color:#2563eb;
}

.submit{
  width:100%;
  height:47px;
  border:0;
  border-radius:9px;
  background:#2563eb;
  color:white;
  font-weight:bold;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  font-size:13px;
  display:none;
}

.success{
  display:block;
  background:#ecfdf5;
  color:#047857;
}

.error{
  display:block;
  background:#fef2f2;
  color:#dc2626;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#2563eb;
  text-decoration:none;
  font-size:13px;
  font-weight:bold;
}

</style>

</head>

<body>

<div class="box">

<div class="logo">
DigiBaku
</div>

<div class="subtitle">
Digital Marketplace
</div>


<div class="tabs">

<button
id="loginTab"
class="active"
onclick="showLogin()">
Giriş
</button>

<button
id="registerTab"
onclick="showRegister()">
Qeydiyyat
</button>

</div>


<form
id="loginForm"
onsubmit="login(event)">

<div class="group">

<label>Email</label>

<input
id="loginEmail"
type="email"
required
placeholder="email@example.com">

</div>

<div class="group">

<label>Şifrə</label>

<input
id="loginPassword"
type="password"
required
placeholder="••••••••">

</div>

<button class="submit">
Giriş et
</button>

</form>


<form
id="registerForm"
onsubmit="register(event)"
style="display:none">

<div class="group">

<label>Email</label>

<input
id="registerEmail"
type="email"
required
placeholder="email@example.com">

</div>

<div class="group">

<label>Şifrə</label>

<input
id="registerPassword"
type="password"
required
minlength="6"
placeholder="Minimum 6 simvol">

</div>

<button class="submit">
Hesab yarat
</button>

</form>


<div id="message"
class="message">
</div>


<a href="index.html" class="back">
← DigiBaku-ya qayıt
</a>

</div>


<script>

const SUPABASE_URL =
"https://zeknhnkaicqkfzgnvycq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_jHvCp9fXBA_BwFqrXYpwlw_VC6C1OQk";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


function showLogin(){

  document.getElementById("loginForm").style.display="block";

  document.getElementById("registerForm").style.display="none";

  document.getElementById("loginTab").classList.add("active");

  document.getElementById("registerTab").classList.remove("active");

  clearMessage();

}


function showRegister(){

  document.getElementById("loginForm").style.display="none";

  document.getElementById("registerForm").style.display="block";

  document.getElementById("loginTab").classList.remove("active");

  document.getElementById("registerTab").classList.add("active");

  clearMessage();

}


function showMessage(text,type){

  const box=document.getElementById("message");

  box.textContent=text;

  box.className="message "+type;

}


function clearMessage(){

  const box=document.getElementById("message");

  box.textContent="";

  box.className="message";

}


async function register(event){

  event.preventDefault();

  clearMessage();

  const email=document
    .getElementById("registerEmail")
    .value
    .trim();

  const password=document
    .getElementById("registerPassword")
    .value;

  const {data,error}=await supabaseClient.auth.signUp({

    email:email,

    password:password

  });

  if(error){

    showMessage(
      error.message,
      "error"
    );

    return;
  }

  if(data.user){

    showMessage(
      "Qeydiyyat uğurludur. Email təsdiqi aktivdirsə, emailini yoxla.",
      "success"
    );

    document.getElementById("registerForm").reset();

  }

}


async function login(event){

  event.preventDefault();

  clearMessage();

  const email=document
    .getElementById("loginEmail")
    .value
    .trim();

  const password=document
    .getElementById("loginPassword")
    .value;

  const {data,error}=await supabaseClient.auth.signInWithPassword({

    email:email,

    password:password

  });

  if(error){

    showMessage(
      error.message,
      "error"
    );

    return;
  }

  showMessage(
    "Giriş uğurludur. Ana səhifəyə yönləndirilirsən...",
    "success"
  );

  setTimeout(()=>{

    window.location.href="index.html";

  },800);

}

</script>

</body>
</html>
